  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var COMP = "roadmap";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var tl = gsap.timeline({ paused: true });

      /* stage-frame starts in local seconds (global minus frame 11's start); kept in sync with
         index.html by harness/post-assemble.mjs (--sync rewrites these three numbers) */
      var starts = {"11":0,"12":11.5,"13":31.5,"14":43.5,"15":60};
      var END = 71; /* frame 16 starts: the rail leaves with the blur-crossfade */

      var ids = ["11", "12", "13", "14", "15"];
      ids.forEach(function (k, i) {
        var n = i + 1, halo = $("#rm-h" + n), label = $("#rm-l" + n), text = $("#rm-l" + n + " span");
        var on = starts[k] + 0.25;
        var off = i + 1 < ids.length ? starts[ids[i + 1]] + 0.25 : END;
        var future = n >= 3; /* not yet reached: ink focus, never cobalt */
        var FOCUS = future ? { color: "#111111", fontWeight: 600 } : { color: "#1e2bfa" };
        var REST = future ? { color: "#5F5B50", fontWeight: 500 } : { color: "#5F5B50" };
        tl.set(halo, { opacity: 0, scale: 0.6 }, 0);
        tl.fromTo(halo, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, on);
        tl.fromTo(label, REST, Object.assign({ duration: 0.3, ease: "power2.out", immediateRender: false }, FOCUS), on);
        if (future) tl.fromTo(text, { borderBottomColor: "rgba(17,17,17,0)" }, { borderBottomColor: "rgba(17,17,17,1)", duration: 0.3, ease: "power2.out", immediateRender: false }, on);
        if (off < END) {
          tl.fromTo(halo, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in", immediateRender: false }, off - 0.05);
          tl.fromTo(label, FOCUS, Object.assign({ duration: 0.25, ease: "power2.in", immediateRender: false }, REST), off - 0.05);
          if (future) tl.fromTo(text, { borderBottomColor: "rgba(17,17,17,1)" }, { borderBottomColor: "rgba(17,17,17,0)", duration: 0.25, ease: "power2.in", immediateRender: false }, off - 0.05);
        }

      tl.fromTo($("#rm-plus"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, starts["14"] + 8.7);
      tl.fromTo($("#rm-rail"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, END);
      tl.to({}, { duration: 71.6 }, 0);
