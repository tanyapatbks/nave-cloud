  <script>
    (function () {
      var COMP = "11-stage1";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s, el) { return Array.prototype.slice.call((el || host).querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      /* one tile settles a short distance straight into its slot (grid-card-assemble),
         then its stroke icon draws in */
      function assemble(tile, at) {
        tl.fromTo(tile,
          { opacity: 0, y: 20, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, at);
        tl.fromTo($$("svg path", tile),
          { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out", stagger: 0.06 }, at + 0.12);
      }

      /* Scene 1 (0.0-1.8): stage header, then the purpose line */
      tl.fromTo([$("#f11-eyebrow"), $("#f11-title")],
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.3);
      tl.fromTo($("#f11-purpose"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.8);

      /* Scene 2 (1.8-4.0): the "can only" group, left column */
      tl.fromTo($("#f11-lab1"),
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.8);
      assemble($("#f11-c1"), 2.0);
      assemble($("#f11-c2"), 2.4);
      assemble($("#f11-c3"), 2.8);

      /* Scene 3 (4.0-7.4): the "still lacks" group, two columns */

        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 4.2);
      assemble($("#f11-m1"), 4.6);
      assemble($("#f11-m2"), 5.0);
      assemble($("#f11-m3"), 5.4);
      assemble($("#f11-m4"), 5.8);
      assemble($("#f11-m5"), 6.2);

      /* Scene 4 (7.4-11.5): the bridge arrow self-draws (7.4-8.0), then everything holds still */
      tl.fromTo($("#f11-shaft"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.48, ease: "power2.inOut" }, 7.4);
      tl.fromTo($("#f11-head2"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.16, ease: "power2.out" }, 7.84);

      tl.set({}, {}, 11.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
