    (function () {

      /* ---- measured stroke setup (svg-path-draw) ---- */
      /* cubic length by fixed 96-step sampling: deterministic fallback if getTotalLength fails */
      function bezLen(a, b, c, d) {
        var n = 96, len = 0, px = a[0], py = a[1];

          len += Math.sqrt((x-px)*(x-px) + (y-py)*(y-py)); px = x; py = y;
        }
        return len;

      var PULSE = 44; /* visible length of the travelling pulse dash */

        p.style.strokeDasharray = PULSE + " " + (len + PULSE + 20);
        p.style.strokeDashoffset = String(PULSE + 8);
        pulses.push(p);

      tl.fromTo(hph[1], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.46);
      var sph = $$("#f08-sub .f08-ph");

      tl.fromTo(sph[1], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.46);

      /* ---- Scene 2 (2.4-5.6): hub card + identity, chips, then the scope self-draws ---- */
      tl.fromTo("#f08-hub", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 2.40);
      tl.fromTo("#f08-avatar", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 2.45);
      tl.fromTo("#f08-name", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.55);
      tl.fromTo("#f08-chip-id", { opacity: 0, y: 8, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 3.00);
      tl.fromTo("#f08-chip-po", { opacity: 0, y: 8, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 3.40);

      /* scope: both halves draw from the top centre and close at the bottom centre */
      tl.fromTo([mL, mR], { strokeDashoffset: L_HALF + 2 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 3.60);
      tl.fromTo("#f08-pill", { opacity: 0, y: 8, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 4.00);
      tl.fromTo("#f08-scope-fill", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.20);

      /* ---- Scene 3 (5.6-8.2): satellites spring-pop on their cues; connectors draw on landing ---- */
      var cues = [5.6, 6.0, 6.4, 6.8];
      var DRAW = 0.5;

        tl.fromTo("#f08-g" + (i + 1), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, gateAt);
