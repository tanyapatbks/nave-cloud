  <script>
    (function () {
      var COMP = "10-roadmap";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      var COBALT = "#1e2bfa";
      var CREAM = "#fdfae7";
      var NOT_YET = "#6B675C";

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.4s): headline in two phrase spans at 0.3s, subline in two at 1.0s */
      tl.fromTo($$("#f10-hl .f10-ph"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.22 }, 0.3);
      tl.fromTo($$("#f10-sub .f10-ph"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.2 }, 1.0);

      /* Scene 2 (1.4-4.4s): the dashed track reveals through the clip rect (0 -> 1600, linear),
         reaching node k at 1.4 + 0.5(k-1); each node + mono label pops 0.2s later; each gloss
         card lands 0.3s after its node. */
      var clipRect = $("#f10-tclip-r");
      tl.fromTo(clipRect, { attr: { width: 0 } }, { attr: { width: 1600 }, duration: 2.0, ease: "none" }, 1.4);
      /* reveal complete: drop the clip so the track is the plain roadmap.html markup */
      tl.set($("#f10-dash"), { attr: { "clip-path": "none" }, immediateRender: false }, 3.5);

      for (var k = 1; k <= 5; k++) {
        var tNode = 1.6 + 0.5 * (k - 1);
        tl.fromTo($("#f10-n" + k),
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "50% 50%" }, tNode);
        tl.fromTo($("#f10-l" + k),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tNode + 0.05);
        tl.fromTo($("#f10-c" + k),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, tNode + 0.3);
      }
      /* node 1 fills cobalt (reached) as it appears */
      tl.fromTo($("#f10-n1"),
        { backgroundColor: CREAM, borderColor: "rgba(30,43,250,0.35)", color: "#5F5B50" },
        { backgroundColor: COBALT, borderColor: COBALT, color: CREAM, duration: 0.35, ease: "power2.out" }, 1.7);

      /* Scene 3 (4.4-7.0s), ordered so the eye is led to 'here':
         (a) the travelled fill draws x 160 -> 336 over the dashed piece (4.6-5.2s, power3.inOut) */
      var solid = $("#f10-solid");
      var LEN = 176;
      solid.style.strokeDasharray = LEN + " " + (LEN + 10);
      tl.fromTo(solid, { strokeDashoffset: LEN + 5 }, { strokeDashoffset: 0, duration: 0.6, ease: "power3.inOut" }, 4.6);
      /* fill complete: hide the dashed piece under it; the solid line returns to plain markup */
      tl.set($("#f10-dash0"), { autoAlpha: 0, immediateRender: false }, 5.2);
      tl.set(solid, { strokeDasharray: "none", immediateRender: false }, 5.2);

      /* (b) the pin lands at the fill's head (5.1-5.6s): 12px drop + scale 0.8 -> 1 about its tip.
         At scale 0.8 the pin is 43px tall, so its top starts at y 184 - 43 - 12 = 129 and never
         reaches the tracker pills (y <= 116): no clipping needed. */
      tl.fromTo($("#f10-pin"),
        { opacity: 0, y: -12, scale: 0.8 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 100%" }, 5.1);

      /* (c) one cobalt ring pulses from the tip (r 8 -> 40, 2px, opacity 0.6 -> 0, 0.6s) at 5.45s */
      var ring = $("#f10-ring");
      tl.set(ring, { visibility: "visible", immediateRender: false }, 5.45);
      tl.fromTo($("#f10-ring-c"),
        { attr: { r: 8 }, opacity: 0.6 },
        { attr: { r: 40 }, opacity: 0, duration: 0.6, ease: "power2.out" }, 5.45);
      tl.set(ring, { visibility: "hidden", immediateRender: false }, 6.05);

      /* (d) the label under the pin at 5.6s (opacity only: it is centred by a CSS translate) */
      tl.fromTo($("#f10-here"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.6);

      /* Honest card states (6.0-6.4s); the neutral skin hands over to each state skin.
         Card 1 = reached: accent-light fill, 2px cobalt border, the shared check top-right. */
      var SWAP = { duration: 0.4, ease: "power2.inOut", immediateRender: false };
      [1, 2, 3, 4, 5].forEach(function (n) {
        var card = $("#f10-c" + n);
        tl.fromTo(card.querySelector(".f10-base"), { opacity: 1 }, Object.assign({ opacity: 0 }, SWAP), 6.0);
        tl.fromTo(card.querySelector(".f10-skin:not(.f10-base)"), { opacity: 0 }, Object.assign({ opacity: 1 }, SWAP), 6.0);
      });
      tl.fromTo($("#f10-ok"),
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", transformOrigin: "50% 50%" }, 6.0);
      /* card 2 = in progress: cream fill, 2px dashed cobalt border, text #111 */
      tl.fromTo($("#f10-c2 .f10-gl"), { color: "#3F3C35" }, Object.assign({ color: "#111111" }, SWAP), 6.0);
      /* cards 3-5 = not yet: transparent, dashed #B9B4A2, text and glyph #6B675C (no opacity on text) */
      [3, 4, 5].forEach(function (n) {
        var card = $("#f10-c" + n);
        tl.fromTo(card.querySelector(".f10-gl"), { color: "#3F3C35" }, Object.assign({ color: NOT_YET }, SWAP), 6.0);
        tl.fromTo(card.querySelector(".f10-gly"), { color: COBALT }, Object.assign({ color: NOT_YET }, SWAP), 6.0);
      });
      /* the accent-light band eases in behind card 1 only */
      tl.fromTo($("#f10-band"),
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", transformOrigin: "50% 50%" }, 6.0);

      /* Scene 4 (6.4-11.0s): held checkpoint, no motion. At the frame's last instant (local 11.0 =
         global 119.1) the rail hides: the persistent roadmap.html layer (identical pixels) takes
         over at that moment; headline, subline, cards and band slide out with the frame. */
      tl.set(rail, { autoAlpha: 0, immediateRender: false }, 11.0);
      tl.to({}, { duration: 11.5 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
