  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var COMP = "10-roadmap";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      var COBALT = "#1e2bfa";
      var CREAM = "#fdfae7";
      var NOT_YET = "#6B675C";

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.4s): headline in two phrase spans at 0.3s, subline in two at 1.0s */
      tl.fromTo($$("#f10-hl .f10-ph"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.22 }, 0.3);
      tl.fromTo($$("#f10-sub .f10-ph"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.2 }, 1.0);

      /* Scene 2 (1.4-4.4s): the dashed track reveals through the clip rect (0 -> 1600, linear),
         reaching node k at 1.4 + 0.5(k-1); each node + mono label pops 0.2s later; each gloss
         card lands 0.3s after its node. */
      var clipRect = $("#f10-tclip-r");
      tl.fromTo(clipRect, { attr: { width: 0 } }, { attr: { width: 1600 }, duration: 2.0, ease: "none" }, 1.4);
      /* reveal complete: drop the clip so the track is the plain roadmap.html markup */
      tl.set($("#f10-dash"), { attr: { "clip-path": "none" }, immediateRender: false }, 3.5);

      for (var k = 1; k <= 5; k++) {
        var tNode = 1.6 + 0.5 * (k - 1);
        tl.fromTo($("#f10-n" + k),
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "50% 50%" }, tNode);
        tl.fromTo($("#f10-l" + k),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tNode + 0.05);
        tl.fromTo($("#f10-c" + k),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, tNode + 0.3);
      }
      /* node 1 fills cobalt (reached) as it appears */
      tl.fromTo($("#f10-n1"),
        { backgroundColor: CREAM, borderColor: "rgba(30,43,250,0.35)", color: "#5F5B50" },
        { backgroundColor: COBALT, borderColor: COBALT, color: CREAM, duration: 0.35, ease: "power2.out" }, 1.7);

      /* Scene 3 (4.4-7.0s): the pin drops onto the track at x 360 (expo.out, no bounce; the
         short drop keeps it below the y 130 header keep-out) */
      tl.fromTo($("#f10-pin"),
        { opacity: 0, y: -16, scale: 0.8 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "50% 100%" }, 4.8);
      /* its label under it at 5.4s (opacity only: the label is centred by a CSS translate) */
      tl.fromTo($("#f10-here"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.4);

      /* travelled segment x 160 -> 360 fills solid cobalt over the dashed piece (5.4-6.0s) */
      var solid = $("#f10-solid");
      var LEN = 200;
      solid.style.strokeDasharray = LEN + " " + (LEN + 10);
      tl.fromTo(solid, { strokeDashoffset: LEN + 5 }, { strokeDashoffset: 0, duration: 0.6, ease: "power3.inOut" }, 5.4);
      /* fill complete: hide the dashed piece under it, and the solid line returns to plain markup */
      tl.set($("#f10-dash0"), { autoAlpha: 0, immediateRender: false }, 6.0);
      tl.set(solid, { strokeDasharray: "none", immediateRender: false }, 6.0);

      /* cards 3-5 recolour to "not yet" (6.0-6.4s): solid tinted skin hands over to the dashed
         transparent skin; text and glyph recolour (no opacity dimming on text) */
      [3, 4, 5].forEach(function (n) {
        var card = $("#f10-c" + n);
        tl.fromTo(card.querySelector(".f10-on"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 6.0);
        tl.fromTo(card.querySelector(".f10-off"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 6.0);
        tl.fromTo(card.querySelector(".f10-gl"), { color: "#3F3C35" }, { color: NOT_YET, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 6.0);
        tl.fromTo(card.querySelector(".f10-gly"), { color: COBALT }, { color: NOT_YET, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 6.0);
      });
      /* the accent-light band eases in behind cards 1-2 */
      tl.fromTo($("#f10-band"),
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", transformOrigin: "50% 50%" }, 6.0);

      /* Scene 4 (7.0-12.0s): held checkpoint, no motion. At the frame's last instant the rail
         hides: the persistent roadmap.html layer (identical pixels) takes over at global 121.0. */
      tl.set($("#f10-rail"), { autoAlpha: 0, immediateRender: false }, 12.0);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
