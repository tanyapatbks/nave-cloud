  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var COMP = "02-challenge";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };
      var measure = function (p, fallback) {
        var len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        return len > 0 ? len : fallback;
      };

      var COBALT = "#1e2bfa";
      var ACCENT_LIGHT = "rgba(30,43,250,0.08)";
      var ACCENT_LIGHT_ON_CREAM = "#EBE9E9"; /* the same colour, opaque: an opaque fill must not interpolate through alpha */
      var OUT = 160; /* puzzle pieces start this far outward from their final slots */

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.2s): headline, two phrase spans */
      tl.fromTo($$("#f02-h2 .f02-ph"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.22 }, 0.3);

      /* Scene 2 (1.2-3.6s): service cards cascade into their slots (grid-card-assemble:
         fade + short slide directly into the slot, no scatter) */
      [["#f02-c1", 1.2], ["#f02-c2", 1.7], ["#f02-c3", 2.0]].forEach(function (c) {
        tl.fromTo($(c[0]),
          { opacity: 0, y: 26, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, c[1]);
      });

      /* bracket self-draws beside cards 2-3, then the caption reveals right of it */
      var brk = $("#f02-brk-p");
      var brkLen = measure(brk, 340);
      /* gap longer than the path and offset past its start, so no round-cap dot shows before the draw */
      brk.style.strokeDasharray = brkLen + " " + (brkLen + 6);
      tl.fromTo(brk, { strokeDashoffset: brkLen + 3 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 2.05);
      tl.fromTo($("#f02-cap .f02-ph"),
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.4);

      /* Scene 3 (3.6-7.0s): the cards step back to supporting (recolour, never opacity on text) */
      tl.to($$("#f02-c2 .f02-ab, #f02-c3 .f02-ab"), { color: "#6B675C", duration: 0.5, ease: "power2.out" }, 3.6);

      /* the question, line 1 at 4.0s, line 2 at 4.6s, per phrase */
      tl.fromTo($$("#f02-q1 .f02-ph"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.18 }, 4.0);
      tl.fromTo($$("#f02-q2 .f02-ph"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.16 }, 4.6);

      /* puzzle pieces fade in 160px outward of their slots: the technology piece with line 1,
         the Navy piece with line 2 */
      var pl = $("#f02-pl");
      var pr = $("#f02-pr");
      tl.fromTo(pl, { opacity: 0, x: -OUT, y: 16 }, { opacity: 1, x: -OUT, y: 0, duration: 0.6, ease: "power3.out" }, 4.1);
      tl.fromTo(pr, { opacity: 0, x: OUT, y: 16 }, { opacity: 1, x: OUT, y: 0, duration: 0.6, ease: "power3.out" }, 4.7);

      /* 5.4-6.4s: the pieces slide together and lock */
      var SLIDE = 5.4, LOCK = 6.4;
      tl.fromTo(pl, { x: -OUT }, { x: 0, duration: LOCK - SLIDE, ease: "power3.inOut", immediateRender: false }, SLIDE);
      tl.fromTo(pr, { x: OUT }, { x: 0, duration: LOCK - SLIDE, ease: "power3.inOut", immediateRender: false }, SLIDE);

      /* at contact the seam fades out: both fills ease to the shared accent-light fill while the
         two outlines hand over to the single joined outline */
      tl.to($("#f02-pl-shape"), { fill: ACCENT_LIGHT, duration: 0.5, ease: "power2.out" }, LOCK);
      tl.to($("#f02-pr-shape"), { fill: ACCENT_LIGHT_ON_CREAM, stroke: COBALT, duration: 0.5, ease: "power2.out" }, LOCK);
      tl.fromTo([$("#f02-pl-shape"), $("#f02-pr-shape")], { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.inOut", immediateRender: false }, LOCK + 0.05);
      tl.fromTo($("#f02-pzj"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.inOut" }, LOCK + 0.05);

      /* the left Navy card pulses once */
      var c1 = $("#f02-c1");
      tl.fromTo(c1, { scale: 1 }, { scale: 1.04, duration: 0.2, ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, LOCK);
      tl.to(c1, { scale: 1, duration: 0.32, ease: "power2.inOut", immediateRender: false }, LOCK + 0.2);
      tl.fromTo(c1, { backgroundColor: "rgba(30,43,250,0.04)" }, { backgroundColor: "rgba(30,43,250,0.15)", duration: 0.2, ease: "power2.out", immediateRender: false }, LOCK);
      tl.to(c1, { backgroundColor: "rgba(30,43,250,0.04)", duration: 0.4, ease: "power2.inOut", immediateRender: false }, LOCK + 0.2);

      /* Scene 4 (7.0-11.5s): three criteria chips land left to right, then hold still from 8.4s */
      [["#f02-k1", 7.0], ["#f02-k2", 7.4], ["#f02-k3", 7.8]].forEach(function (k) {
        var chip = $(k[0]);
        tl.fromTo(chip, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, k[1]);
        tl.fromTo(chip.querySelector(".f02-dot"),
          { scale: 0 },
          { scale: 1, duration: 0.4, ease: "expo.out", transformOrigin: "50% 50%" }, k[1] + 0.12);
      });

      tl.set({}, {}, 11.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
