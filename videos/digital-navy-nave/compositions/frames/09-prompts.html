      <span class="f09-sp" id="f09-wait"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></svg><span class="f09-spt">รออนุมัติ</span></span>

      <div id="f09-memo"><span class="f09-band"></span><span class="f09-dl" style="top:12px;width:19px"></span><span class="f09-dl" style="top:19px;width:15px"></span><span class="f09-dl" style="top:26px;width:19px"></span><span class="f09-dl" style="top:33px;width:11px"></span></div>
      <span class="f09-mb" style="top:164.5px;width:176px;height:12px;background:rgba(107,107,107,0.45)"></span>

    <div class="f09-unit f09-tint" id="f09-u2"><span class="f09-ub" style="left:14px"></span><span class="f09-ub" style="left:29px"></span><span class="f09-ub" style="left:44px"></span><span class="f09-umd"><span style="top:6px;width:14px"></span><span style="top:12px;width:11px"></span><span style="top:18px;width:14px"></span></span></div>

    <div id="f09-note">

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var COMP = "09-prompts";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s, root) { return Array.prototype.slice.call((root || host).querySelectorAll(s)); };
      var tl = gsap.timeline({ paused: true });

      /* status icon markup (spinner arc over a faint track, then the shared check on a success disc), same for all four slots */
      var ICON = '<span class="f09-spin"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="rgba(30,43,250,0.15)" stroke-width="3"/>' +
        '<circle cx="16" cy="16" r="12" fill="none" stroke="#1e2bfa" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 100" transform="rotate(-90 16 16)"/></svg></span>' +
        '<span class="f09-done"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path class="f09-ck" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
      $$(".f09-ico").forEach(function (el) { el.innerHTML = ICON; });

      /* caret / state steps: finite opacity steps (never repeat); the first tween per element renders its from-state */
      var STEP = 0.04;
      function step(el, from, to, at, first) {
        tl.fromTo(el, { opacity: from }, { opacity: to, duration: STEP, ease: "power2.out", immediateRender: !!first }, at);
      }

      /* self-draw prep: one dash the length of the path; offset len+2 hides it fully */
      function prep(p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len + " " + (len + 4);
        p.style.strokeDashoffset = String(len + 2);
        return len;
      }

      /* per-word typing: each whole word span appears at its time, the caret jumps to the end of the newest word */
      function typeLine(line, t0, gap, sendAt, caretOn) {
        var c0 = line.querySelector(".f09-c0");
        var words = $$(".f09-w", line);
        var at = words.map(function (w, k) { return +(t0 + k * gap).toFixed(3); });
        caretOn.forEach(function (t, k) { step(c0, k % 2 ? 1 : 0, k % 2 ? 0 : 1, t, k === 0); });
        step(c0, 1, 0, at[0]);
        words.forEach(function (w, k) {
          tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power2.out" }, at[k]);
          var caret = w.querySelector(".f09-caret");
          step(caret, 0, 1, at[k], true);
          step(caret, 1, 0, k + 1 < words.length ? at[k + 1] : sendAt);
        });
      }

      /* send press (component 5): scale 0.92 -> 1, power2, no overshoot */
      var send = $("#f09-send");
      function pressSend(at, first) {
        tl.fromTo(send, { scale: 1, backgroundColor: "#1e2bfa" }, { scale: 0.92, backgroundColor: "#1620c4", duration: 0.12, ease: "power2.in", immediateRender: !!first }, at);
        tl.fromTo(send, { scale: 0.92, backgroundColor: "#1620c4" }, { scale: 1, backgroundColor: "#1e2bfa", duration: 0.42, ease: "power2.out", immediateRender: false }, at + 0.12);
      }

      /* status icon: the spinner arc turns, then resolves into the shared check on a success disc */
      function resolve(box, at, doneAt) {
        var spin = box.querySelector(".f09-spin"), done = box.querySelector(".f09-done"), ck = box.querySelector(".f09-ck");
        tl.fromTo(spin, { rotation: 0 }, { rotation: 600 * (doneAt + 0.12 - at), duration: doneAt + 0.12 - at, ease: "none" }, at);
        tl.fromTo(spin, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, doneAt);
        tl.fromTo(done, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, doneAt);
        tl.fromTo(ck, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, doneAt + 0.06);
      }

      /* ================= Scene 1 (0.0-2.6): headline, tag, composer, prompt 1 types per word, send ================= */
      tl.fromTo("#f09-hp1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo("#f09-hp2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.48);
      tl.fromTo("#f09-tag", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.6);
      tl.fromTo("#f09-card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);

      var l1 = $("#f09-l1"), l2 = $("#f09-l2");
      typeLine(l1, 1.0, 0.18, 2.5, [0.6, 0.76, 0.88]);
      pressSend(2.5, true);

      /* ================= Scene 2 (2.6-9.0): Part A ================= */
      var st1 = $("#f09-st1"), st2 = $("#f09-st2");
      tl.fromTo(st1, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 2.9);
      resolve(st1.querySelector(".f09-ico"), 2.9, 3.2);
      tl.fromTo(st2, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 3.3);
      resolve(st2.querySelector(".f09-ico"), 3.3, 3.7);

      /* the answer card opens (4.0) with the spark + heading, four grey bars stream left to right (4.1-4.8) */
      tl.fromTo("#f09-ans", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 4.0);
      tl.fromTo("#f09-ans-spark", { opacity: 0, scale: 0.5, rotation: -45 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, 4.0);
      tl.fromTo("#f09-ans-t", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.05);
      $$("#f09-ans .f09-bar").forEach(function (b, k) {
        tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 4.1 + k * 0.15);
      });

      /* citation chip + the example document tile land at the card's bottom (5.0) */
      tl.fromTo("#f09-doc", { opacity: 0, scale: 0.8, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "expo.out" }, 5.0);
      tl.fromTo("#f09-cite", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.05);

      /* the rights scope self-draws around the answer (5.4-6.0), its pill (5.6), the identity badge inside it */
      var mA = $("#f09-mA"), mB = $("#f09-mB");
      var LA = prep(mA), LB = prep(mB);
      tl.fromTo(mA, { strokeDashoffset: LA + 2 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.4);
      tl.fromTo(mB, { strokeDashoffset: LB + 2 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#f09-scope-pill", { opacity: 0, y: 8, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 5.6);
      tl.fromTo("#f09-idb", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.75);
      tl.fromTo("#f09-scope-fill", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 5.8);
      /* hold 6.2-9.0: Part A fully legible and still */

      /* ================= Scene 3 (9.0-9.6): seam ================= */
      /* Part A accelerates up 40px and fades (power3.in, 0.4s); Part B surfaces mirror it (y +40 -> 0, power3.out, 0.4s) */
      var EXIT_AT = 9.0, SEAM_DUR = 0.4, SEAM_Y = 40;
      tl.fromTo("#f09-A", { y: 0 }, { y: -SEAM_Y, duration: SEAM_DUR, ease: "power3.in", immediateRender: false }, EXIT_AT);
      tl.fromTo("#f09-A", { opacity: 1 }, { opacity: 0, duration: SEAM_DUR, ease: "power2.in", immediateRender: false }, EXIT_AT);
      /* the composer clears its text the same way, then the caret returns */
      tl.fromTo(l1, { opacity: 1, y: 0 }, { opacity: 0, y: -10, duration: 0.3, ease: "power3.in", immediateRender: false }, EXIT_AT);

      /* ================= Scene 4 (9.6-15.8): Part B ================= */
      typeLine(l2, 9.6, 0.2, 11.2, [9.35]);
      pressSend(11.2, false);

      function enterUp(el, at) {
        tl.fromTo(el, { y: SEAM_Y }, { y: 0, duration: SEAM_DUR, ease: "power3.out" }, at);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
      }

      /* checklist card and its two rows */
      enterUp($("#f09-chk"), 11.35);
      tl.fromTo("#f09-chk .f09-div", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 12.15);
      var r1 = $("#f09-r1"), r2 = $("#f09-r2");
      tl.fromTo(r1, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.6);
      resolve(r1.querySelector(".f09-ico"), 11.6, 12.0);
      tl.fromTo(r2, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.2);
      resolve(r2.querySelector(".f09-ico"), 12.2, 12.6);

      /* approval card: neutral approver, the waiting pill (12.9) */
      enterUp($("#f09-apv"), 12.75);
      var wait = $("#f09-wait"), ok = $("#f09-ok"), go = $("#f09-go");
      tl.fromTo(wait, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 12.9);

      /* approve button press (press-release-spring, smooth: linear-feel press, power2 release, no overshoot) */
      var PRESS_AT = 13.8, PRESS_DUR = 0.12, RELEASE_DUR = 0.42;
      tl.fromTo(go, { scale: 1, backgroundColor: "#1e2bfa" }, { scale: 0.92, backgroundColor: "#1620c4", duration: PRESS_DUR, ease: "power2.in" }, PRESS_AT);
      tl.fromTo(go, { scale: 0.92, backgroundColor: "#1620c4" }, { scale: 1, backgroundColor: "#1e2bfa", duration: RELEASE_DUR, ease: "power2.out", immediateRender: false }, PRESS_AT + PRESS_DUR);

      /* the pill flips to the success badge at the same left anchor (14.1) */
      tl.fromTo(wait, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.92, duration: 0.1, ease: "power2.in", immediateRender: false }, 14.0);
      tl.fromTo(ok, { opacity: 0, scale: 0.84 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 14.1);

      /* three connectors fan to three unit tiles (14.6-15.2); each tile receives the memo */
      tl.fromTo("#f09-lk-dot", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 14.55);
      ["#f09-lk1", "#f09-lk2", "#f09-lk3"].forEach(function (id, k) {
        var p = $(id), L = prep(p);
        tl.fromTo(p, { strokeDashoffset: L + 2 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 14.6 + k * 0.1);
      });
      ["#f09-u1", "#f09-u2", "#f09-u3"].forEach(function (id, k) {
        var u = $(id), md = u.querySelector(".f09-umd");
        tl.fromTo(u, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 14.8 + k * 0.1);
        tl.fromTo(md, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 14.95 + k * 0.1);
      });
      tl.fromTo("#f09-sent", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 14.8);

      /* ================= Scene 5 (15.8-19.0): the note, then still from 16.4 ================= */
      tl.fromTo("#f09-note svg", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 15.8);
      tl.fromTo("#f09-note .f09-np1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 15.8);
      tl.fromTo("#f09-note .f09-np2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.0);

      /* the frame is exactly 19s long */
      tl.to({}, { duration: 19 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
