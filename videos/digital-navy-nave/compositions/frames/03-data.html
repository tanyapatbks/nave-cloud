  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var COMP = "03-data";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      /* seeded hash in [0,1): deterministic scatter, no Math.random */
      function rnd(i, k) {
        var h = Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(k + 7, 0x85ebca77);
        h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
        h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
        h ^= h >>> 15;
        return (h >>> 0) / 4294967296;
      }

      /* ---------- unit columns (x 120-1800): centres, tile counts, pile slots ---------- */
      var CX = [288, 624, 960, 1296, 1632];
      var COUNT = [3, 4, 4, 3, 4];
      var MESSY = 2; /* column 3: the messiest pile; it shares chip q4 with column 4 */
      /* pile slot centres relative to (cx, 616), bottom tile first; S scales the whole pile (round 2: ~0.9) */
      var SLOTS = [[-30, 30], [28, 16], [-12, -14], [16, -30]];
      var S = 0.9;
      var KINDS = ["pdf", "scan", "table", "chart"];
      var BAND = { pdf: "#111111", scan: "#6b6b6b", table: "rgba(30,43,250,0.4)", chart: "rgba(30,43,250,0.4)" };
      var GLYPH = {
        pdf: '<path d="M5 2.5h8l4.5 4.5v12.5H5z M13 2.5V7h4.5"/>',
        scan: '<path d="M2.5 7V2.5H7 M15 2.5h4.5V7 M19.5 15v4.5H15 M7 19.5H2.5V15 M5.5 11h11"/>',
        table: '<rect x="2.5" y="3.5" width="17" height="15" rx="2"/><path d="M2.5 8.5h17 M2.5 13.5h17 M9 8.5v10"/>',
        chart: '<path d="M3 19.5h16 M6.5 16.5v-5 M11 16.5V6 M15.5 16.5V9"/>'
      };
      function lines(i, ys) {
        return ys.map(function (y, j) {
          var last = j === ys.length - 1;
          var w = last ? 44 + rnd(i, 10 + j) * 34 : 82 + rnd(i, 10 + j) * 20;
          return '<rect x="14" y="' + y + '" width="' + w.toFixed(1) + '" height="7" rx="3.5" fill="#9a9a9a" fill-opacity="0.7"/>';
        }).join("");
      }
      var INTERIOR = {
        pdf: function (i) { return lines(i, [56, 76, 96, 116]); },
        scan: function (i) { return '<g transform="rotate(-2.5 66 86)">' + lines(i, [56, 76, 96, 116]) + "</g>"; },
        table: function (i) {
          return '<rect x="14.75" y="48.75" width="101.5" height="14" fill="rgba(30,43,250,0.12)"/>' +
            '<rect x="14" y="48" width="103" height="66" rx="3" fill="none" stroke="#9a9a9a" stroke-width="1.6"/>' +
            '<path d="M14 63h103 M14 80h103 M14 97h103 M48 48v66 M82 48v66" stroke="#9a9a9a" stroke-width="1.4"/>' +
            lines(i, [128, 146]);
        },
        chart: function (i) {
          var bars = "";
          for (var b = 0; b < 4; b++) {
            var h = 18 + rnd(i, 90 + b) * 32;
            bars += '<rect x="' + (24 + b * 23) + '" y="' + (102 - h).toFixed(1) + '" width="15" height="' + h.toFixed(1) + '" rx="2" fill="rgba(30,43,250,0.3)"/>';
          }
          return bars + '<path d="M14 103.5h103" stroke="#9a9a9a" stroke-width="1.6"/>' + lines(i, [120, 140]);
        }
      };
      function tileSVG(i, kind) {
        return '<svg viewBox="0 0 132 172" width="63" height="83" aria-hidden="true">' +
          '<rect x="0" y="0" width="132" height="7" fill="' + BAND[kind] + '"/>' +
          '<g transform="translate(12 16) scale(1.1)" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + GLYPH[kind] + "</g>" +
          INTERIOR[kind](i) + "</svg>";
      }

      var html = "";
      var PILES = [];
      for (var c = 0; c < CX.length; c++) {
        html += '<div class="f03-unit" id="f03-u' + (c + 1) + '" style="left:' + (CX[c] - 28) + 'px"><span></span><span></span><span></span></div>';
        var pile = [];
        var messy = c === MESSY;
        var sx = messy ? 2.1 : 1, sy = messy ? 1.2 : 1;
        for (var j = 0; j < COUNT[c]; j++) {
          var id = c * 8 + j;
          var kind = KINDS[(c + j * 3) % KINDS.length];
          var sign = (j + c) % 2 ? 1 : -1;
          var rot = sign * (messy ? 5 + rnd(id, 3) : 1.5 + rnd(id, 3) * 4);
          rot = Math.max(-6, Math.min(6, rot));
          var dx = (SLOTS[j][0] * sx + (rnd(id, 1) - 0.5) * 14) * S;
          var dy = (SLOTS[j][1] * sy + (rnd(id, 2) - 0.5) * 10) * S;
          var tid = "f03-p" + (c + 1) + "-" + j;
          html += '<div class="f03-tile f03-col' + (c + 1) + '" id="' + tid + '" style="left:' + (CX[c] - 33) + 'px">' + tileSVG(id, kind) + "</div>";
          pile.push({ id: tid, x: +dx.toFixed(1), y: +dy.toFixed(1), r: +rot.toFixed(2), seed: id });
        }
        PILES.push(pile);
      }
      $("#f03-units").innerHTML = html;

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0-2.0): headline per phrase, line 1 at 0.3, line 2 at 1.1 ---------- */
      var PH = $$("#f03-h2 .f03-ph");
      [0.3, 0.48, 1.1, 1.28].forEach(function (at, i) {
        tl.fromTo(PH[i], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
      });

      /* ---------- Scene 2 (2.0-3.2): five unit columns assemble left to right, 0.12s stagger ---------- */
      PILES.forEach(function (pile, c) {
        var T = 2.0 + c * 0.12;
        tl.fromTo($("#f03-u" + (c + 1)),
          { opacity: 0, y: 16, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", transformOrigin: "50% 50%" }, T);
        pile.forEach(function (p, j) {
          tl.fromTo($("#" + p.id),
            { opacity: 0, x: p.x, y: p.y - 31, rotation: p.r * 0.4 },
            { opacity: 1, x: p.x, y: p.y, rotation: p.r, duration: 0.45, ease: "power3.out", transformOrigin: "50% 50%" },
            T + 0.08 + j * 0.06);
        });
      });

      /* ---------- Scene 3 (3.2-5.6): question chips pop on cue; each tether self-draws from its column up to the chip;
         the tiles of every column a chip serves jostle once (chip q4 serves columns 3 and 4) ---------- */
      var Q = [
        { n: 1, cols: [0], at: 3.2 },
        { n: 2, cols: [1], at: 3.8 },
        { n: 4, cols: [2, 3], at: 4.4 },
        { n: 5, cols: [4], at: 5.0 }
      ];
      Q.forEach(function (q) {
        q.cols.forEach(function (col, k) {
          var tp = $("#f03-t" + (col + 1));
          var tlen = 0;
          try { tlen = tp.getTotalLength(); } catch (e) { tlen = 0; }
          if (!(tlen > 0)) tlen = 64;
          tp.style.strokeDasharray = tlen + " " + (tlen + 12);
          tl.fromTo(tp, { strokeDashoffset: tlen }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, q.at);
          var J = q.at + 0.22 + k * 0.05;
          PILES[col].forEach(function (p, j) {
            var jx = (rnd(p.seed, 40) - 0.5) * 12 * S;
            var jy = (-3 - rnd(p.seed, 41) * 4) * S;
            var jr = (j % 2 ? 1 : -1) * (1.5 + rnd(p.seed, 42) * 1.5);
            tl.to($("#" + p.id), { x: p.x + jx, y: p.y + jy, rotation: p.r + jr, duration: 0.12, ease: "power2.out", immediateRender: false }, J + j * 0.02);
            tl.to($("#" + p.id), { x: p.x, y: p.y, rotation: p.r, duration: 0.4, ease: "power3.out", immediateRender: false }, J + 0.12 + j * 0.02);
          });
        });
        tl.fromTo($("#f03-q" + q.n),
          { opacity: 0, scale: 0, y: 12 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out", transformOrigin: "50% 100%" }, q.at);
      });

      /* ---------- Scene 4 (5.6-7.4): cobalt bracket self-draws under all columns; level label at 6.0 ---------- */
      var bp = $("#f03-brk-p");
      var blen = 0;
      try { blen = bp.getTotalLength(); } catch (e) { blen = 0; }
      if (!(blen > 0)) blen = 1614;
      /* gap longer than the path, offset into the gap: no round-cap dot before the draw starts */
      bp.style.strokeDasharray = blen + " " + (blen + 12);
      tl.fromTo(bp, { strokeDashoffset: blen + 6 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 5.6);
      tl.fromTo($("#f03-lv1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.0);
      tl.fromTo($("#f03-lv2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.2);

      /* ---------- Scene 5 (7.4-13.5): concern band, label at 7.6, chips at 8.1 / 8.6, one pulse at 9.4, hold from 9.8 ---------- */
      tl.fromTo($("#f03-s1 .f03-segbg"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 7.4);
      tl.fromTo($("#f03-s2 .f03-segbg"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power3.out" }, 8.02);
      tl.fromTo($("#f03-s3 .f03-segbg"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power3.out" }, 8.52);
      tl.fromTo($("#f03-cl1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.6);
      tl.fromTo($("#f03-cl2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.78);
      tl.fromTo($("#f03-cc1"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 50%" }, 8.1);
