  <script>
    (function () {
      var COMP = "06-mfa";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      /* chip widths (px): each chip first shows at its natural width right of its actor
         (min-width:max-content guards the estimate), then grows to FULL so its glyph end docks */
      var FULL = 806;            /* x 320 -> 1126: the glyph end centred in the 80px slot at x 1046 */
      var W1 = 276, W2 = 548, W3 = 468;
      var OPEN_L = 18, OPEN_R = 136; /* upper leaves part to a 154px gap (a 14px sliver of the right leaf stays in the frame); the left leaf (slots) barely moves */

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.4): headline per phrase; the gate draws in; empty slots appear */
      tl.fromTo($$("#f06-h2 .f06-ph"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.16 }, 0.3);
      tl.fromTo([$("#f06-outU"), $("#f06-outL")],
        { attr: { "stroke-dashoffset": 1.01 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut", stagger: 0.1 }, 0.35);
      tl.fromTo([$("#f06-doorU"), $("#f06-doorL")],
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.1 }, 0.7);
      tl.fromTo([$("#f06-lockU"), $("#f06-lockL")],
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", stagger: 0.1 }, 0.85);
      tl.fromTo([$("#f06-s1"), $("#f06-s2"), $("#f06-s3"), $("#f06-s4")],
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", stagger: 0.06 }, 0.95);

      /* Scene 2 (1.4-5.6): the signed-in person; two factors dock; the upper door opens */
      tl.fromTo($("#f06-avatar"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.4);
      tl.fromTo($("#f06-name"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.5);

      /* a chip slides out from behind its actor at natural width, then its glyph end travels
         right (the chip grows) until it sits in the slot; the slot turns green with the check */
      function dock(chip, slot, w0, at, travelAt, land) {
        tl.fromTo(chip, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at);
        tl.fromTo(chip, { x: -40 }, { x: 0, duration: 0.35, ease: "power3.out" }, at);
        tl.fromTo(chip, { width: w0 }, { width: FULL, duration: land - travelAt, ease: "power3.inOut" }, travelAt);
        tl.fromTo(slot.querySelector(".f06-sout"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, land - 0.02);
        tl.fromTo(slot.querySelector(".f06-sfill"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, land - 0.02);
        tl.fromTo(slot.querySelector(".f06-ck"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.25, ease: "power2.out" }, land + 0.06);
      }
      dock($("#f06-chip1"), $("#f06-s1"), W1, 2.0, 2.15, 2.7);
      dock($("#f06-chip2"), $("#f06-s2"), W2, 2.9, 3.05, 3.6);

      /* both factors in (3.6): the upper padlock's shackle lifts open and the lock turns green */
      tl.fromTo($("#f06-shkU"), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, 3.6);
      tl.fromTo($("#f06-shkUo"), { opacity: 0, y: 5 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.6);
      tl.fromTo([$("#f06-bodyU"), $("#f06-stemU")], { stroke: "#1e2bfa" }, { stroke: "#0B6A45", duration: 0.25, ease: "power2.out" }, 3.6);
      tl.fromTo($("#f06-holeU"), { fill: "#1e2bfa" }, { fill: "#0B6A45", duration: 0.25, ease: "power2.out" }, 3.6);
