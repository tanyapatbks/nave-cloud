      tl.fromTo($("#f06-name"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.5);

        tl.fromTo(chip, { x: -dist }, { x: 0, duration: 0.7, ease: "power3.out" }, at);
        tl.fromTo(chip, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, at);
        var land = at + 0.68;
