    (function () {
      var COMP = "16-close";

      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };
      var SVGNS = "http://www.w3.org/2000/svg";

      /* atmosphere: the 3x3 cobalt dot grid at frame 01's exact place (x 1664-1776, y 196-308), 12% opacity */
      var GX = [1664, 1720, 1776], GY = [196, 252, 308];
      var dotsG = $("#f16-dots");
      GY.forEach(function (y) {
        GX.forEach(function (x) {
          var c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 6);
          c.setAttribute("fill", "#1e2bfa"); c.setAttribute("fill-opacity", "0.12");
          c.setAttribute("class", "f16-dot");
          dotsG.appendChild(c);
        });
      });

      var tl = gsap.timeline({ paused: true });

      /* phrase reveal (the series' per-phrase idiom): whole spans rise 18px and fade in, power3.out */
      function phrases(els, at, gap) {
        tl.fromTo(els,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: gap }, at);
      }

      /* =========== Scene 1 (0.0-1.9s): atmosphere settles under the blur-crossfade; line 1 per phrase at 0.7s =========== */
      tl.fromTo("#f16-rings", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0);
      tl.fromTo($$("#f16-dots .f16-dot"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.05 }, 0.25);
      phrases([$("#f16-l1a"), $("#f16-l1b")], 0.7, 0.2);

      /* callback to frame 01: once "Digital Navy" has settled (1.2s), its underline self-draws left to right
         (1.2-1.6s, power2.out); the same idiom as frame 01 (measured length, dash offset, a 0.02s opacity gate) */
      var ulPath = $("#f16-ul path");
      var ulLen = ulPath.getTotalLength();
      ulPath.style.strokeDasharray = ulLen + " " + (ulLen + 20);
      ulPath.style.strokeDashoffset = String(ulLen);
      tl.fromTo("#f16-ul", { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "power2.out" }, 1.2);
      tl.fromTo(ulPath, { strokeDashoffset: ulLen }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.2);

      /* =========== Scene 2 (1.9-4.8s): line 2, per phrase - first authored line at 1.9s, second at 3.1s =========== */
      phrases($$("#f16-l2a > .f16-ph"), 1.9, 0.26);
      phrases($$("#f16-l2b > .f16-ph"), 3.1, 0.26);

      /* =========== Scene 3 (4.8-8.0s): line 3 per phrase at 4.8s; the wordmark assembles at 6.0s; chip at 6.6s =========== */
      phrases([$("#f16-l3a"), $("#f16-l3b")], 4.8, 0.26);

      /* frame 05's build, shortened: the cobalt rule draws from its centre, then NAVE and the Thai word rise in */
      var WM_AT = 6.0;
      tl.fromTo("#f16-wm-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.34, ease: "power3.out" }, WM_AT);
      tl.fromTo("#f16-wm-en", { y: 22, scale: 0.97 }, { y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, WM_AT + 0.08);
      tl.fromTo($$("#f16-wm-en .f16-lt"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.045 }, WM_AT + 0.08);
      tl.fromTo("#f16-wm-th", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, WM_AT + 0.2);

      tl.fromTo("#f16-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.6);

      /* =========== Scene 4 (8.0-14.0s): eyebrow at 8.0s, the department credit per line from 8.2s, then still =========== */
      tl.fromTo("#f16-eb1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 8.0);
      tl.fromTo("#f16-cr1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.2);

      /* held read: the last tween ends at 8.9s, everything is still to the film's last frame (5.1s); no fade-out */
      tl.set({}, {}, 14);

    })();
