    (function () {
      var COMP = "16-close";

      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      /* atmosphere: the 3x3 cobalt dot grid at frame 01's exact place (x 1664-1776, y 196-308), 12% opacity */

      var tl = gsap.timeline({ paused: true });

      /* phrase reveal (the series' per-phrase idiom): whole spans rise 18px and fade in, power3.out */
      function phrases(els, at, gap) {
        tl.fromTo(els,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: gap }, at);
      }

      /* =========== Scene 1 (0.0-1.9s): atmosphere settles under the blur-crossfade; line 1 per phrase at 0.7s =========== */

      tl.fromTo($$("#f16-dots .f16-dot"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.05 }, 0.25);
      phrases([$("#f16-l1a"), $("#f16-l1b")], 0.7, 0.2);

      /* =========== Scene 2 (1.9-4.8s): line 2, per phrase - first authored line at 1.9s, second at 3.1s =========== */

      /* =========== Scene 3 (4.8-8.0s): line 3 per phrase at 4.8s; the wordmark assembles at 6.0s; chip at 6.6s =========== */
      phrases([$("#f16-l3a"), $("#f16-l3b")], 4.8, 0.26);

      /* frame 05's build, shortened: the cobalt rule draws from its centre, then NAVE and the Thai word rise in */

      tl.fromTo($$("#f16-wm-en .f16-lt"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.045 }, WM_AT + 0.08);
      tl.fromTo("#f16-wm-th", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, WM_AT + 0.2);

      tl.fromTo("#f16-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.6);

      /* =========== Scene 4 (8.0-14.0s): eyebrow at 8.0s, the department credit per line from 8.2s, then still =========== */

      tl.fromTo("#f16-cr1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.2);
