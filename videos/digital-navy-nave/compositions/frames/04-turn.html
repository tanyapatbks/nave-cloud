  </style>
  <style>
    #root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";}
    #f04-bg{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#fdfae7;}

    /* faint question marks (callback to frame 03) - behind all type */
    #f04-qs{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;}
    .f04-q{position:absolute;left:0;top:0;display:block;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:72px;line-height:1.2;color:#3F3C35;white-space:nowrap;opacity:0;}

    #f04-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:2;}
    .f04-line{display:block;white-space:nowrap;}
    .f04-ph{display:inline-block;}

    /* Scene 1 hard beat: Display 500 200px, box centred on y 460 (290px box, top 315); settles at 96px centred y 330 */
    #f04-but{position:absolute;left:0;top:315px;width:1920px;height:290px;text-align:center;font-family:"Chulabhorn Likit Display","Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:200px;line-height:1.45;color:#111111;transform-origin:50% 50%;}

    /* Scene 2 statement: Text 700 60px, box centred on y 550 (87px box) */
    #f04-st{position:absolute;left:0;top:506px;width:1920px;text-align:center;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:60px;line-height:1.45;color:#111111;}
    #f04-s2{color:#111111;}

    /* Scene 3 payoff: Text 700 84px, box centred on y 680 (122px box) - outranks the settled 96px beat */
    #f04-pay{position:absolute;left:0;top:619px;width:1920px;text-align:center;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:84px;line-height:1.45;color:#111111;}
    #f04-row{position:relative;display:inline-block;white-space:nowrap;}

    #f04-ul{position:absolute;left:2px;right:2px;bottom:7px;height:6px;border-radius:3px;background:#1e2bfa;transform-origin:0% 50%;}

  <div id="root" data-composition-id="04-turn" data-width="1920" data-height="1080" data-start="0" data-duration="7">
    <div id="f04-bg" class="clip" data-start="0" data-duration="7" data-track-index="0"></div>

    <div id="f04-qs" aria-hidden="true">
      <span class="f04-q">?</span>
      <span class="f04-q">?</span>
      <span class="f04-q">?</span>
      <span class="f04-q">?</span>

      <span class="f04-q">?</span>
      <span class="f04-q">?</span>
      <span class="f04-q">?</span>
      <span class="f04-q">?</span>
    </div>

    <div id="f04-stage">
      <div id="f04-but"><span class="f04-line">แต่!</span></div>

      <div id="f04-st"><span class="f04-line"><span class="f04-ph" id="f04-s1">สิ่งที่เห็น</span> <span class="f04-ph" id="f04-s2">กลับไม่ใช่ปัญหา</span></span></div>

      <div id="f04-pay"><span class="f04-line"><span id="f04-row"><span class="f04-ph" id="f04-p1">แต่คือ</span><span class="f04-ph" id="f04-p2">โอกาส<span id="f04-ul"></span></span><span id="f04-spark"><svg viewBox="0 0 30 30" width="40" height="40" aria-hidden="true"><path d="M15 0C16 9 21 14 30 15C21 16 16 21 15 30C14 21 9 16 0 15C9 14 14 9 15 0Z" fill="#1e2bfa"/></svg></span></span></span></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var COMP = "04-turn";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      // Fixed integer hash of (index, channel) -> [0,1). Deterministic, no Math.random.
      var seeded = function (i, k) {
        var t = (Math.imul(i + 1, 374761393) + Math.imul(k + 7, 668265263)) | 0;
        t = Math.imul(t ^ (t >>> 13), 1274126177);
        t = t ^ (t >>> 16);
        return (t >>> 0) / 4294967296;
      };
      var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

      // Question-mark anchor cells around the empty frame (kept off the three text bands and
      // the payoff column x ~730-1250), jittered by the seeded hash. Centres stay inside
      // x 140-1780, y 210-800, so every glyph box sits inside x 96-1824 / y 150-860.
      var CELLS = [
        [220, 270], [520, 225], [1430, 235], [1720, 310], [165, 530],
        [1755, 545], [330, 770], [620, 800], [1330, 805], [1600, 760]
      ];
      // Spark centre (converge target): right of the 84px payoff word, measured from the layout.
      var TX = 1226, TY = 671;

      var qs = $$("#f04-qs .f04-q");
      var Q = qs.map(function (el, i) {
        var c = CELLS[i];
        var q = {
          el: el,
          cx: clamp(c[0] + (seeded(i, 1) - 0.5) * 90, 140, 1780),
          cy: clamp(c[1] + (seeded(i, 2) - 0.5) * 70, 210, 800),
          fs: Math.round(60 + seeded(i, 3) * 30),
          rot: Math.round(-14 + seeded(i, 4) * 28),
          op: 0.12 + seeded(i, 5) * 0.06,
          order: seeded(i, 6)
        };
        gsap.set(el, { left: q.cx, top: q.cy, fontSize: q.fs, xPercent: -50, yPercent: -50, rotation: q.rot, opacity: 0 });
        return q;
      });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.3s): faint "?" marks settle in under the crossfade; the hard beat lands 0.6-1.0s.
      Q.forEach(function (q, i) {
        tl.fromTo(q.el, { opacity: 0, y: 10 }, { opacity: q.op, y: 0, duration: 0.5, ease: "power2.out" }, 0.05 + i * 0.03);
      });
      tl.fromTo("#f04-but", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 0.6);

      // Scene 2 (1.3-2.6s): the beat eases up and shrinks to ~96px at y 330; the statement reveals per phrase from 1.4s.
      tl.fromTo("#f04-but", { scale: 1, y: 0 }, { scale: 0.48, y: -130, duration: 0.4, ease: "power3.inOut", immediateRender: false }, 1.3);
      tl.fromTo($("#f04-s1"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.4);
      tl.fromTo($("#f04-s2"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.72);

      // Scene 3 (2.6-6.5s): second phrase recedes to grey (still legible); the payoff rises on its own line.
      tl.fromTo($("#f04-s2"), { color: "#111111" }, { color: "#6B675C", duration: 0.3, ease: "power2.inOut", immediateRender: false }, 2.5);
      tl.fromTo($("#f04-p1"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.6);
      tl.fromTo($("#f04-p2"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.72);

      // The "?" marks converge on the spark point and collapse (2.7-3.4s): accelerate in, shrink,
      // brighten as they tint cobalt, and vanish on arrival (arrivals 3.14-3.29s).
      var FLY = 0.44;
      var sorted = Q.slice().sort(function (a, b) { return a.order - b.order; });
      sorted.forEach(function (q, k) {
        var at = 2.7 + k * 0.016;
        tl.fromTo(q.el,
          { x: 0, y: 0, scale: 1, rotation: q.rot },
          { x: TX - q.cx, y: TY - q.cy, scale: 0.3, rotation: 0, duration: FLY, ease: "power2.in", immediateRender: false }, at);
        tl.fromTo(q.el, { color: "#3F3C35" }, { color: "#1e2bfa", duration: 0.3, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(q.el, { opacity: q.op }, { opacity: 0.42, duration: 0.3, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(q.el, { opacity: 0.42 }, { opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, at + FLY - 0.12);
      });

      // One 40px cobalt spark blooms where the marks collapse and settles just right of the payoff word (3.14-3.4s, no overshoot).
      tl.fromTo("#f04-spark", { opacity: 0, scale: 0.2, rotation: -60 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, 3.14);

      // 6px cobalt underline self-draws under the payoff word (3.1-3.6s), left to right.
      tl.fromTo("#f04-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 3.1);

      // Hold still from 3.7s to the end of the frame (6.5s).
      tl.set({}, {}, 6.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
