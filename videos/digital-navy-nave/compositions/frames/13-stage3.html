  <script>
    (function () {
      var COMP = "13-stage3";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s, el) { return Array.prototype.slice.call((el || host).querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      /* grid-card-assemble: one tile settles a short distance straight into its slot,
         then its stroke icon draws in (svg-path-draw) */
      function assemble(tile, at) {
        tl.fromTo(tile,
          { opacity: 0, y: 20, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, at);
        tl.fromTo($$("svg path", tile),
          { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out", stagger: 0.06 }, at + 0.12);
      }

      /* Scene 1 (0.0-1.8): stage header at 0.3, purpose line per phrase from 0.8 */
      tl.fromTo([$("#f13-eyebrow"), $("#f13-title")],
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.3);
      tl.fromTo($("#f13-p1"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.8);
      tl.fromTo($("#f13-p2"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);

      /* Scene 2 (1.8-6.2): ten tiles assemble in reading order on their cues */
      var cues = [1.8, 2.25, 2.7, 3.15, 3.6, 4.05, 4.5, 4.95, 5.4, 5.85];
      var tiles = [];
      for (var i = 0; i < 10; i++) {
        tiles.push($("#f13-t" + (i + 1)));
        assemble(tiles[i], cues[i]);
      }

      /* Scene 3a (6.2-7.0): 8 connectors self-draw, column 1 top-down then column 2 */
      for (var k = 0; k < 8; k++) {
        tl.fromTo($("#f13-l" + (k + 1)),
          { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.17, ease: "power2.out" }, 6.2 + k * 0.09);
      }

      /* Scene 3b (7.0-8.2): one pulse runs through all ten in reading order. Each tile's
         border brightens and settles back; inside a column the pulse travels the link to the
         next tile; column 1 -> column 2 is a 0.12 s border hand-off (no return path). */
      for (var j = 0; j < 10; j++) {
        var t = 7.0 + j * 0.12;
        var ring = tiles[j].querySelector(".f13-ring");
        tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t);
        tl.fromTo(ring, { opacity: 1 }, { opacity: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, t + 0.14);
        var link = j < 4 ? j + 1 : (j >= 5 && j < 9 ? j : 0);
        if (link) {
          tl.fromTo($("#f13-q" + link),
            { attr: { "stroke-dashoffset": 0.5 } },
            { attr: { "stroke-dashoffset": -1 }, duration: 0.12, ease: "none" }, t + 0.03);
        }
      }

      /* 8.2-8.5: the second purpose phrase eases to cobalt; hold still from 8.6 */
      tl.fromTo($("#f13-p2"),
        { color: "#5F5B50" },
        { color: "#1e2bfa", duration: 0.3, ease: "power2.out" }, 8.2);

      tl.set({}, {}, 12.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
