  <script>
    (function () {
      var COMP = "12-stage2";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };

      /* seeded hash in [0,1): deterministic scatter, no Math.random */
      function rnd(i, k) {
        var h = Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(k + 7, 0x85ebca77);
        h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
        h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
        h ^= h >>> 15;
        return (h >>> 0) / 4294967296;
      }

      /* ---------- document tiles: the messy stack (centre 176, 641) and the cleaned row ---------- */
      var KINDS = ["pdf", "table", "scan", "chart"];
      var BAND = { pdf: "#111111", scan: "#6b6b6b", table: "rgba(30,43,250,0.4)", chart: "rgba(30,43,250,0.4)" };
      var GLYPH = {
        pdf: '<path d="M5 2.5h8l4.5 4.5v12.5H5z M13 2.5V7h4.5"/>',
        scan: '<path d="M2.5 7V2.5H7 M15 2.5h4.5V7 M19.5 15v4.5H15 M7 19.5H2.5V15 M5.5 11h11"/>',
        table: '<rect x="2.5" y="3.5" width="17" height="15" rx="2"/><path d="M2.5 8.5h17 M2.5 13.5h17 M9 8.5v10"/>',
        chart: '<path d="M3 19.5h16 M6.5 16.5v-5 M11 16.5V6 M15.5 16.5V9"/>'
      };
      function lines(i, ys) {
        return ys.map(function (y, j) {
          var last = j === ys.length - 1;
          var w = last ? 44 + rnd(i, 10 + j) * 34 : 82 + rnd(i, 10 + j) * 20;
          return '<rect x="14" y="' + y + '" width="' + w.toFixed(1) + '" height="8" rx="4" fill="#9a9a9a" fill-opacity="0.75"/>';
        }).join("");
      }
      var INTERIOR = {
        pdf: function (i) { return lines(i, [56, 78, 100, 122]); },
        scan: function (i) { return '<g transform="rotate(-2.5 66 86)">' + lines(i, [56, 78, 100, 122]) + "</g>"; },
        table: function (i) {
          return '<rect x="14.75" y="48.75" width="101.5" height="14" fill="rgba(30,43,250,0.12)"/>' +
            '<rect x="14" y="48" width="103" height="66" rx="3" fill="none" stroke="#9a9a9a" stroke-width="2"/>' +
            '<path d="M14 63h103 M14 80h103 M14 97h103 M48 48v66 M82 48v66" stroke="#9a9a9a" stroke-width="1.8"/>' +
            lines(i, [128]);
        },
        chart: function (i) {
          var bars = "";
          for (var b = 0; b < 4; b++) {
            var h = 18 + rnd(i, 90 + b) * 32;
            bars += '<rect x="' + (24 + b * 23) + '" y="' + (102 - h).toFixed(1) + '" width="15" height="' + h.toFixed(1) + '" rx="2" fill="rgba(30,43,250,0.3)"/>';
          }
          return bars + '<path d="M14 103.5h103" stroke="#9a9a9a" stroke-width="2"/>' + lines(i, [120]);
        }
      };
      function tileSVG(i, kind) {
        return '<svg class="f12-tsvg" viewBox="0 0 132 172" width="63" height="83" aria-hidden="true">' +
          '<rect x="0" y="0" width="132" height="8" fill="' + BAND[kind] + '"/>' +
          '<g transform="translate(12 16) scale(1.1)" fill="none" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + GLYPH[kind] + "</g>" +
          INTERIOR[kind](i) + "</svg>";
      }

      var SX = 176, SY = 641;
      /* stack slots relative to the stack centre, bottom tile first */
      var SLOTS = [[-30, 22], [26, 12], [-10, -14], [18, -26]];
      /* row slot (left to right) each stack tile flies to, and its departure order (top tile leaves first) */
      var ROWSLOT = [0, 3, 1, 2];
      var DEPART = [3, 2, 1, 0];
      var ROWY = 796;
      var TILES = [];
      var ghosts = "", tiles = "";
      for (var j = 0; j < 4; j++) {
        var sign = j % 2 ? 1 : -1;
        var rot = sign * (2.5 + rnd(j + 40, 3) * 3.5);
        var dx = SLOTS[j][0] + (rnd(j + 40, 1) - 0.5) * 8;
        var dy = SLOTS[j][1] + (rnd(j + 40, 2) - 0.5) * 6;
        var t = { id: "f12-d" + j, gid: "f12-g" + j, x: +dx.toFixed(1), y: +dy.toFixed(1), r: +rot.toFixed(2),
          rx: 96 + 33 + ROWSLOT[j] * 80 - SX, ry: ROWY - SY, slot: ROWSLOT[j], dep: DEPART[j] };
        TILES.push(t);
        ghosts += '<div class="f12-ghost" id="' + t.gid + '" style="transform:translate(' + t.x + 'px,' + t.y + 'px) rotate(' + t.r + 'deg)"></div>';
        tiles += '<div class="f12-tile" id="' + t.id + '"><div class="f12-tin">' + tileSVG(j + 40, KINDS[j]) + "</div>" +
          '<div class="f12-badge"><span></span><span></span><span></span><span></span></div></div>';
      }
      var arrow = '<svg id="f12-arrow" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true">' +
        '<path id="f12-ar-l" d="M169 718 V746"/><path class="f12-ar-w" d="M169 746.5 L160 737.5"/><path class="f12-ar-w" d="M169 746.5 L178 737.5"/></svg>';
      $("#f12-docs").innerHTML = ghosts + arrow + tiles;

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0-1.8): stage header; purpose line ---------- */
      tl.fromTo($("#f12-eyebrow"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      ["#f12-t1", "#f12-t2", "#f12-t3"].forEach(function (s, i) {
        tl.fromTo($(s), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3 + i * 0.08);
      });
      tl.fromTo($("#f12-pill"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", transformOrigin: "0% 50%" }, 0.8);
      tl.fromTo($("#f12-p1"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.8);
      tl.fromTo($("#f12-p2"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);

      /* ---------- Scene 2 (1.8-8.4): Part A ---------- */
      /* split-highlight block: rule first, fill wipes in from the left */
      tl.fromTo($("#f12-blk-bg"), { clipPath: "inset(0% 100% 0% 0% round 12px)" }, { clipPath: "inset(0% 0% 0% 0% round 12px)", duration: 0.55, ease: "power3.out" }, 1.8);
      tl.fromTo($("#f12-c-df"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 2.0);

      /* frame 03's question pops in exactly as it did there (2.0: tether stub grows up, chip springs from
         its bottom centre), holds legible to 3.6, then swaps in place for the answer (3.6-3.8):
         discrete-text-sequence states (reverse search) + a velocity-matched upward cut (400 px/s both sides) */
      var QW = $("#f12-qw"), Q = $("#f12-q"), QN = $("#f12-qn"), A = $("#f12-ans");
      var SWAP = 3.72;
      var SEQ = [{ t: 0, s: 0 }, { t: 2.0, s: 1 }, { t: SWAP, s: 2 }];
      function stateAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].s;
        return 0;
      }
      var drv = { t: 0 };
      tl.to(drv, {
        t: 20, duration: 20, ease: "none",
        onUpdate: function () {
          var s = stateAt(drv.t);
          QW.style.visibility = s === 1 ? "visible" : "hidden";
          A.style.visibility = s === 2 ? "visible" : "hidden";
        }
      }, 0);
      tl.fromTo(QN, { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out", transformOrigin: "50% 100%" }, 2.0);
      tl.fromTo(Q, { opacity: 0, scale: 0, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out", transformOrigin: "50% 100%" }, 2.0);
      tl.fromTo(QW, { y: 0 }, { y: -16, duration: SWAP - 3.6, ease: "power3.in" }, 3.6);
      tl.fromTo(QW, { opacity: 1 }, { opacity: 0, duration: SWAP - 3.62, ease: "power2.in" }, 3.62);
      tl.fromTo(A, { opacity: 0.35, y: 24 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, SWAP);

      /* messy stack drops in (3.9), then the Documents chip (4.4) and its label (4.8) */
      TILES.forEach(function (p, j) {
        tl.fromTo($("#" + p.id),
          { opacity: 0, x: p.x, y: p.y - 34, rotation: p.r * 0.4 },
          { opacity: 1, x: p.x, y: p.y, rotation: p.r, duration: 0.45, ease: "power3.out", transformOrigin: "50% 50%" },
          3.9 + j * 0.06);
      });
      tl.fromTo($("#f12-c-docs"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 4.4);
      tl.fromTo($("#f12-dl1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.8);
      tl.fromTo($("#f12-dl2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.95);

      /* 5.8-6.3: the cleaning arrow self-draws downward (shaft, then head) */
      tl.fromTo($("#f12-ar-l"), { strokeDasharray: "28 60", strokeDashoffset: 30 }, { strokeDasharray: "28 60", strokeDashoffset: 0, duration: 0.32, ease: "power2.inOut" }, 5.8);
      tl.fromTo($$(".f12-ar-w"), { strokeDasharray: "13 40", strokeDashoffset: 14 }, { strokeDasharray: "13 40", strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 6.1);

      /* 6.4: Data Cleaning lands; 6.5-7.3: the same four tiles fly down and straighten into one row.
         Each tile's dashed outline is uncovered as it lifts off and is gone by 7.0 (a brief trace, not a hold). */
      tl.fromTo($("#f12-c-clean"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 6.4);
      var GHOST_GONE = 7.0;
      TILES.forEach(function (p) {
        var el = $("#" + p.id), gh = $("#" + p.gid);
        var a = 6.5 + p.dep * 0.06;
        tl.fromTo(el, { y: p.y, rotation: p.r }, { y: p.ry, rotation: 0, duration: 0.5, ease: "power3.inOut", immediateRender: false }, a);
        tl.fromTo(el, { x: p.x }, { x: p.rx, duration: 0.5, ease: "power3.inOut", immediateRender: false }, a + 0.12);
        tl.fromTo(gh, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: "none" }, a);
        tl.fromTo(gh, { autoAlpha: 1 }, { autoAlpha: 0, duration: GHOST_GONE - (a + 0.16), ease: "power2.out", immediateRender: false }, a + 0.16);
      });
      /* 7.4-7.8: each cleaned tile receives the 4-dot governance badge, left to right */
      TILES.slice().sort(function (m, n) { return m.slot - n.slot; }).forEach(function (p, k) {
        tl.fromTo($("#" + p.id + " .f12-badge"), { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out", transformOrigin: "50% 50%" }, 7.4 + k * 0.08);
      });

      /* ---------- Scene 3 (7.8-8.4): hairline divider draws at x 790 ---------- */
      tl.fromTo($("#f12-div"), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.inOut", transformOrigin: "50% 0%" }, 7.8);

      /* ---------- Scene 4 (8.4-15.0): four question rows, then the retrieval stack ---------- */
      [8.4, 9.6, 10.8, 12.2].forEach(function (at, i) {
        var row = $("#f12-r" + (i + 1));
        tl.fromTo(row.querySelector(".f12-chip"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at);
        var rule = row.querySelector(".f12-rule");
        if (rule) tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out", transformOrigin: "0% 50%" }, at + 0.05);
        row.querySelectorAll(".f12-rq .f12-ph").forEach(function (ph, k) {
          tl.fromTo(ph, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.2 + k * 0.3);
        });
      });
      tl.fromTo($("#f12-rlab"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 13.6);
      $$("#f12-rchips .f12-chip").forEach(function (c, k) {
        tl.fromTo(c, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 13.8 + k * 0.25);
      });

      /* ---------- Scene 5 (15.0-20.0): hold still ---------- */
      tl.to({}, { duration: 20 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
