            <rect x="41" y="1" width="36" height="21" rx="4" fill="rgba(30,43,250,0.08)" stroke="#1e2bfa" stroke-width="2"/>

      <svg id="f15-spark2" class="f15-spark" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 0C16 9 21 14 30 15C21 16 16 21 15 30C14 21 9 16 0 15C9 14 14 9 15 0Z" fill="#1e2bfa"/></svg>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/MotionPathPlugin.min.js"></script>
  <script>
    (function () {
      var COMP = "15-stage5";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s, el) { return Array.prototype.slice.call((el || host).querySelectorAll(s)); };

      gsap.registerPlugin(MotionPathPlugin);
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.8): rail focus moves to node 5 (owned by roadmap.html, +0.25 s);
         the stage header lands (0.3), then the purpose line phrase by phrase (0.8) */
      tl.fromTo([$("#f15-eyebrow"), $("#f15-title")],
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.3);
      tl.fromTo([$("#f15-p1"), $("#f15-p2")],
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.25 }, 0.8);

      /* Scene 2 (1.8-5.0): four outcome cards land on their cues, each mini-visual animates in after */
      function land(card, at) {
        tl.fromTo(card,
          { opacity: 0, y: 24, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, at);
      }

      /* KPIs (2.0): the gauge value arc sweeps, the needle swings up to it */
      land($("#f15-c1"), 2.0);
      tl.fromTo($("#f15-gval"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0.3 }, duration: 0.8, ease: "power3.out" }, 2.2);
      tl.fromTo($("#f15-needle"),
        { rotation: -84, svgOrigin: "44 43" },
        { rotation: 36, svgOrigin: "44 43", duration: 0.85, ease: "power3.out" }, 2.2);

      /* Human-in-the-Loop Approval (2.6): the success pill lands beside the approver, the check draws */
      land($("#f15-c2"), 2.6);
      tl.fromTo($("#f15-pill"),
        { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "0% 50%", duration: 0.45, ease: "expo.out" }, 2.85);
      tl.fromTo($("#f15-ck"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 3.0);

      /* Adoption Metrics (3.2): the bar trio rises left to right */
      land($("#f15-c3"), 3.2);
      tl.fromTo($$(".f15-bar"),
        { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "power3.out", stagger: 0.1 }, 3.4);

      /* Executive Dashboards (3.8): the 2x2 panel grid fills panel by panel */
      land($("#f15-c4"), 3.8);
      tl.fromTo($$(".f15-dp"),
        { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "power3.out", stagger: 0.08 }, 4.0);

      /* Scene 3 (5.0-11.0): the loop self-draws clockwise under the cards (5.0-6.2) */
      var DRAW_AT = 5.0, DRAW_DUR = 1.2;
      var loop = $("#f15-loop");
      tl.fromTo(loop, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power2.out" }, DRAW_AT);
      tl.fromTo(loop,
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: DRAW_DUR, ease: "power2.inOut" }, DRAW_AT);

      /* each direction chevron appears as the drawing head passes it: invert power2.inOut
         for the chevron's fraction of the loop (1/8, 3/8, 5/8, 7/8 of its length) */
      var inv = function (f) { return f < 0.5 ? Math.cbrt(f / 4) : 1 - Math.cbrt(2 * (1 - f)) / 2; };
      [0.125, 0.375, 0.625, 0.875].forEach(function (f, i) {
        tl.fromTo($("#f15-chev" + (i + 1)),
          { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out" },
          DRAW_AT + DRAW_DUR * inv(f) - 0.02);
      });

      /* centre label lands at 5.4, word by word; the two sparks follow */
      tl.fromTo([$("#f15-w1"), $("#f15-w2")],
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 5.4);
      tl.fromTo([$("#f15-spark1"), $("#f15-spark2")],
        { opacity: 0, scale: 0.4, rotation: -45, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, rotation: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.out" }, 5.65);

      /* one dot travels the loop once (6.4-7.8): it leaves from under the KPIs card and returns
         beneath it, so its constant-speed start and stop are both hidden by the card */
      var DOT_PATH = "M 346 585 A 60 60 0 0 1 406 525 H 1514 A 60 60 0 0 1 1574 585 V 745 A 60 60 0 0 1 1514 805 H 406 A 60 60 0 0 1 346 745 V 585";
      var dot = $("#f15-dot");
      gsap.set(dot, { xPercent: -50, yPercent: -50, x: 346, y: 585 });
      tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, 6.4);
      tl.to(dot, { motionPath: { path: DOT_PATH }, duration: 1.4, ease: "none" }, 6.4);

      /* each card pulses lightly as the dot passes beneath it (scale + border), settled by 8.0 */
      function pulse(card, at, down) {
        tl.fromTo(card, { scale: 1 }, { scale: 1.025, duration: 0.14, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(card, { scale: 1.025 }, { scale: 1, duration: down, ease: "power3.out", immediateRender: false }, at + 0.14);
        tl.fromTo(card, { borderColor: "rgba(30,43,250,0.2)" }, { borderColor: "rgba(30,43,250,0.65)", duration: 0.14, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(card, { borderColor: "rgba(30,43,250,0.65)" }, { borderColor: "rgba(30,43,250,0.2)", duration: down, ease: "power3.out", immediateRender: false }, at + 0.14);
      }
      pulse($("#f15-c2"), 6.86, 0.36);
      pulse($("#f15-c4"), 6.99, 0.36);
      pulse($("#f15-c3"), 7.52, 0.34);
      pulse($("#f15-c1"), 7.62, 0.24);

      /* hold still from 8.0 to the end */
      tl.set({}, {}, 11);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
