  <script src="assets/vendor/gsap.min.js"></script>

  <script>
    (function () {
      var COMP = "15-stage5";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]') || document;
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s, el) { return Array.prototype.slice.call((el || host).querySelectorAll(s)); };

      gsap.registerPlugin(MotionPathPlugin);
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.8): rail focus moves to node 5 (owned by roadmap.html, +0.25 s);
         the stage header lands (0.3), then the purpose line phrase by phrase (0.8) */
      tl.fromTo([$("#f15-eyebrow"), $("#f15-title")],
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.3);
      tl.fromTo([$("#f15-p1"), $("#f15-p2")],
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.25 }, 0.8);

      /* Scene 2 (1.8-5.0): four outcome cards land clockwise on their cues, each mini-visual animates in after */
      function land(card, at) {
        tl.fromTo(card,
          { opacity: 0, y: 24, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, at);
      }

      /* KPIs (2.0, top-left): the gauge value arc sweeps, the needle swings up to it */
      land($("#f15-c1"), 2.0);
      tl.fromTo($("#f15-gval"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0.3 }, duration: 0.8, ease: "power3.out" }, 2.2);
      tl.fromTo($("#f15-needle"),
        { rotation: -84, svgOrigin: "44 43" },
        { rotation: 36, svgOrigin: "44 43", duration: 0.85, ease: "power3.out" }, 2.2);

      /* Human-in-the-Loop Approval (2.6, top-right): the success pill lands beside the approver, the check draws */
      land($("#f15-c2"), 2.6);
      tl.fromTo($("#f15-pill"),
        { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "0% 50%", duration: 0.45, ease: "expo.out" }, 2.85);
      tl.fromTo($("#f15-ck"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 3.0);

      /* Adoption Metrics (3.2, bottom-right): the bar trio rises left to right */
      land($("#f15-c3"), 3.2);
      tl.fromTo($$(".f15-bar"),
        { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "power3.out", stagger: 0.1 }, 3.4);

      /* Executive Dashboards (3.8, bottom-left): the 2x2 panel grid fills panel by panel */
      land($("#f15-c4"), 3.8);
      tl.fromTo($$(".f15-dp"),
        { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "power3.out", stagger: 0.08 }, 4.0);

      /* Loop geometry (px): rounded rect through the card centres x 366 / 1554, y 545 / 805, corner radius 60.
         Straight runs: top/bottom 1068, sides 140; Q = one quarter arc. Total length 2416 + 4Q (~2793). */
      var Q = Math.PI * 30;
      var LEN = 2416 + 4 * Q;
      /* inverse of power2.inOut (GSAP power2 = cubic): progress -> time fraction */
      var inv = function (f) { return f < 0.5 ? Math.cbrt(f / 4) : 1 - Math.cbrt(2 * (1 - f)) / 2; };

      /* Scene 3 (5.0-11.0): the loop self-draws clockwise under the cards (5.0-6.2), starting at the KPIs card's right edge (x 636) */
      var DRAW_AT = 5.0, DRAW_DUR = 1.2;
      var loop = $("#f15-loop");
      tl.fromTo(loop, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power2.out" }, DRAW_AT);
      tl.fromTo(loop,
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: DRAW_DUR, ease: "power2.inOut" }, DRAW_AT);

      /* each direction chevron appears as the drawing head passes it (segment midpoints, as arc length from x 636) */
      [324, 928 + Q, 1532 + 2 * Q, 2136 + 3 * Q].forEach(function (s, i) {
        tl.fromTo($("#f15-chev" + (i + 1)),
          { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out" },
          DRAW_AT + DRAW_DUR * inv(s / LEN) - 0.02);
      });

      /* centre label lands at 5.4, word by word; the two sparks follow */
      tl.fromTo([$("#f15-w1"), $("#f15-w2")],
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 5.4);
      tl.fromTo([$("#f15-spark1"), $("#f15-spark2")],
        { opacity: 0, scale: 0.4, rotation: -45, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, rotation: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.out" }, 5.65);

      /* one 20px dot laps the loop once (6.2-8.2, power2.inOut over the whole path). It sets off from just right of
         the KPIs card (x 666, in the open), passes Approval -> Adoption -> Dashboards -> KPIs, and comes to rest
         where it started. A ~130px fading trail rides behind it: 8 dashes of the same path, all ending at the dot,
         shorter ones wider, so their overlap darkens toward the dot. */
      var DOT_AT = 6.2, DOT_DUR = 2.0, TRAIL = 130;
      var DOT_PATH = "M 666 545 H 1494 A 60 60 0 0 1 1554 605 V 745 A 60 60 0 0 1 1494 805 H 426 A 60 60 0 0 1 366 745 V 605 A 60 60 0 0 1 426 545 H 666";
      var trail = $$(".f15-trail");
      var N = trail.length;
      trail.forEach(function (el, i) {
        var k = i + 1;
        var Lk = (TRAIL / LEN) * (k / N);
        el.setAttribute("d", DOT_PATH);
        gsap.set(el, { attr: { "stroke-width": 14 - (k - 1) * 0.9, "stroke-opacity": 0.2, "stroke-dasharray": Lk + " 2", "stroke-dashoffset": Lk } });
        tl.fromTo(el,
          { attr: { "stroke-dashoffset": Lk } },
          { attr: { "stroke-dashoffset": Lk - 1 }, duration: DOT_DUR, ease: "power2.inOut" }, DOT_AT);
      });
      var trailG = $("#f15-trail");
      tl.fromTo(trailG, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power2.out" }, DOT_AT);
      tl.fromTo(trailG, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 7.95);

      var dot = $("#f15-dot");
      gsap.set(dot, { xPercent: -50, yPercent: -50, x: 666, y: 545 });
      tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, DOT_AT);
      tl.to(dot, { motionPath: { path: DOT_PATH }, duration: DOT_DUR, ease: "power2.inOut" }, DOT_AT);

      /* each card pulses lightly (scale + border) as the dot passes beneath it: the pulse starts as the dot
         slides under the card (arc length from x 666 where it enters the card's box) and peaks mid-pass */
      var passAt = function (s) { return DOT_AT + DOT_DUR * inv(s / LEN); };
      function pulse(card, at) {
        tl.fromTo(card, { scale: 1 }, { scale: 1.025, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(card, { scale: 1.025 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, at + 0.12);
        tl.fromTo(card, { borderColor: "rgba(30,43,250,0.2)" }, { borderColor: "rgba(30,43,250,0.65)", duration: 0.12, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(card, { borderColor: "rgba(30,43,250,0.65)" }, { borderColor: "rgba(30,43,250,0.2)", duration: 0.34, ease: "power3.out", immediateRender: false }, at + 0.12);
      }
      pulse($("#f15-c2"), passAt(618) - 0.03);           /* Approval, top-right: enters at x 1284 (~6.93) */
      pulse($("#f15-c3"), passAt(953 + Q) - 0.03);       /* Adoption, bottom-right: enters at y 730 (~7.08) */
      pulse($("#f15-c4"), passAt(1826 + 2 * Q) - 0.03);  /* Dashboards, bottom-left: enters at x 636 (~7.35) */
      pulse($("#f15-c1"), passAt(2161 + 3 * Q) - 0.03);  /* KPIs, top-left: enters at y 620 (~7.54), last pulse settles ~8.0 */

      /* hold still from 8.4 to the end (the trail has faded by 8.3; the dot rests beside KPIs) */
      tl.set({}, {}, 11);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
