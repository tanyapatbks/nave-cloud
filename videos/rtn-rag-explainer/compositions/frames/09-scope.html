  // Cubic-bezier length by fixed 96-step sampling: deterministic fallback if getTotalLength is unavailable.
  function bezLen(a, b, c, d) {
    var n = 96, len = 0, px = a[0], py = a[1];
    for (var i = 1; i <= n; i++) {
      var t = i / n, u = 1 - t;
      var x = u*u*u*a[0] + 3*u*u*t*b[0] + 3*u*t*t*c[0] + t*t*t*d[0];
      var y = u*u*u*a[1] + 3*u*u*t*b[1] + 3*u*t*t*c[1] + t*t*t*d[1];
      len += Math.sqrt((x-px)*(x-px) + (y-py)*(y-py)); px = x; py = y;
    }
    return len;
  }
  function prep(id, fallback) {
    var p = document.getElementById(id), len = 0;
    try { len = p.getTotalLength(); } catch (e) { len = 0; }
