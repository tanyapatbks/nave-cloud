      tl.fromTo("#f10-L-panel", { x: -240, y: 0, scale: 0.846, opacity: 0 }, { x: 0, y: 0, scale: 0.92, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.1);

      q(".f10-tile-L").forEach(function (el) {
        var t = hitTime(LB.start, LB.dur, LB.x0, LB.x1, LB.wrap, Number(el.dataset.col));

        tl.fromTo(hit, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, t);
        tl.fromTo(hit, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t + 0.25);
      });

      // 2.0-2.6: a restricted doc (outline pulses 2px red) is pulled into the candidates box; it reaches the AI
      tl.fromTo("#f10-L-alarm", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 2.0);
      tl.fromTo("#f10-L-alarm", { opacity: 1 }, { opacity: 0.35, duration: 0.16, ease: "power2.inOut", immediateRender: false }, 2.14);
      tl.fromTo("#f10-L-alarm", { opacity: 0.35 }, { opacity: 1, duration: 0.16, ease: "power2.inOut", immediateRender: false }, 2.32);
      tl.fromTo("#f10-L-t4", { x: 0 }, { x: 465, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 2.0);
      tl.fromTo("#f10-L-t4", { y: 0, scale: 1 }, { y: -40, scale: 1.08, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.0);
      tl.fromTo("#f10-L-t4", { y: -40, scale: 1.08 }, { y: 0, scale: 1, duration: 0.3, ease: "power2.in", immediateRender: false }, 2.3);

      tl.fromTo("#f10-L-traylit", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.32);
      // the hand-off to the AI is the dotted RED arrow (shaft reveal is in the trails block below; head here);
      // the AI lights blue with its red ring and stays lit to the end of the frame
      tl.fromTo("#f10-trail-h", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.1, ease: "power2.out" }, 2.62);
      tl.fromTo("#f10-L-ailit", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.7);

      // hold 2.6-3.0; 3.0-3.5: the filter bar drops, strikes the doc, and the doc folds into the small lock box above the box
      tl.fromTo("#f10-filterbar", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, 3.0);
      tl.fromTo("#f10-filterbar", { y: 0 }, { y: 220, duration: 0.4, ease: "power2.inOut" }, 3.02);
      tl.fromTo("#f10-filterbar", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, 3.4);
      tl.fromTo("#f10-strike-path", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.14, ease: "power2.out" }, 3.16);
      tl.fromTo("#f10-L-t4", { x: 465, y: 0, scale: 1, opacity: 1 }, { x: 576, y: -157.75, scale: 0.72, opacity: 0, duration: 0.22, ease: "power2.inOut", immediateRender: false }, 3.28);
      tl.fromTo("#f10-L-ghost", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.3);

      [["#f10-res-0", 3.8], ["#f10-res-1", 4.2], ["#f10-res-2", 4.6]].forEach(function (r) {
        tl.fromTo(r[0], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, r[1]);
      });
      // trails: one finite run of 10/6 dashes (screen px) followed by a long gap. The run is fitted to the path
      // (k+1 dashes, k gaps, scaled by <= ~5%) so it starts and ends on a full dash. Reveal = the run streams out of
      // the path start (offset L+2 -> 0), then holds.
      var DASH = 10 / 0.92, GAP = 6 / 0.92, PER = DASH + GAP;
      function trailPattern(el, fallback) {
        var L = 0;
        try { L = el.getTotalLength(); } catch (e) { L = 0; }
        if (!L || !isFinite(L)) { L = fallback; }
        var k = Math.max(0, Math.round((L - DASH) / PER)), f = L / (k * PER + DASH), arr = [], i;
        for (i = 0; i <= k; i++) { arr.push(DASH * f, i < k ? GAP * f : L + 2000); }
        el.style.strokeDasharray = arr.join(" ");
        return L;
      }
      // [id, fallback length, reveal start, reveal duration, reveal ease]
      [["#f10-trail-a", 28.37, 2.5, 0.14, "power2.out"],
       ["#f10-trail-c", 126.63, 3.5, 0.3, "power2.out"],

       ["#f10-trail-2", 181.2, 4.62, 0.2, "power2.out"]].forEach(function (r) {
        var el = q(r[0])[0], L = trailPattern(el, r[1]);
        // hidden start sits 2 units inside the long gap (offset exactly L leaves a 1px sliver at the path start)
        tl.fromTo(el, { strokeDashoffset: L + 2 }, { strokeDashoffset: 0, duration: r[3], ease: r[4], autoRound: false }, r[2]);
      });

      tl.fromTo("#f10-L-leakdot", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power2.out" }, 4.7);
      tl.fromTo("#f10-L-leakdot", { y: 0 }, { y: 130, duration: 0.38, ease: "none", autoRound: false }, 4.7);
      tl.fromTo("#f10-L-leakdot", { x: 0 }, { x: 41, duration: 0.12, ease: "none", autoRound: false, immediateRender: false }, 5.08);
      tl.fromTo("#f10-L-leakdot", { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "power2.in", immediateRender: false }, 5.14);

      // ===== Scene 3 (5.3-7.4): RIGHT - scope first, then search inside it (residue holds alone 3.8-5.3) =====
      tl.fromTo("#f10-R-label", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.3);
      tl.fromTo("#f10-scope-draw", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 5.7);
      q("#f10-R-t0, #f10-R-t4, #f10-R-t8").forEach(function (el) {
        tl.fromTo(el, { opacity: 1 }, { opacity: 0.35, duration: 0.35, ease: "power2.out", immediateRender: false }, 5.9);
      });

      var RB = { start: 6.2, dur: 0.45, x0: -72, x1: 298, wrap: 124 };
      tl.fromTo("#f10-R-beam", { x: RB.x0 }, { x: RB.x1, duration: RB.dur, ease: "none" }, RB.start);
      tl.fromTo("#f10-R-beam", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, RB.start);
      tl.fromTo("#f10-R-beam", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.in", immediateRender: false }, RB.start + RB.dur - 0.1);
      q(".f10-tile-R").forEach(function (el) {
        var col = Number(el.dataset.col);
        if (col === 0) return; // outside the scope: never touched
        var t = hitTime(RB.start, RB.dur, RB.x0, RB.x1, RB.wrap, col);
        var hit = el.querySelector(".f10-hit");
        tl.fromTo(hit, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, t);
        if (el.id !== "f10-R-t7") tl.fromTo(hit, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t + 0.25);
      });

      // the result (6.7): an allowed doc goes to the AI; nothing restricted moves
      tl.fromTo("#f10-R-t7", { x: 0 }, { x: 183, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 6.7);
      tl.fromTo("#f10-R-t7", { y: 0, scale: 1 }, { y: -26, scale: 1.06, duration: 0.2, ease: "power2.out", immediateRender: false }, 6.7);
      tl.fromTo("#f10-R-t7", { y: -26, scale: 1.06 }, { y: 0, scale: 1, duration: 0.2, ease: "power2.in", immediateRender: false }, 6.9);
      tl.fromTo("#f10-R-slot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.74);
      tl.fromTo("#f10-R-traylit", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.88);
      tl.fromTo("#f10-R-arrow", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 6.96);
      tl.fromTo("#f10-R-head", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.08, ease: "power2.out" }, 7.08);
