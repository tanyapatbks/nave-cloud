<template id="01-hook-template">
  <style>
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:300;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Light.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Regular.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Medium.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Bold.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Display";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitDisplay-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Sans Thai";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexSansThai-Regular.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Sans Thai";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexSansThai-Medium.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Sans Thai";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexSansThai-Bold.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype");}

#root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;container-type:size;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";}

    /* ground + atmosphere */
    #f01-ground{position:absolute;inset:0;background:#fdfae7;}
    #f01-rings{position:absolute;inset:0;}
    .f01-ring{position:absolute;box-sizing:border-box;border-radius:50%;border-style:solid;border-width:1.5px;}

    /* archive wall (blur + dim as one grouped layer) */
    #f01-wall{position:absolute;inset:0;z-index:1;--f01-dof:0px;filter:blur(var(--f01-dof));will-change:filter;}
    #f01-hero{position:absolute;inset:0;z-index:2;}
    .f01-tile{position:absolute;box-sizing:border-box;width:132px;height:172px;border:1.5px solid rgba(30,43,250,0.2);border-radius:10px;background:rgba(30,43,250,0.04);}
    .f01-tin{position:absolute;inset:0;border-radius:8.5px;overflow:hidden;}
    .f01-band{position:absolute;left:0;right:0;top:0;height:4px;}
    .f01-tin svg{position:absolute;left:0;top:0;width:129px;height:169px;}
    #f01-outline{position:absolute;box-sizing:border-box;inset:-1.5px;border:2.5px solid #1e2bfa;border-radius:10px;}
    .f01-kchip{position:absolute;box-sizing:border-box;padding:6px 16px;border-radius:100px;border:1.5px solid rgba(30,43,250,0.2);background:linear-gradient(rgba(30,43,250,0.08),rgba(30,43,250,0.08)),#fdfae7;color:#1e2bfa;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:24px;line-height:1.45;white-space:nowrap;}
    .f01-kchip.f01-mono{font-family:"IBM Plex Mono","Chulabhorn Likit Text","IBM Plex Sans Thai";letter-spacing:0.02em;}

    /* hero numeral (Latin digits only: line-height 1.1 is safe here) */
    #f01-num{position:absolute;left:96px;top:222px;height:242px;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:220px;line-height:242px;color:#1e2bfa;white-space:nowrap;transform-origin:0 0;z-index:3;}
    #f01-count{display:inline-block;width:396px;font-variant-numeric:tabular-nums;transform-origin:0 185px;}
    #f01-plus{display:inline-block;}
    #f01-label{position:absolute;left:96px;top:452px;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:600;font-size:52px;line-height:1.45;color:#111111;white-space:nowrap;transform-origin:0 0;z-index:3;}
    .f01-ph{display:inline-block;}

    /* question headline */
    #f01-q{position:absolute;left:96px;top:343px;max-width:1500px;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:60px;line-height:1.45;color:#111111;z-index:4;}
    #f01-q .f01-line{display:block;white-space:nowrap;}
    #f01-rag{position:relative;}
    #f01-uline{position:absolute;left:2px;right:2px;top:71px;height:4px;border-radius:2px;background:#1e2bfa;transform-origin:0 50%;}
    #f01-gloss{position:absolute;left:50%;top:196px;box-sizing:border-box;padding:8px 22px;border-radius:100px;background:linear-gradient(rgba(30,43,250,0.08),rgba(30,43,250,0.08)),#fdfae7;color:#1e2bfa;font-family:"IBM Plex Mono","Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:24px;line-height:1.45;white-space:nowrap;}

    /* chapter tracker (frame.md component 1, all upcoming) */
    #f01-hdr{position:absolute;left:96px;right:96px;top:56px;height:60px;display:flex;justify-content:space-between;align-items:center;z-index:4;}
    #f01-hdr .f01-track{display:flex;gap:12px;}
    #f01-hdr .f01-pill{font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:24px;line-height:1.45;padding:8px 22px;border-radius:100px;border:1.5px solid rgba(30,43,250,0.2);color:#6b6b6b;background:transparent;white-space:nowrap;}
    #f01-hdr .f01-cnum{font-weight:700;margin-right:10px}
  </style>

  <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080" data-duration="9.5">
    <div id="f01-ground" class="clip" data-start="0" data-duration="9.5" data-track-index="0"></div>

    <div id="f01-rings"></div>
    <div id="f01-wall"></div>
    <div id="f01-hero"></div>

    <div id="f01-num"><span id="f01-count">0</span><span id="f01-plus">+</span></div>
    <div id="f01-label"><span class="f01-ph f01-lp">ปี</span> <span class="f01-ph f01-lp">ของข้อมูล</span><span class="f01-ph f01-lp">กองทัพเรือ</span></div>

    <div id="f01-q">
      <span class="f01-line"><span class="f01-ph f01-qp">แล้ว</span><span class="f01-ph f01-qp">เราจะ</span><span class="f01-ph f01-qp">จัดทำ</span> <span class="f01-ph f01-qp" id="f01-rag">RAG<span id="f01-uline"></span><span id="f01-gloss">ค้นเอกสารจริงก่อน แล้วจึงตอบ</span></span></span>
      <span class="f01-line"><span class="f01-ph f01-qp">ให้กับ</span> <span class="f01-ph f01-qp">ทร.</span> <span class="f01-ph f01-qp">ได้อย่างไร?</span></span>
    </div>

    <div id="f01-hdr">
      <div class="f01-track"><span class="f01-pill"><b class="f01-cnum">1</b>อ่านได้</span><span class="f01-pill"><b class="f01-cnum">2</b>ค้นเจอ</span><span class="f01-pill"><b class="f01-cnum">3</b>ตามสิทธิ์</span></div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };

      /* deterministic integer hash of (index, salt) -> [0,1) */
      function rnd(i, k) {
        var h = Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(k + 7, 0x85ebca77);
        h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
        h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
        h ^= h >>> 15;
        return (h >>> 0) / 4294967296;
      }

      /* ---------- atmosphere: faint concentric rings behind the numeral ---------- */
      var RINGS = [
        { r: 160, a: 0.11 },
        { r: 290, a: 0.09 },
        { r: 420, a: 0.07 },
        { r: 550, a: 0.055 }
      ];
      var CX = 360, CY = 330;
      $("f01-rings").innerHTML = RINGS.map(function (g) {
        return '<div class="f01-ring" style="left:' + (CX - g.r) + 'px;top:' + (CY - g.r) + 'px;width:' + (g.r * 2) + 'px;height:' + (g.r * 2) + 'px;border-color:rgba(30,43,250,' + g.a + ')"></div>';
      }).join("");

      /* ---------- archive wall: 8 x 5 document tiles, bleeding off top + right ---------- */
      var X0 = 808, Y0 = -56, PX = 146, PY = 188, COLS = 8, ROWS = 5;
      var HERO = 18; /* the example document (a PDF) */
      var FORCED = { 8: "pdf", 25: "scan", 11: "image", 28: "chart", 22: "table", 18: "pdf" };
      var CHIPS = [
        { idx: 8, text: "PDF", mono: true },
        { idx: 25, text: "ภาพสแกน" },
        { idx: 11, text: "รูปภาพ" },
        { idx: 28, text: "แผนภูมิ" },
        { idx: 22, text: "ตาราง" }
      ];
      var BAND = {
        pdf: "#111111",
        scan: "#6b6b6b",
        image: "rgba(30,43,250,0.4)",
        chart: "rgba(30,43,250,0.4)",
        table: "rgba(30,43,250,0.4)"
      };
      var GLYPH = {
        pdf: '<path d="M5 2.5h8l4.5 4.5v12.5H5z M13 2.5V7h4.5"/>',
        scan: '<path d="M2.5 7V2.5H7 M15 2.5h4.5V7 M19.5 15v4.5H15 M7 19.5H2.5V15 M5.5 11h11"/>',
        image: '<rect x="2.5" y="4" width="17" height="14" rx="2"/><path d="M3.5 16.5l4.5-4.5 3.5 3.5 2.5-2.5 4 4"/><circle cx="15" cy="8.5" r="1.6"/>',
        chart: '<path d="M3 19.5h16 M6.5 16.5v-5 M11 16.5V6 M15.5 16.5V9"/>',
        table: '<rect x="2.5" y="3.5" width="17" height="15" rx="2"/><path d="M2.5 8.5h17 M2.5 13.5h17 M9 8.5v10"/>'
      };
      var LINEFILL = 'fill="#9a9a9a" fill-opacity="0.5"';

      function kindOf(i) {
        if (FORCED[i]) return FORCED[i];
        var r = rnd(i, 1);
        return r < 0.36 ? "pdf" : r < 0.6 ? "scan" : r < 0.75 ? "image" : r < 0.88 ? "table" : "chart";
      }
      function textLines(i, ys, op) {
        return ys.map(function (y, j) {
          var last = j === ys.length - 1;
          var w = last ? 40 + rnd(i, 10 + j) * 36 : 80 + rnd(i, 10 + j) * 21;
          return '<rect x="14" y="' + y + '" width="' + w.toFixed(1) + '" height="6" rx="3" fill="#9a9a9a" fill-opacity="' + (op || 0.5) + '"/>';
        }).join("");
      }
      var INTERIOR = {
        pdf: function (i) { return textLines(i, [54, 72, 90, 108]); },
        scan: function (i) {
          var dots = "";
          for (var d = 0; d < 9; d++) {
            var x = 14 + rnd(i, 30 + d) * 101, y = 44 + rnd(i, 50 + d) * 112, r = 0.6 + rnd(i, 70 + d) * 0.9;
            dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) + '" fill="#6b6b6b" fill-opacity="0.4"/>';
          }
          return '<g transform="rotate(-2.5 64.5 84.5)">' + textLines(i, [54, 72, 90, 108], 0.42) + "</g>" + dots;
        },
        image: function (i) {
          return '<rect x="14" y="46" width="101" height="52" rx="4" fill="rgba(30,43,250,0.08)"/>' +
            '<path d="M14 98 L42 70 L58 84 L76 64 L115 98 Z" fill="rgba(30,43,250,0.16)"/>' +
            '<circle cx="98" cy="60" r="6" fill="rgba(30,43,250,0.2)"/>' +
            textLines(i, [112, 128, 144]);
        },
        chart: function (i) {
          var bars = "";
          for (var b = 0; b < 4; b++) {
            var h = 16 + rnd(i, 90 + b) * 30;
            bars += '<rect x="' + (22 + b * 22) + '" y="' + (98 - h).toFixed(1) + '" width="14" height="' + h.toFixed(1) + '" rx="2" fill="rgba(30,43,250,0.28)"/>';
          }
          return bars + '<path d="M14 99.5h101" stroke="#9a9a9a" stroke-width="1.2"/>' + textLines(i, [114, 130, 146]);
        },
        table: function (i) {
          return '<rect x="14.75" y="46.75" width="99.5" height="13" fill="rgba(30,43,250,0.1)"/>' +
            '<rect x="14" y="46" width="101" height="64" rx="3" fill="none" stroke="#9a9a9a" stroke-opacity="0.7" stroke-width="1.2"/>' +
            '<path d="M14 60h101 M14 76h101 M14 92h101 M47.5 46v64 M81 46v64" stroke="#9a9a9a" stroke-opacity="0.6" stroke-width="1"/>' +
            textLines(i, [122, 136, 150]);
        }
      };
      function tileHTML(i, kind, x, y, hero) {
        return '<div class="f01-tile" id="f01-t' + i + '" style="left:' + x + "px;top:" + y + 'px">' +
          '<div class="f01-tin"><div class="f01-band" style="background:' + BAND[kind] + '"></div>' +
          '<svg viewBox="0 0 129 169" width="129" height="169">' +
          '<g transform="translate(12 14)" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + GLYPH[kind] + "</g>" +
          INTERIOR[kind](i) + "</svg></div>" +
          (hero ? '<div id="f01-outline"></div>' : "") + "</div>";
      }

      var wallHTML = "", heroHTML = "";
      for (var i = 0; i < COLS * ROWS; i++) {
        var col = i % COLS, row = Math.floor(i / COLS);
        var html = tileHTML(i, kindOf(i), X0 + col * PX, Y0 + row * PY, i === HERO);
        if (i === HERO) heroHTML = html; else wallHTML += html;
      }
      CHIPS.forEach(function (c, k) {
        var col = c.idx % COLS, row = Math.floor(c.idx / COLS);
        wallHTML += '<span class="f01-kchip' + (c.mono ? " f01-mono" : "") + '" id="f01-kc' + k + '" style="left:' + (X0 + col * PX + 66) + "px;top:" + (Y0 + row * PY + 108) + 'px">' + c.text + "</span>";
      });
      $("f01-wall").innerHTML = wallHTML;
      $("f01-hero").innerHTML = heroHTML;

      /* ---------- per-phrase sequencer (dynamic-content-sequencing): start times from content length ---------- */
      function sequence(texts, t0, base, perChar, pauses) {
        var acc = t0;
        return texts.map(function (s, j) {
          var at = acc;
          acc += base + s.length * perChar + ((pauses && pauses[j]) || 0);
          return at;
        });
      }

      var tl = gsap.timeline({ paused: true });

      /* ===== Scene 1 (0.0-2.4s): rings, count-up 0 -> 120, "+", label, wall cascade ===== */
      gsap.utils.toArray("#f01-rings .f01-ring").forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.05 + k * 0.12);
      });

      var countEl = $("f01-count");
      var state = { v: 0 };
      var lastShown = -1;
      var COUNT_AT = 0.3, COUNT_DUR = 1.5, COUNT_EASE = "power3.out";
      tl.fromTo(countEl, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, COUNT_AT);
      tl.fromTo(state, { v: 0 }, {
        v: 120, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () {
          var n = Math.round(state.v);
          if (n !== lastShown) { lastShown = n; countEl.textContent = String(n); }
        }
      }, COUNT_AT);
      tl.fromTo(countEl, { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo("#f01-plus", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, COUNT_AT + COUNT_DUR);

      var labelEls = gsap.utils.toArray("#f01-label .f01-lp");
      var labelAt = sequence(labelEls.map(function (e) { return e.textContent; }), 1.2, 0.12, 0.03);
      labelEls.forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, labelAt[k]);
      });

      /* staggered self-assemble: row by row, left to right, short path into each slot */
      var CASCADE_AT = 0.35, CASCADE_GAP = 0.07;
      for (var t = 0; t < COLS * ROWS; t++) {
        tl.fromTo($("f01-t" + t), { opacity: 0, y: 22, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, CASCADE_AT + t * CASCADE_GAP);
      }

      /* ===== Scene 2 (2.4-4.6s): five kind chips settle onto representative tiles, one per 0.3s ===== */
      CHIPS.forEach(function (c, k) {
        tl.fromTo("#f01-kc" + k, { xPercent: -50, y: -26, opacity: 0 }, { xPercent: -50, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.4 + k * 0.3);
      });

      /* ===== Scene 3 (4.6-7.3s): focal pull, numeral -> eyebrow, question per phrase, gloss chip ===== */
      tl.fromTo("#f01-wall", { "--f01-dof": "0px", opacity: 1 }, { "--f01-dof": "4px", opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 4.6);
      tl.fromTo("#f01-outline", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.75);
      tl.fromTo("#f01-t" + HERO, { scale: 1 }, { scale: 1.05, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 4.6);

      /* eyebrow row: "120+" at 60px (scale 0.2727) + label at 32px (scale 0.615), shared baseline y=268 */
      /* the label's x leads and its rise lags a beat, so it slides in beside the numeral only once the numeral has shrunk out of that slot */
      tl.fromTo("#f01-num", { x: 0, y: 0, scale: 1 }, { x: 0, y: -4.45, scale: 0.2727, duration: 0.6, ease: "expo.out" }, 4.6);
      tl.fromTo("#f01-label", { x: 0 }, { x: 160, duration: 0.45, ease: "expo.out" }, 4.6);
      tl.fromTo("#f01-label", { y: 0, scale: 1, color: "#111111" }, { y: -216.5, scale: 0.615, color: "#6b6b6b", duration: 0.75, ease: "expo.out" }, 4.68);

      var qEls = gsap.utils.toArray("#f01-q .f01-qp");
      var qTexts = qEls.map(function (e) { return e.id === "f01-rag" ? "RAG" : e.textContent; });
      var qAt = sequence(qTexts, 4.75, 0.06, 0.015, { 3: 0.06 });
      qEls.forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, qAt[k]);
      });

      tl.fromTo("#f01-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 5.85);
      tl.fromTo("#f01-gloss", { xPercent: -50, y: 14, opacity: 0 }, { xPercent: -50, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.0);

      /* ===== Scene 4 (7.3-9.0s): chapter tracker assembles left to right (all upcoming), then held read ===== */
      gsap.utils.toArray("#f01-hdr .f01-pill").forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.3 + k * 0.14);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
