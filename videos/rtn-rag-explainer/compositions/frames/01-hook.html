<template id="01-hook-template">
  <style>
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:300;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Light.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Regular.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Medium.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Text";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitText-Bold.woff2") format("woff2");}
    @font-face{font-family:"Chulabhorn Likit Display";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/ChulabhornLikitDisplay-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Sans Thai";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexSansThai-Regular.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Sans Thai";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexSansThai-Medium.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Sans Thai";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexSansThai-Bold.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.ttf") format("truetype");}
    @font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype");}

#root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;container-type:size;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";}

    /* ground + atmosphere */
    #f01-ground{position:absolute;inset:0;background:#fdfae7;}
    #f01-rings{position:absolute;inset:0;}
    .f01-ring{position:absolute;box-sizing:border-box;border-radius:50%;border-style:solid;border-width:1.5px;}

    /* archive wall (blur + dim as one grouped layer) */
    #f01-wall{position:absolute;inset:0;z-index:1;--f01-dof:0px;filter:blur(var(--f01-dof));will-change:filter;}
    #f01-hero{position:absolute;inset:0;z-index:2;}
    .f01-tile{position:absolute;box-sizing:border-box;width:132px;height:172px;border:1.5px solid rgba(30,43,250,0.2);border-radius:10px;background:rgba(30,43,250,0.04);}
    .f01-tin{position:absolute;inset:0;border-radius:8.5px;overflow:hidden;}
    .f01-band{position:absolute;left:0;right:0;top:0;height:4px;}
    .f01-tin svg{position:absolute;left:0;top:0;width:129px;height:169px;}
    #f01-outline{position:absolute;box-sizing:border-box;inset:-1.5px;border:2.5px solid #1e2bfa;border-radius:10px;}

    /* kind chips: ONE foreground row in the left column (outside the wall, never blurred) */
    #f01-krow{position:absolute;left:96px;top:680px;display:flex;gap:12px;transform-origin:0 0;transform:scale(0.875);z-index:3;}
    /* the row is born at its FINAL place and size (y 680-730, 28px = 32 x 0.875) and never moves or rescales;
       it ends at x~867, the wall starts at x 1030, so the row never touches a tile. The cream ring stays as a foreground knockout */
    .f01-kchip{display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;padding:4px 18px 4px 14px;border-radius:100px;border:1.5px solid rgba(30,43,250,0.2);outline:6px solid #fdfae7;background:linear-gradient(rgba(30,43,250,0.08),rgba(30,43,250,0.08)),#fdfae7;color:#1e2bfa;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:32px;line-height:1.45;white-space:nowrap;}
    .f01-kchip.f01-mono{font-family:"IBM Plex Mono","Chulabhorn Likit Text","IBM Plex Sans Thai";letter-spacing:0.02em;}
    .f01-kchip svg{display:block;flex:none;width:28px;height:28px;}

    .f01-line{display:block;white-space:nowrap;}
    .f01-ph{display:inline-block;}

    /* year block: eyebrow + rolling year share ONE transform (one origin, top-left) for the Scene-4 shrink.
       Round 6: the whole left stack sits 24px lower (group 196 -> 220); the eyebrow is 40px semibold
       (700: no 600 face is shipped) near-black #3A372E, its ink 16px above the numerals' ink (eyes top 38px) */
    #f01-ygrp{position:absolute;left:96px;top:220px;width:560px;height:282px;transform-origin:0 0;z-index:3;}
    #f01-eyes{position:absolute;left:0;top:38px;height:58px;}
    .f01-eye{position:absolute;left:0;top:0;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:40px;line-height:1.45;color:#3A372E;white-space:nowrap;}
    /* year: Latin digits only, so the tight 230px line box is safe. Each digit sits in a FIXED-width slot
       (advance 120px, glyph centred) so the proportional Display numerals never shift the year sideways.
       Each slot is a vertical reel masked to its box: a change slides only that digit (calendar flip). */
    #f01-year{position:absolute;left:0;top:52px;height:230px;display:flex;transform-origin:0 100%;font-family:"Chulabhorn Likit Display","Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:200px;color:#1e2bfa;font-variant-numeric:tabular-nums;}
    .f01-slot{position:relative;flex:none;width:160px;height:230px;margin:0 -20px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 87%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 87%,transparent 100%);}
    .f01-reel{position:absolute;left:0;top:0;width:160px;}
    .f01-dig{display:block;width:160px;height:230px;line-height:230px;text-align:center;white-space:nowrap;}

    /* era line (Scene 3): two authored lines under the year, on screen 4.4-9.2s */
    #f01-era{position:absolute;left:96px;top:518px;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:40px;line-height:1.45;color:#3a3a3a;z-index:3;}

    /* question headline (Scene 4), centre-left, three authored lines */
    #f01-q{position:absolute;left:96px;top:376px;max-width:1500px;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:700;font-size:60px;line-height:1.45;color:#111111;z-index:4;}
    #f01-rag{position:relative;}
    #f01-uline{position:absolute;left:2px;right:2px;top:71px;height:4px;border-radius:2px;background:#1e2bfa;transform-origin:0 50%;}

    /* chapter tracker (frame.md component 1, all upcoming): the SAME box model as compositions/chrome.html
       (#ch-hdr / #ch-track / .ch-pill / .ch-n, upcoming state), so nothing moves or recolours at the 13.5s hand-over */
    #f01-hdr{position:absolute;left:96px;right:96px;top:56px;height:60px;z-index:4;}
    #f01-track{position:absolute;left:0;top:0;height:60px;display:flex;gap:12px;align-items:center;}
    .f01-pill{font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:28px;line-height:1.45;padding:6px 22px;border-radius:100px;border:1.5px solid rgba(30,43,250,0.2);color:#6b675c;background:rgba(30,43,250,0);white-space:nowrap;}
    .f01-cnum{font-weight:700;margin-right:10px}
  </style>

  <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080" data-duration="14">
    <div id="f01-ground" class="clip" data-start="0" data-duration="14" data-track-index="0"></div>

    <div id="f01-rings"></div>
    <div id="f01-wall"></div>
    <div id="f01-hero"></div>

    <div id="f01-ygrp">
      <div id="f01-eyes">
        <span class="f01-eye" id="f01-e1" data-layout-allow-overlap>จากวันนั้น...</span>
        <span class="f01-eye" id="f01-e2" data-layout-allow-overlap>จนวันนี้...</span>
      </div>
      <div id="f01-year" data-layout-allow-overflow data-layout-allow-occlusion></div> <!-- masked digit reels: off-window digits are hidden by design -->
    </div>

    <div id="f01-era">
      <span class="f01-line"><span class="f01-ph f01-ep">ยุคสมัยที่เปลี่ยนผ่าน</span> <span class="f01-ph f01-ep">ข้อมูลต่างๆมากมาย</span></span>
      <span class="f01-line"><span class="f01-ph f01-ep">ถูกจัดเก็บ</span><span class="f01-ph f01-ep">ในหลากหลายรูปแบบ</span></span>
    </div>

    <div id="f01-krow">
      <span class="f01-kchip f01-mono" id="f01-kc0" data-kind="pdf">PDF</span>
      <span class="f01-kchip" id="f01-kc1" data-kind="scan">ภาพสแกน</span>
      <span class="f01-kchip" id="f01-kc2" data-kind="image">รูปภาพ</span>
      <span class="f01-kchip" id="f01-kc3" data-kind="chart">แผนภูมิ</span>
      <span class="f01-kchip" id="f01-kc4" data-kind="table">ตาราง</span>
    </div>

    <div id="f01-q">
      <span class="f01-line"><span class="f01-ph f01-qa">แล้ว</span><span class="f01-ph f01-qa">วันนี้...</span></span>
      <span class="f01-line"><span class="f01-ph f01-qb">หากเรา</span><span class="f01-ph f01-qb">จะเริ่ม</span><span class="f01-ph f01-qb">จัดทำ</span> <span class="f01-ph f01-qb" id="f01-rag">RAG<span id="f01-uline"></span></span></span>
      <span class="f01-line"><span class="f01-ph f01-qb">ให้กับ</span> <span class="f01-ph f01-qb">ทร.</span><span class="f01-ph f01-qb">ได้อย่างไร</span></span>
    </div>

    <div id="f01-hdr">
      <div id="f01-track"><span class="f01-pill" id="f01-p1"><b class="f01-cnum">1</b>จัดการ</span><span class="f01-pill" id="f01-p2"><b class="f01-cnum">2</b>ค้นหา</span><span class="f01-pill" id="f01-p3"><b class="f01-cnum">3</b>สิทธิการเข้าถึง</span></div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };

      /* deterministic integer hash of (index, salt) -> [0,1) */
      function rnd(i, k) {
        var h = Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(k + 7, 0x85ebca77);
        h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
        h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
        h ^= h >>> 15;
        return (h >>> 0) / 4294967296;
      }

      /* ---------- atmosphere: faint concentric rings behind the year ---------- */
      var RINGS = [
        { r: 160, a: 0.11 },
        { r: 290, a: 0.09 },
        { r: 420, a: 0.07 },
        { r: 550, a: 0.055 }
      ];
      var CX = 336, CY = 352;
      $("f01-rings").innerHTML = RINGS.map(function (g) {
        return '<div class="f01-ring" style="left:' + (CX - g.r) + 'px;top:' + (CY - g.r) + 'px;width:' + (g.r * 2) + 'px;height:' + (g.r * 2) + 'px;border-color:rgba(30,43,250,' + g.a + ')"></div>';
      }).join("");

      /* ---------- archive wall: 6 x 5 document tiles (x 1030-1892), bleeding off the top ---------- */
      var X0 = 1030, Y0 = -56, PX = 146, PY = 188, COLS = 6, ROWS = 5;
      var HERO = 14; /* the example document (a PDF), col 2 row 2 */
      /* tiles that pulse as their kind chip lands, spread over the wall */
      var FORCED = { 6: "pdf", 19: "scan", 9: "image", 22: "chart", 17: "table", 14: "pdf" };
      var CHIP_TILE = [6, 19, 9, 22, 17];
      var BAND = {
        pdf: "#111111",
        scan: "#6b6b6b",
        image: "rgba(30,43,250,0.4)",
        chart: "rgba(30,43,250,0.4)",
        table: "rgba(30,43,250,0.4)"
      };
      var GLYPH = {
        pdf: '<path d="M5 2.5h8l4.5 4.5v12.5H5z M13 2.5V7h4.5"/>',
        scan: '<path d="M2.5 7V2.5H7 M15 2.5h4.5V7 M19.5 15v4.5H15 M7 19.5H2.5V15 M5.5 11h11"/>',
        image: '<rect x="2.5" y="4" width="17" height="14" rx="2"/><path d="M3.5 16.5l4.5-4.5 3.5 3.5 2.5-2.5 4 4"/><circle cx="15" cy="8.5" r="1.6"/>',
        chart: '<path d="M3 19.5h16 M6.5 16.5v-5 M11 16.5V6 M15.5 16.5V9"/>',
        table: '<rect x="2.5" y="3.5" width="17" height="15" rx="2"/><path d="M2.5 8.5h17 M2.5 13.5h17 M9 8.5v10"/>'
      };

      function kindOf(i) {
        if (FORCED[i]) return FORCED[i];
        var r = rnd(i, 1);
        return r < 0.36 ? "pdf" : r < 0.6 ? "scan" : r < 0.75 ? "image" : r < 0.88 ? "table" : "chart";
      }
      function textLines(i, ys, op) {
        return ys.map(function (y, j) {
          var last = j === ys.length - 1;
          var w = last ? 40 + rnd(i, 10 + j) * 36 : 80 + rnd(i, 10 + j) * 21;
          return '<rect x="14" y="' + y + '" width="' + w.toFixed(1) + '" height="6" rx="3" fill="#9a9a9a" fill-opacity="' + (op || 0.5) + '"/>';
        }).join("");
      }
      var INTERIOR = {
        pdf: function (i) { return textLines(i, [54, 72, 90, 108]); },
        scan: function (i) {
          var dots = "";
          for (var d = 0; d < 9; d++) {
            var x = 14 + rnd(i, 30 + d) * 101, y = 44 + rnd(i, 50 + d) * 112, r = 0.6 + rnd(i, 70 + d) * 0.9;
            dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) + '" fill="#6b6b6b" fill-opacity="0.4"/>';
          }
          return '<g transform="rotate(-2.5 64.5 84.5)">' + textLines(i, [54, 72, 90, 108], 0.42) + "</g>" + dots;
        },
        image: function (i) {
          return '<rect x="14" y="46" width="101" height="52" rx="4" fill="rgba(30,43,250,0.08)"/>' +
            '<path d="M14 98 L42 70 L58 84 L76 64 L115 98 Z" fill="rgba(30,43,250,0.16)"/>' +
            '<circle cx="98" cy="60" r="6" fill="rgba(30,43,250,0.2)"/>' +
            textLines(i, [112, 128, 144]);
        },
        chart: function (i) {
          var bars = "";
          for (var b = 0; b < 4; b++) {
            var h = 16 + rnd(i, 90 + b) * 30;
            bars += '<rect x="' + (22 + b * 22) + '" y="' + (98 - h).toFixed(1) + '" width="14" height="' + h.toFixed(1) + '" rx="2" fill="rgba(30,43,250,0.28)"/>';
          }
          return bars + '<path d="M14 99.5h101" stroke="#9a9a9a" stroke-width="1.2"/>' + textLines(i, [114, 130, 146]);
        },
        table: function (i) {
          return '<rect x="14.75" y="46.75" width="99.5" height="13" fill="rgba(30,43,250,0.1)"/>' +
            '<rect x="14" y="46" width="101" height="64" rx="3" fill="none" stroke="#9a9a9a" stroke-opacity="0.7" stroke-width="1.2"/>' +
            '<path d="M14 60h101 M14 76h101 M14 92h101 M47.5 46v64 M81 46v64" stroke="#9a9a9a" stroke-opacity="0.6" stroke-width="1"/>' +
            textLines(i, [122, 136, 150]);
        }
      };
      function tileHTML(i, kind, x, y, hero) {
        return '<div class="f01-tile" id="f01-t' + i + '" style="left:' + x + "px;top:" + y + 'px">' +
          '<div class="f01-tin"><div class="f01-band" style="background:' + BAND[kind] + '"></div>' +
          '<svg viewBox="0 0 129 169" width="129" height="169">' +
          '<g transform="translate(12 14)" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + GLYPH[kind] + "</g>" +
          INTERIOR[kind](i) + "</svg></div>" +
          (hero ? '<div id="f01-outline"></div>' : "") + "</div>";
      }

      var wallHTML = "", heroHTML = "";
      for (var i = 0; i < COLS * ROWS; i++) {
        var col = i % COLS, row = Math.floor(i / COLS);
        var html = tileHTML(i, kindOf(i), X0 + col * PX, Y0 + row * PY, i === HERO);
        if (i === HERO) heroHTML = html; else wallHTML += html;
      }
      $("f01-wall").innerHTML = wallHTML;
      $("f01-hero").innerHTML = heroHTML;

      /* each kind chip carries its tile-kind glyph at 28px (same paths as the wall tiles) */
      gsap.utils.toArray("#f01-krow .f01-kchip").forEach(function (el) {
        el.insertAdjacentHTML("afterbegin",
          '<svg viewBox="0 0 22 22" width="28" height="28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          GLYPH[el.getAttribute("data-kind")] + "</g></svg>");
      });

      /* ---------- rolling year: one reel per digit slot, every intermediate year in sequence ---------- */
      var YEAR_FROM = "2449", YEAR_TO = "2569";
      var YA = parseInt(YEAR_FROM, 10), N = parseInt(YEAR_TO, 10) - YA; /* 120 year steps */
      var PITCH = 230;               /* reel cell = slot height */
      var ROLL_AT = 0.8, ROLL_STOP = 3.6;
      var FLIP_MAX = 0.16, FLIP_SHARE = 0.7;
      var rollEase = gsap.parseEase("power2.inOut");
      function invEase(y) {          /* deterministic bisection inverse of the roll ease */
        var lo = 0, hi = 1;
        for (var it = 0; it < 48; it++) { var m = (lo + hi) / 2; if (rollEase(m) < y) lo = m; else hi = m; }
        return (lo + hi) / 2;
      }
      /* The year value follows ONE power2.inOut curve; the shown year is that value rounded, so year k arrives
         when the curve passes k - 0.5. The curve is scaled so the last arrival (2569) completes at ROLL_STOP:
         (GSAP power2 = cubic) slow first ticks (2450 ~1.12s, 2451 ~1.26s, 2453 ~1.40s, 2455 ~1.50s), fast through
         the middle, slowing into 2569 at 3.6s.
         arrive[k] = when year YA+k is settled. */
      var SPAN = (ROLL_STOP - ROLL_AT) / invEase((N - 0.5) / N);
      var arrive = [ROLL_AT];
      for (var k = 1; k <= N; k++) arrive.push(ROLL_AT + SPAN * invEase((k - 0.5) / N));
      arrive[N] = ROLL_STOP;

      /* digit sequence per slot: only the digits that change get a new reel cell and a flip */
      var first = String(YA);
      var slots = [0, 1, 2, 3].map(function (s) { return { seq: [first.charAt(s)], at: [] }; });
      for (var y = 1; y <= N; y++) {
        var prev = String(YA + y - 1), cur = String(YA + y);
        for (var s = 0; s < 4; s++) {
          if (cur.charAt(s) !== prev.charAt(s)) { slots[s].seq.push(cur.charAt(s)); slots[s].at.push(y); }
        }
      }
      $("f01-year").innerHTML = slots.map(function (sl, s) {
        return '<div class="f01-slot" data-layout-allow-overflow data-layout-allow-occlusion><div class="f01-reel" id="f01-reel' + s + '" data-layout-allow-overflow data-layout-allow-occlusion>' +
          sl.seq.map(function (d) { return '<span class="f01-dig" data-layout-allow-occlusion data-layout-allow-overflow data-layout-allow-overlap>' + d + "</span>"; }).join("") /* off-window digits are clipped by the slot by design */ + "</div></div>";
      }).join("");

      var tl = gsap.timeline({ paused: true });

      /* ===== Scene 1 (0.0-3.9s): rings, eyebrow + year "2449", roll to "2569" (0.8-3.6s), wall cascade ===== */
      gsap.utils.toArray("#f01-rings .f01-ring").forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.05 + k * 0.12);
      });

      tl.fromTo("#f01-e1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo("#f01-year", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.3);

      /* the flips: one fromTo per digit change, each ENDING when its year arrives, never overlapping the
         previous flip on the same reel (duration <= 70% of the gap), all later ones immediateRender:false.
         Pure transforms on a paused timeline: any seek t shows exactly the year the curve gives at t. */
      slots.forEach(function (sl, s) {
        var reel = $("f01-reel" + s);
        sl.at.forEach(function (yk, j) {
          var d = Math.min(FLIP_MAX, FLIP_SHARE * (arrive[yk] - arrive[yk - 1]));
          tl.fromTo(reel, { y: -j * PITCH }, { y: -(j + 1) * PITCH, duration: d, ease: "power2.out", immediateRender: false }, arrive[yk] - d);
        });
      });

      /* staggered self-assemble: row by row, left to right; the last tile settles as the year stops (3.6s) */
      var CASCADE_AT = 0.4, TILE_DUR = 0.5;
      var CASCADE_GAP = (ROLL_STOP - TILE_DUR - CASCADE_AT) / (COLS * ROWS - 1);
      for (var t = 0; t < COLS * ROWS; t++) {
        tl.fromTo($("f01-t" + t), { opacity: 0, y: 22, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: TILE_DUR, ease: "power3.out" }, CASCADE_AT + t * CASCADE_GAP);
      }

      /* ===== Scene 2 (3.9-4.8s): eyebrow swap at the same place, never both visible; the year holds ===== */
      tl.fromTo("#f01-e1", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 3.9);
      tl.fromTo("#f01-e2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.2);

      /* per-phrase sequencer: start times from content length */
      function sequence(texts, t0, base, perChar) {
        var acc = t0;
        return texts.map(function (s) { var at = acc; acc += base + s.length * perChar; return at; });
      }

      /* ===== Scene 3 (4.4-9.2s): era line per phrase; kind chips land at their final place at 5.6s ===== */
      var eraEls = gsap.utils.toArray("#f01-era .f01-ep");
      var eraAt = sequence(eraEls.map(function (e) { return e.textContent; }), 4.4, 0.06, 0.009); /* era line from 4.4s: ~4.8s on screen (to 9.2s) for ~50 chars */
      eraEls.forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, eraAt[k]);
      });

      var CHIP_AT = 5.6, CHIP_GAP = 0.15, PULSE_LAG = 0.2;
      CHIP_TILE.forEach(function (idx, k) {
        var at = CHIP_AT + k * CHIP_GAP;
        tl.fromTo("#f01-kc" + k, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
        /* tile pulse 1 -> 1.06 -> 1 over 0.3s (its cascade scale tween ended by 3.6s) */
        tl.fromTo("#f01-t" + idx, { scale: 1 }, { scale: 1.06, duration: 0.15, ease: "power2.out", immediateRender: false }, at + PULSE_LAG);
        tl.fromTo("#f01-t" + idx, { scale: 1.06 }, { scale: 1, duration: 0.15, ease: "power2.inOut", immediateRender: false }, at + PULSE_LAG + 0.15);
      });

      /* ===== Scene 4 (9.2-12.4s): era out 9.2, year block shrinks 9.2-9.8, wall dims 9.4-9.8, question 9.6 / 10.2 ===== */
      tl.fromTo("#f01-era", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 9.2);
      /* eyebrow + year move as ONE group: a single transform, one origin (top-left), one ease.
         scale 0.7 takes the year to 140px and the eyebrow to 28px (40 x 0.7, the type floor); the group box lands at y 164-361, above the headline (y 376) */
      var SHRINK = 0.7, GRP_TOP = 220, GRP_TO = 164;
      tl.fromTo("#f01-ygrp", { x: 0, y: 0, scale: 1 }, { x: 0, y: GRP_TO - GRP_TOP, scale: SHRINK, duration: 0.6, ease: "power2.inOut" }, 9.2);

      tl.fromTo("#f01-wall", { "--f01-dof": "0px", opacity: 1 }, { "--f01-dof": "4px", opacity: 0.4, duration: 0.4, ease: "power2.inOut" }, 9.4);
      tl.fromTo("#f01-t" + HERO, { scale: 1 }, { scale: 1.05, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 9.4);

      gsap.utils.toArray("#f01-q .f01-qa").forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.6 + k * 0.14);
      });
      var qEls = gsap.utils.toArray("#f01-q .f01-qb");
      var qAt = sequence(qEls.map(function (e) { return e.id === "f01-rag" ? "RAG" : e.textContent; }), 10.2, 0.08, 0.012);
      var ragAt = 0;
      qEls.forEach(function (el, k) {
        tl.fromTo(el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, qAt[k]);
        if (el.id === "f01-rag") ragAt = qAt[k];
      });
      /* RAG underline draws once the word has landed */
      tl.fromTo("#f01-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, ragAt + 0.4);

      /* ===== Scene 5 (12.4-13.5s): chapter tracker (all upcoming), opacity-only fades at 12.4 / 12.5 / 12.6s
         (0.25s each): every pill sits at the chrome's exact position and inactive colour by 12.85s ===== */
      ["#f01-p1", "#f01-p2", "#f01-p3"].forEach(function (id, k) {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 12.4 + k * 0.1);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
