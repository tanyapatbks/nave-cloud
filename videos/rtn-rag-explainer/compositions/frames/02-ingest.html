          <path class="f02-draw" id="f02-lkB" d="M282 79V17"/>
          <g fill="#1e2bfa"><circle id="f02-dA0" cx="96" cy="79" r="3.5"/><circle id="f02-dA1" cx="96" cy="17" r="3.5"/><circle id="f02-dB0" cx="282" cy="79" r="3.5"/><circle id="f02-dB1" cx="282" cy="17" r="3.5"/></g>
        </svg>
      </div>

      <!-- the chart's bars, lifted off and carried into the table rows -->
      <div class="f02-fly" id="f02-fly1" data-layout-ignore style="left:436px;top:84px;height:40px"></div>
      <div class="f02-fly" id="f02-fly2" data-layout-ignore style="left:464px;top:58px;height:66px"></div>
      <div class="f02-fly" id="f02-fly3" data-layout-ignore style="left:492px;top:74px;height:50px"></div>

      <div class="f02-res"><span class="f02-line"><span class="f02-ph" id="f02-r3a">ดึงตัวเลขจริง</span> <span class="f02-ph" id="f02-r3b"><span class="f02-plus">+</span> ความสัมพันธ์</span></span></div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });

      // ---------- deterministic scan noise (seeded, fixed) ----------
      function f02Rand(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      (function buildScan() {
        const rnd = f02Rand(2569);
        let s = "";
        for (let i = 0; i < 7; i++) {
          const y = 34 + i * 11.5;
          const end = i === 6 ? 62 : 88;
          let x = 10 + rnd() * 2;
          while (x < end - 8) {
            const w = Math.min(end - x, 12 + rnd() * 24);
            const dy = (rnd() - 0.5) * 2.4;
            s += '<rect x="' + x.toFixed(1) + '" y="' + (y + dy).toFixed(1) + '" width="' + w.toFixed(1) +
              '" height="' + (4 + rnd() * 1.8).toFixed(1) + '" rx="1.6" fill="#9a9a9a" opacity="' + (0.5 + rnd() * 0.4).toFixed(2) + '"/>';
            x += w + 3 + rnd() * 4;
          }
        }
        for (let i = 0; i < 95; i++) {
          s += '<circle cx="' + (4 + rnd() * 92).toFixed(1) + '" cy="' + (8 + rnd() * 116).toFixed(1) + '" r="' +
            (0.4 + rnd() * 1.1).toFixed(2) + '" fill="#6b6b6b" opacity="' + (0.22 + rnd() * 0.45).toFixed(2) + '"/>';
        }
        $("f02-scan-noise").innerHTML = s;
      })();

      // ---------- svg-path-draw prep: measured lengths ----------
      document.querySelectorAll(".f02-draw").forEach((p) => {
        let len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        if (!(len > 0)) len = 140;
        p.__f02len = len;
        p.style.strokeDasharray = len + " " + (len + 20);
        p.style.strokeDashoffset = String(len + 10);
      });
      const draw = (id, at, dur) => {
        const p = $(id);
        tl.fromTo(p, { strokeDashoffset: p.__f02len + 10 }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      };
      const phrases = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, at);
      const tileIn = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 14, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, at);
      const activate = (n, at) => {
        tl.fromTo("#f02-on" + n, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
        tl.fromTo("#f02-rule" + n, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, at);
      };
      const arrow = (n, at) => { draw("f02-ar" + n, at, 0.45); draw("f02-ah" + n, at + 0.33, 0.2); };

      // ---------- Scene 1 (0.0–1.4): empty lanes + headline ----------
      tl.fromTo(".f02-frame-off", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out", stagger: 0.08 }, 0.05);
      tl.fromTo("#f02-h2 .f02-ph", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.13 }, 0.3);

      // ---------- Scene 2 (1.4–4.2): lane 1, PDF → outline (scale-swap) ----------
      activate(1, 1.4);
      phrases("#f02-l1a", 1.45);
      tileIn("#f02-pdfb", 1.65);
      tileIn("#f02-pdf", 1.78);
      arrow(1, 2.15);
      // the page's content slides out of the page (outgoing state lands first)
      tl.fromTo("#f02-raw", { opacity: 0, x: -40, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 2.45);
      // swap: outgoing rushes away, incoming arrives with weight (OVERLAP 0.15)
      tl.fromTo("#f02-raw", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.72, duration: 0.35, ease: "power2.in", immediateRender: false }, 3.15);
      tl.fromTo("#f02-outline", { opacity: 0, scale: 0.72 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 3.35);
      draw("f02-tree", 3.75, 0.45);
      phrases("#f02-r1a, #f02-r1b", 3.62);

      // ---------- Scene 3 (4.2–7.0): lane 2, scan/photo → read (hacker-flip per word) ----------
      activate(2, 4.2);
      phrases("#f02-l2a, #f02-l2b", 4.25);
      tileIn("#f02-scan", 4.45);
      tileIn("#f02-photo", 4.6);
      arrow(2, 4.95);
      tl.fromTo("#f02-read", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 5.2);

      const GLYPHS = "#%&@*+=?<>/~$XKQZW";
      const pseudoGlyph = (seed) => GLYPHS[Math.floor((((seed * 9301 + 49297) % 233280) / 233280) * GLYPHS.length)];
      const WORDS = [[5, 7, 4], [6, 4, 6], [7, 5]]; // glyph counts per word, three lines
      const slots = [];
      WORDS.forEach((line, li) => {
        const row = $("f02-tl" + (li + 1));
        line.forEach((n) => {
          const slot = document.createElement("span");
          slot.className = "f02-slot";
          slot.style.width = (n * 13.2 + 2).toFixed(1) + "px";
          const bar = document.createElement("span"); // the clean word: target + width-reserving ghost
          bar.className = "f02-wbar";
          const gly = document.createElement("span");
          gly.className = "f02-gly";
          slot.appendChild(bar);
          slot.appendChild(gly);
          row.appendChild(slot);
          slots.push({ slot: slot, bar: bar, gly: gly, n: n });
        });
      });
      const FLIP = 0.8, STAG = 0.07, TH = 0.66, DEC_AT = 5.3;
      slots.forEach((o, i) => {
        let mode = "";
        let lastStep = -1;
        const paint = (p, lin) => {
          if (p < TH) {
            const step = Math.floor((lin * FLIP * 30) / 3); // one glyph swap every ~3 frames @30fps
            if (mode !== "g") { mode = "g"; o.gly.style.opacity = "1"; o.bar.style.opacity = "0"; }
            if (step !== lastStep) {
              lastStep = step;
              let txt = "";
              for (let j = 0; j < o.n; j++) txt += pseudoGlyph((i * 16 + j) * 1000 + step * 7);
              o.gly.textContent = txt;
            }
          } else if (mode !== "b") {
            mode = "b"; lastStep = -1;
            o.gly.textContent = "";
            o.gly.style.opacity = "0"; o.bar.style.opacity = "1";
          }
          o.slot.style.transform = "rotateX(" + (90 - p * 90).toFixed(2) + "deg)";
          o.slot.style.opacity = Math.min(1, p * 2).toFixed(3);
        };
        paint(0, 0);
        const st = { p: 0 };
        tl.fromTo(st, { p: 0 }, {
          p: 1, duration: FLIP, ease: "power3.out",
          onUpdate: function () { paint(st.p, this.progress()); },
        }, DEC_AT + i * STAG);
      });
      tl.fromTo("#f02-capimg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.15);
      tl.fromTo("#f02-cappill", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 6.2);
      tl.fromTo("#f02-capbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 6.35);
      phrases("#f02-r2a, #f02-r2b", 6.3);
      tl.fromTo("#f02-chip2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.55);

      // ---------- Scene 4 (7.0–9.6): lane 3, chart/table → clean table + relationships ----------
      activate(3, 7.0);
      phrases("#f02-l3a, #f02-l3b", 7.05);
      tileIn("#f02-chart", 7.22);
      tileIn("#f02-grid", 7.34);
      arrow(3, 7.55);
      tl.fromTo("#f02-tbl", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 7.8);
      // bars light up, lift off the chart, rotate flat and land as table rows
      const FLY = [{ dx: 601, dy: -43 }, { dx: 573, dy: 0 }, { dx: 545, dy: 22 }];
      FLY.forEach((f, i) => {
        const id = "#f02-fly" + (i + 1);
        const lit = 7.85 + i * 0.08;
        const go = 7.97 + i * 0.08;
        const land = go + 0.7;
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, lit);
        tl.fromTo(id, { x: 0, y: 0, rotation: 0 }, { x: f.dx, y: f.dy, rotation: 90, duration: 0.7, ease: "power2.inOut" }, go);
        tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.out", immediateRender: false }, land);
        tl.fromTo("#f02-rl" + (i + 1), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, land - 0.05);
        tl.fromTo("#f02-v" + (i + 1), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, land - 0.05);
      });
      // relationships: row 2 linked to both column headers
      tl.fromTo("#f02-rowhl", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 8.95);
      tl.fromTo(["#f02-dA0", "#f02-dB0"], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out", stagger: 0.08 }, 9.0);
      draw("f02-lkA", 9.02, 0.35);
      draw("f02-lkB", 9.1, 0.35);
      tl.fromTo(["#f02-dA1", "#f02-dB1"], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", stagger: 0.08 }, 9.33);
      phrases("#f02-r3a, #f02-r3b", 8.9);

      // ---------- Scene 5 (9.6–11.0): held read — nothing moves ----------

      window.__timelines = window.__timelines || {};
      window.__timelines["02-ingest"] = tl;
    })();
  </script>
</template>
