  <script>
    (function () {
      var COMP = "03-filename";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };
      var measure = function (p, fallback) {
        var len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        return len > 0 ? len : fallback;
      };

      var INK = "#3A3832";   // round-3: token text, never dimmed (10.7:1 on the rest pill)
      var PILL_REST = "rgba(30,43,250,0.04)";

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.4s): header static; headline per phrase; empty filename slots appear ──
      tl.fromTo($$("#f03-h2 .f03-ph"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.18 }, 0.3);
      tl.fromTo($$("#f03-strip .f03-ghost"),
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.05 }, 0.35);
      tl.fromTo($$("#f03-strip .f03-sep"),
        { opacity: 0 },
        { opacity: 0.3, duration: 0.5, ease: "power2.out", stagger: 0.05 }, 0.4);

      // ── Scene 2 (1.4–7.2s): tokens snap into their slots on cue (dynamic-content-sequencing) ──
      // Content array → flat TIMELINE of absolute windows, computed once at build.
      var SCENE3 = 7.2;
      var CONTENT = [
        { n: 1, at: 1.4, move: "drop" },
        { n: 2, at: 2.4, move: "slide" },
        { n: 3, at: 3.4, move: "type" },
        { n: 4, at: 4.4, move: "pop" },
        { n: 5, at: 5.2, move: "rise" },
        { n: 6, at: 6.0, move: "wipe" },
        { n: 7, at: 6.8, move: "snap" }
      ];
      var TIMELINE = CONTENT.map(function (e, i) {
        return { n: e.n, move: e.move, start: e.at, end: i < CONTENT.length - 1 ? CONTENT[i + 1].at : SCENE3 };
      });

      TIMELINE.forEach(function (e) {
        var col = $("#f03-c" + e.n);
        var tok = col.querySelector(".f03-tok");
        var ghost = col.querySelector(".f03-ghost");
        var sep = $("#f03-s" + e.n);
        var t = e.start;

        if (sep) tl.to(sep, { opacity: 1, duration: 0.25, ease: "power2.out" }, t - 0.05);
        tl.to(ghost, { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.1);

        // each beat its own move (kinetic-type-beats, in-place line build)
        if (e.move === "drop") {
          tl.fromTo(tok, { opacity: 0, y: -36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
        } else if (e.move === "slide") {
          tl.fromTo(tok, { opacity: 0, x: 48 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
        } else if (e.move === "type") {
          tl.fromTo(tok, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, t);
          tl.fromTo(tok.querySelectorAll(".f03-dg"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", stagger: 0.035 }, t + 0.06);
        } else if (e.move === "pop") {
          tl.fromTo(tok, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, t);
        } else if (e.move === "rise") {
          tl.fromTo(tok, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
        } else if (e.move === "wipe") {
          tl.fromTo(tok,
            { clipPath: "inset(0% 100% 0% 0% round 100px)" },
            { clipPath: "inset(0% 0% 0% 0% round 100px)", duration: 0.5, ease: "power2.inOut" }, t);
        } else if (e.move === "snap") {
          tl.fromTo(tok, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, t);
        }

        // the arriving token is the active (cobalt) one; it relaxes to ink when its window ends
        tl.to(tok, { backgroundColor: PILL_REST, color: INK, duration: 0.35, ease: "power2.out" }, e.end);

        // tick draws down to the label (svg-path-draw), then the two label lines rise in
        var tick = col.querySelector(".f03-tick path");
        if (tick) {
          var len = measure(tick, 40);
          tick.style.strokeDasharray = len + " " + len;
          tl.fromTo(tick, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.2);
          tl.fromTo(col.querySelectorAll(".f03-l1, .f03-l2"),
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", stagger: 0.12 }, t + 0.36);
        }
      });

      // ── Scene 3 (7.2–7.6s): the example-document glyph draws at the strip's left end ──
      var outline = $("#f03-doc-outline");
      var olen = measure(outline, 280);
      outline.style.strokeDasharray = olen + " " + olen;
      tl.fromTo(outline, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, SCENE3);
      tl.fromTo(outline, { strokeDashoffset: olen }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, SCENE3);
      tl.fromTo($$("#f03-doc .f03-doc-in"),
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.06 }, SCENE3 + 0.35);

      // ── Scene 4 (7.6–12.0s): the bridge block, its ledger icon and first phrase fade in together
      //    (never an empty box); the second phrase follows; hold still ──
      var B = 7.6;
      tl.fromTo($("#f03-hl"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B);
      tl.fromTo($("#f03-b2"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B + 0.55);

      // round-3/4: the name is not the permission — a bracket draws out from its centre under the whole row,
      // a dashed connector drops from its centre tick, and an ink circle with a struck padlock pops in on it
      // with the bridge; the strike draws after.
      // No text dims: once the bridge has finished (8.5s) only the token pills' fill + border step back to 60%.
      tl.fromTo($("#f03-brk"),
        { clipPath: "inset(0% 50% 0% 50%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power2.out" }, B);
      tl.fromTo($("#f03-conn"),
        { clipPath: "inset(0% 0% 100% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.25, ease: "power2.out" }, B + 0.05);
      tl.fromTo($("#f03-nolock"),
        { opacity: 0, scale: 0.8 },
