  <script>
    (function () {
      var COMP = "04-tags";
      var host = document.querySelector('[data-composition-id="' + COMP + '"]');
      var $ = function (s) { return host.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(host.querySelectorAll(s)); };
      var measure = function (p) {
        var len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        if (!(len > 0)) len = Number(p.getAttribute("data-len")) || 0;
        return len * 1.02;
      };

      var tl = gsap.timeline({ paused: true });

      // svg-path-draw: dasharray = measured length, dashoffset length -> 0
      var draw = function (p, at, dur) {
        var len = measure(p);
        // gap longer than the dash and start offset past it: no sub-pixel speck before the draw begins
        p.style.strokeDasharray = len + " " + (len + 8);
        tl.fromTo(p, { strokeDashoffset: len + 4 }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      };

      // stamp: the mini badge presses into its slot (short smooth settle, no overshoot)
      var stamp = function (bslot, at, lit) {
        var badge = bslot.querySelector(".f04-badge");
        var slot = bslot.querySelector(".f04-slot");
        tl.fromTo(badge, { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.32, ease: "power2.out" }, at);
        tl.fromTo(slot, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.out" }, at);
        if (lit) tl.fromTo(lit, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
      };

      // ---- Scene 1 (0.0–1.4s): document + headline per phrase ----
      tl.fromTo("#f04-doc", { opacity: 0, y: 28, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#f04-ph1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3);
      tl.fromTo("#f04-ph2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.62);
      // cut lines mark the four pieces just before the split
      $$(".f04-cut").forEach(function (p, i) { draw(p, 1.08 + i * 0.07, 0.3); });

      // ---- Scene 2 (1.4–2.8s): center-outward-expansion, ordered by index ----
      var chunks = $$(".f04-chunk");
      chunks.forEach(function (el, i) {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: Number(el.dataset.targetX), y: Number(el.dataset.targetY), scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" },
          1.4 + i * 0.07
        );
      });
      tl.fromTo("#f04-chip-chunk", { opacity: 0, y: 10, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 1.45);

      // ---- Scene 3 (2.2–6.7s): tag card, rows on cue (2.4 / 3.0 / 3.6 / 4.2), then the inheritance ----
      tl.fromTo("#f04-tag", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.2);
      var ROW_AT = [2.4, 3.0, 3.6, 4.2];
      ROW_AT.forEach(function (at, i) {
        var row = $("#f04-r" + (i + 1));
        tl.fromTo(row.querySelector(".f04-dot"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, at);
        tl.fromTo(row.querySelector(".f04-q"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + 0.05);
        tl.fromTo([row.querySelector(".f04-sep"), row.querySelector(".f04-t")], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at + 0.18);
      });
      // 4.9–5.9s: one at a time, top to bottom (0.15s apart, 0.55s flight), each row bullet emits its dot;
      // the four dots travel into the document's mini badge, which is how the 4-dot badge gets its meaning.
      // Row bullet centres (stage px): x 483; y 503.15 / 574.45 / 645.75 / 717.05 (tag card grid, fixed line boxes).
      // Doc badge dot centres: x 255.5 / 275.5 / 295.5 / 315.5, y 748.5 (badge x 235.5-335.5, y 732.5-764.5).
      var ROW_Y = [503.15, 574.45, 645.75, 717.05];
      var EMIT_AT = [4.9, 5.05, 5.2, 5.35];
      var FLY = 0.55;
      var docBadge = $("#f04-doc-bs .f04-badge");
      var docDots = Array.prototype.slice.call(docBadge.querySelectorAll("span"));
      docDots.forEach(function (d, i) {
        var at = EMIT_AT[i];
        var row = $("#f04-r" + (i + 1));
        var rowEls = [row.querySelector(".f04-dot"), row.querySelector(".f04-q"), row.querySelector(".f04-sep"), row.querySelector(".f04-t")];
        // the emitted dot starts exactly on its row bullet (14px bullet = 12px dot x 14/12)
        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, at);
        tl.fromTo(d, { x: 483 - (255.5 + 20 * i), y: ROW_Y[i] - 748.5, scale: 14 / 12 }, { x: 0, y: 0, scale: 1, duration: FLY, ease: "power2.inOut" }, at);
        // the source row pulses 1 -> 0.6 -> 1 as its dot leaves
        tl.fromTo(rowEls, { opacity: 1 }, { opacity: 0.6, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(rowEls, { opacity: 0.6 }, { opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, at + 0.12);
      });
      // the doc badge body forms as the dots land (dashed slot -> filled pill), complete when the last dot lands at 5.9s
      tl.fromTo(docBadge, { backgroundColor: "rgba(30,43,250,0)", borderColor: "rgba(30,43,250,0)" }, { backgroundColor: "rgba(30,43,250,0.08)", borderColor: "rgba(30,43,250,0.2)", duration: 0.45, ease: "power2.out" }, 5.45);
      tl.fromTo("#f04-doc-bs .f04-slot", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 5.45);

      // the connector the copies ride: out of the doc's bottom edge, under the tag card, up the badge column
      draw($("#f04-link"), 5.5, 0.42);
      draw($("#f04-sp3"), 5.84, 0.12);
      draw($("#f04-sp2"), 5.88, 0.12);
      draw($("#f04-sp1"), 5.92, 0.12);

      // 5.9–6.7s: a copy of the doc's badge travels the connector to each chunk (0.35s each, 0.15s stagger).
      // Path of the copy's top-left: doc badge (235.5, 732.5) -> down to the y 860 run (top 844) -> right to the
      // badge column (x 1564.5) -> up to the chunk's slot. One power2.inOut over the whole path, split into
      // three tweens at their arc-length fractions so the speed stays continuous through the corners.
      var E2 = function (t) { return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); };
      var E2inv = function (f) { return f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2); };
      var part = function (t0, t1, f0, f1) { return function (u) { return (E2(t0 + u * (t1 - t0)) - f0) / (f1 - f0); }; };
      var CP_X0 = 235.5, CP_Y0 = 732.5, RUN_Y = 844, SLOT_X = 1564.5;
      var SLOT_Y = [466, 564, 676, 774];
      var COPY_AT = [5.9, 6.05, 6.2, 6.35];
      var TRAVEL = 0.35;
      chunks.forEach(function (el, i) {
        var cp = $("#f04-cp" + (i + 1));
        var at = COPY_AT[i];
        var L1 = RUN_Y - CP_Y0, L2 = SLOT_X - CP_X0, L3 = RUN_Y - SLOT_Y[i], L = L1 + L2 + L3;
        var f1 = L1 / L, f2 = (L1 + L2) / L, t1 = E2inv(f1), t2 = E2inv(f2);
        tl.fromTo(cp, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, at);
        tl.fromTo(cp, { x: CP_X0, y: CP_Y0 }, { x: CP_X0, y: RUN_Y, duration: TRAVEL * t1, ease: part(0, t1, 0, f1) }, at);
        tl.fromTo(cp, { x: CP_X0 }, { x: SLOT_X, duration: TRAVEL * (t2 - t1), ease: part(t1, t2, f1, f2), immediateRender: false }, at + TRAVEL * t1);
        tl.fromTo(cp, { y: RUN_Y }, { y: SLOT_Y[i], duration: TRAVEL * (1 - t2), ease: part(t2, 1, f2, 1), immediateRender: false }, at + TRAVEL * t2);
        // on arrival the copy settles into the chunk's slot and the chunk lights up
        var land = at + TRAVEL;
        tl.fromTo(el.querySelector(".f04-slot"), { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.out" }, land - 0.04);
        tl.fromTo(el.querySelector(".f04-lit"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, land - 0.04);
      });

      // ---- Scene 4 (6.6–9.0s): tree nodes attach, receive the same badge; "สารบัญ" over "Tree Nodes" at 7.0s; hold from 7.4s ----
      tl.fromTo("#f04-nA", { opacity: 0, y: -16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 6.6);
      tl.fromTo("#f04-nB", { opacity: 0, y: -16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 6.68);
      draw($("#f04-railA"), 6.72, 0.45);
      draw($("#f04-railB"), 6.8, 0.5);
      draw($("#f04-tickA"), 7.0, 0.18);
      draw($("#f04-tickB"), 7.1, 0.18);
      stamp($("#f04-nA .f04-bslot"), 6.95, null);
      stamp($("#f04-nB .f04-bslot"), 7.05, null);
      tl.fromTo("#f04-th-tree", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.0);
      tl.fromTo("#f04-chip-tree", { opacity: 0, y: 10, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 7.06);
      draw($("#f04-leadA"), 7.1, 0.28);
      draw($("#f04-leadB"), 7.1, 0.28);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    })();
  </script>
