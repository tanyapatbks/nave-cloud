  <script>
    (function () {
      var ID = "07-rerank";
      var root = document.querySelector('[data-composition-id="07-rerank"]');
      var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
      var one = function (s) { return root.querySelector(s); };

      // geometry (px, 1920x1080)
      var PITCH = 68, ROW_L = 96, ROW_T0 = 300, NUDGE = 36;
      var TRAY_L = 82, TRAY_T = 286, TRAY_W = 708, PAD = 14;
      var CARD_L = 960, CARD_T = 420, CARD_W = 864;
      var S0 = TRAY_W / CARD_W;            // tray apparent size = card x S0
      var R0 = 24 / S0;                    // tray apparent radius 24 (pre-scale units)

      var rows = all(".f07-row");
      var scores = rows.map(function (r) { return Number(r.getAttribute("data-score")); });
      // deterministic rank: score desc, tie -> initial index
      var order = rows.map(function (r, i) { return i; }).sort(function (a, b) {
        return scores[b] - scores[a] || a - b;
      });
      var rank = [];
      order.forEach(function (idx, k) { rank[idx] = k; });
      rows.forEach(function (r, i) { r.style.zIndex = String(20 - rank[i]); });
      var sortedY = function (i) { return (rank[i] - i) * PITCH; };

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-1.0): rows arrive unsorted; headline per phrase ----

      // ---- Scene 2 (1.0-2.4): relevance fills (stat-bars-and-fills), then re-sort ----

        tl.fromTo(r.querySelector(".f07-fill"), { scaleX: 0 }, { scaleX: scores[i], duration: 0.5, ease: "power2.out" }, 1.0 + i * 0.025);
      });
      rows.forEach(function (r, i) {
        tl.fromTo(r, { y: 0 }, { y: sortedY(i), duration: 0.68, ease: "power3.inOut", immediateRender: false }, 1.72);
      });

      // ---- Scene 3 (2.4-4.2): cut line under row 3, "Top 3", rows 4-8 defocus (depth-of-field-blur, light) ----
      tl.fromTo("#f07-cutline", { strokeDashoffset: 692 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 2.4);
      tl.fromTo("#f07-top3", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" }, 2.62);
      rows.forEach(function (r, i) {
        if (rank[i] < 3) return;
        var depth = rank[i] - 2; // 1..5
        tl.fromTo(r, { y: sortedY(i) }, { y: sortedY(i) + NUDGE, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 2.65);
        tl.fromTo(r, { "--dof": "0px", opacity: 1 }, { "--dof": (0.7 + 0.5 * depth).toFixed(2) + "px", opacity: 0.35, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 2.65);
      });
      // tray (the morph card's shot-1 state) gathers the kept three
      tl.fromTo("#f07-card",
        { x: TRAY_L - CARD_L, y: TRAY_T - CARD_T, scale: S0, borderRadius: R0 + "px", backgroundColor: "rgba(30,43,250,0.08)", borderColor: "rgba(30,43,250,0.10)" },
        { x: 0, y: 0, scale: 1, borderRadius: "14px", backgroundColor: "rgba(30,43,250,0.04)", borderColor: "rgba(30,43,250,0.2)", duration: 0.7, ease: "power2.inOut" },
        4.2);
      tl.fromTo("#f07-card", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 2.95);

      // ---- Scene 4 (4.2-7.0): top three slide right inside the morphing card (card-morph-anchor) ----
      var MORPH = 0.7, M0 = 4.2;
      rows.forEach(function (r, i) {
        var k = rank[i];
        if (k >= 3) return;
        var xf = CARD_L + PAD / S0 - ROW_L;
        var yf = CARD_T + (PAD + k * PITCH) / S0 - (ROW_T0 + i * PITCH);
        tl.fromTo(r, { x: 0, y: sortedY(i), scale: 1 }, { x: xf, y: yf, scale: 1 / S0, duration: MORPH, ease: "power2.inOut", immediateRender: false }, M0);
        tl.fromTo(r, { opacity: 1 }, { opacity: 0, duration: MORPH * 0.45, ease: "power1.in", immediateRender: false }, M0);
      });
      tl.fromTo(all(".f07-ghost"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 4.4);
      tl.fromTo("#f07-card .f07-new", { opacity: 0 }, { opacity: 1, duration: MORPH * 0.4, ease: "power1.out" }, M0 + MORPH * 0.6);
      tl.fromTo(all("#f07-card .f07-aph"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, 4.6);
      tl.fromTo(all("#f07-card .f07-sk"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.1 }, 4.78);
      tl.fromTo("#f07-cite", { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 4.8);
      tl.fromTo("#f07-llm", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.3);
      // hold still from 5.8s to the end of the 7s slot
      tl.set({}, {}, 7.0);

      window.__timelines = window.__timelines || {};
