  <style>
    #root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:"Chulabhorn Likit Text","IBM Plex Sans Thai";}
    #f05-bg{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#fdfae7;}
    #f05-h2 .f05-ph{display:inline-block;}

    /* the world: everything on the station strip (the subtle camera lock lives here) */
    #f05-world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%;}

    /* connector line: base + progress fill per segment */
    .f05-seg{position:absolute;top:499px;height:2px;border-radius:1px;background:rgba(30,43,250,0.2);overflow:hidden;}
    .f05-seg-fill{position:absolute;left:0;top:0;width:100%;height:100%;background:#1e2bfa;transform-origin:0 50%;}

    /* station highlight = the "camera": exactly the card's box, so a lit station shows one border */
    #f05-focus{position:absolute;left:-131px;top:425px;width:262px;height:150px;box-sizing:border-box;border-radius:14px;background:rgba(30,43,250,0.06);border:2px solid rgba(30,43,250,0.5);}

    /* six stations (card-tinted), 262 x 150 */
    .f05-card{position:absolute;top:425px;width:262px;height:150px;box-sizing:border-box;border-radius:14px;background:rgba(30,43,250,0.04);border:1.5px solid rgba(30,43,250,0.2);}

    /* per-station check (shared SVG icon), inset 12px inside the card's top-right corner */
    .f05-ok{position:absolute;top:437px;width:28px;height:28px;border-radius:50%;background:rgba(5,150,105,0.14);color:#059669;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%;}

    /* Clean station micro readout (discrete-text-sequence); bottom 17px above the card edge */
    #f05-micro{position:absolute;left:708.2px;top:520px;width:212px;height:38px;box-sizing:border-box;padding:0 14px;border-radius:100px;background:rgba(30,43,250,0.08);display:flex;align-items:center;font-family:"IBM Plex Mono","Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:500;font-size:28px;line-height:1.45;white-space:nowrap;}

    /* the index, inside the Index card: four rows = 8px square marker + bar */
    .f05-row-track{position:absolute;height:8px;border-radius:4px;background:rgba(30,43,250,0.08);}
    .f05-row-fill{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:4px;background:#8b8fe8;transform-origin:0 50%;}

    .f05-mk-on{position:absolute;width:8px;height:8px;border-radius:1.5px;background:#1e2bfa;}

    /* token + station imprints: positioned around a 0x0 anchor at the station centre */

    .f05-form{position:absolute;left:0;top:0;width:0;height:0;transform:scale(1.2);transform-origin:0 0;}

    .f05-band{position:absolute;left:0;top:0;width:100%;height:5px;background:#111111;}

    .f05-fname-fill{position:absolute;left:0;top:0;width:100%;height:100%;background:#1e2bfa;transform-origin:0 50%;}

    .f05-cl{position:absolute;left:6px;height:4px;border-radius:2px;background:rgba(17,17,17,0.2);}
    /* Embed: the back of a chunk card = a short column of illustrative vector digits (texture, not data) */
    .f05-vec{position:absolute;top:-24px;width:36px;height:48px;box-sizing:border-box;border-radius:7px;border:1.5px solid rgba(30,43,250,0.35);background:#fdfae7;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:"IBM Plex Mono","Chulabhorn Likit Text","IBM Plex Sans Thai";font-weight:400;font-size:9px;line-height:12px;color:#6b6b6b;transform-origin:50% 50%;}

  </style>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var world = $("f05-world");
      var token = $("f05-token");
      var focus = $("f05-focus");
      var ghostsHost = $("f05-ghosts");
      var segsHost = $("f05-segs");
      var indexHost = $("f05-index");
      var oksHost = $("f05-oks");
      var microTxt = $("f05-micro-txt");

      // ---- layout constants (world px) ----
      // strip x 108..1808 so that, with the camera lean (max 15px), it always stays inside x 96..1824
      var CY = 500;
      var S = 1.2; // form scale inside token + imprints (.f05-form)
      var W = 262, CARD_T = 425;
      var CARD_L = [108, 395.6, 683.2, 970.8, 1258.4, 1546]; // gutters 25.6px
      var CX = CARD_L.map(function (l) { return l + W / 2; });
      var CUE = [1.0, 1.8, 2.6, 3.6, 4.4, 5.2];
      // camera: arrive at / leave each station (Embed keeps the token until 4.94 for its flip beat)
      var ARR = [1.02, 1.82, 2.62, 3.62, 4.42, 5.24];
      var DEP = [0.3, 1.32, 2.12, 3.12, 3.92, 4.94];
      var CLEAN_UP = -6; // form-local lift of the cleaned lines (keeps them clear of the micro chip)

      // token-local geometry (origin = station centre). [left, top, w, h]
      var BARS = [[-26, -38, 36, 6], [-26, -22, 52, 5], [-26, -6, 46, 5], [-26, 10, 52, 5]];
      var PARSED = [[-36, -40, 44, 9], [-36, -16, 72, 5], [-36, -4, 64, 5], [-36, 8, 72, 5]];
      var JIT = [0, 9, -7, 5];
      var CHX = [-66, -22, 22, 66];
      // illustrative vector values shown on the back of each chunk card (fixed, texture only)
      var VEC = [["0.12", "-0.48", "0.91"], ["-0.33", "0.07", "0.64"], ["0.85", "-0.21", "0.39"], ["-0.76", "0.58", "-0.04"]];

      // index rows inside the Index card (card-relative): marker at x 20, bar from x 36 to END
      var ROW_CY = [34, 62, 90, 118];
      var ROW_END = [186, 238, 212, 226]; // row 0 stops short of the check in the top-right corner

      // fixed seeded noise (deterministic function of index)
      function rnd(i) { var s = Math.sin(i * 91.7 + 3.1) * 43758.5453; return s - Math.floor(s); }
      var SPECK = [0, 1, 2, 3].map(function (i) {
        return [(i % 2 === 0 ? -58 : 50) + rnd(i) * 8, -38 + i * 14 + rnd(i + 7) * 6];
      });
      function chunkBar(k) { return [CHX[k] - 10, -14, 20, k === 0 ? 6 : 4]; }
      function stroke(r, dy) { return [r[0], r[1] + r[3] / 2 - 1.25 + dy, r[2], 2.5]; } // 3px line at the bar's centre

      function mk(parent, cls, css, html) {
        var d = document.createElement("div");
        if (cls) d.className = cls;
        if (css) for (var p in css) d.style[p] = css[p];
        if (html) d.innerHTML = html;
        parent.appendChild(d);
        return d;
      }
      function box(r) { return { left: r[0] + "px", top: r[1] + "px", width: r[2] + "px", height: r[3] + "px" }; }
      var CHECK_SVG = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function addChunkCard(parent, k) {
        var c = mk(parent, "f05-chunk", { left: (CHX[k] - 18) + "px" });
        mk(c, "f05-cl", { top: "18px", width: "20px" });
        mk(c, "f05-cl", { top: "26px", width: "14px" });
        return c;
      }

      // ---- connector line segments ----
      var segFills = [];
      var leadIn = mk(segsHost, "f05-seg", { left: "-40px", width: (CARD_L[0] + 40) + "px" });
      segFills.push(mk(leadIn, "f05-seg-fill"));
      for (var s = 0; s < 5; s++) {
        var sg = mk(segsHost, "f05-seg", { left: (CARD_L[s] + W) + "px", width: (CARD_L[s + 1] - CARD_L[s] - W) + "px" });
        segFills.push(mk(sg, "f05-seg-fill"));
      }

      // ---- per-station checks (inset 12px from each card's top-right corner) ----
      var oks = CARD_L.map(function (l) { return mk(oksHost, "f05-ok", { left: (l + W - 12 - 28) + "px" }, CHECK_SVG); });

      // ---- the index, inside the Index card ----
      var L5 = CARD_L[5];
      var rows = ROW_CY.map(function (cy, i) {
        var y = CARD_T + cy;
        var track = mk(indexHost, "f05-row-track", { left: (L5 + 36) + "px", top: (y - 4) + "px", width: (ROW_END[i] - 36) + "px" });
        var fill = mk(track, "f05-row-fill");
        var mkOff = mk(indexHost, "f05-mk", { left: (L5 + 20) + "px", top: (y - 4) + "px" });
        var mkOn = mk(indexHost, "f05-mk-on", { left: (L5 + 20) + "px", top: (y - 4) + "px" });
        return { track: track, fill: fill, off: mkOff, on: mkOn, x: L5 + 24, y: y };
      });

      // ---- station imprints (what each station left behind) ----
      var ghosts = [];
      var gforms = [];
      for (var g = 0; g < 5; g++) { ghosts.push(mk(ghostsHost, "f05-ghost", { left: CX[g] + "px" })); gforms.push(mk(ghosts[g], "f05-form")); }
      (function (G) { // Ingest: the read file
        var t = mk(G, "f05-tile"); mk(t, "f05-band");
        BARS.forEach(function (b) { mk(G, "f05-bar", box(b)); });
        var f = mk(G, "f05-fname"); mk(f, "f05-fname-fill");
      })(gforms[0]);
      (function (G) { // Parse: heading/paragraph lines, ragged, with noise (accent-mid 3px strokes)
        PARSED.forEach(function (b, k) { mk(G, "f05-stroke", box(stroke([b[0] + JIT[k], b[1], b[2], b[3]], 0))); });
        SPECK.forEach(function (p) { mk(G, "f05-speck", { left: p[0] + "px", top: p[1] + "px" }); });
      })(gforms[1]);
      (function (G) { // Clean: aligned, no noise (accent-mid 3px strokes)
        PARSED.forEach(function (b) { mk(G, "f05-stroke", box(stroke(b, CLEAN_UP))); });
      })(gforms[2]);
      (function (G) { // Chunk: four small cards
        for (var k = 0; k < 4; k++) addChunkCard(G, k);
        for (var j = 0; j < 4; j++) mk(G, "f05-bar" + (j === 0 ? " is-head" : ""), box(chunkBar(j)));
      })(gforms[3]);
      (function (G) { // Embed: four dots
        for (var k = 0; k < 4; k++) mk(G, "f05-dot", { left: (CHX[k] - 10) + "px" });
      })(gforms[4]);

      // ---- the travelling token ----
      var tf = mk(token, "f05-form");
      var tile = mk(tf, "f05-tile"); mk(tile, "f05-band");
      var fname = mk(tf, "f05-fname"); var fnameFill = mk(fname, "f05-fname-fill");
      var chunks = []; for (var c = 0; c < 4; c++) chunks.push(addChunkCard(tf, c));
      var bars = BARS.map(function (b) { return mk(tf, "f05-bar", box(b)); });
      var headHL = mk(bars[0], "f05-bar-hl");
      var specks = SPECK.map(function (p) { return mk(tf, "f05-speck", { left: p[0] + "px", top: p[1] + "px" }); });
      var vecs = CHX.map(function (x, k) {
        return mk(tf, "f05-vec", { left: (x - 18) + "px" }, VEC[k].map(function (v) { return "<span>" + v + "</span>"; }).join(""));
      });
      var dots = CHX.map(function (x) { return mk(tf, "f05-dot", { left: (x - 10) + "px" }); });

      // bar transform that maps base box -> target box (transform-origin: left centre)
      function toBox(k, r) {
        var b = BARS[k];
        return { x: r[0] - b[0], y: (r[1] + r[3] / 2) - (b[1] + b[3] / 2), scaleX: r[2] / b[2], scaleY: r[3] / b[3] };
      }

      // ---- camera: one driver, one writer (viewport-change lock) ----
      var e3o = gsap.parseEase("power3.out");
      var e3io = gsap.parseEase("power3.inOut");
      function camX(t) {
        if (t <= DEP[0]) return -60;
        if (t < ARR[0]) return -60 + (CX[0] + 60) * e3o((t - DEP[0]) / (ARR[0] - DEP[0]));
        var x = CX[0];
        for (var k = 1; k < 6; k++) {
          var a = DEP[k], b = ARR[k];
          if (t <= a) return x;
          if (t < b) return x + (CX[k] - x) * e3io((t - a) / (b - a));
          x = CX[k];
        }
        return x;
      }
      var MICRO = [
        { t: 0, html: "" },
        { t: 2.9, html: '<span class="f05-m-old">๒๕๖๙</span>' },
        { t: 3.06, html: '<span class="f05-m-old">๒๕๖๙</span> <span class="f05-m-arr">→</span>' },
        { t: 3.22, html: '<span class="f05-m-old is-done">๒๕๖๙</span> <span class="f05-m-arr">→</span> <span class="f05-m-new">2569</span>' }
      ];
      var microIdx = -1;
      function render(t) {
        var tx = camX(t);
        token.style.transform = "translate(" + tx + "px, 0px)";
        focus.style.transform = "translate(" + tx + "px, 0px)";
        var wx = (960 - tx) * 0.015; // camera leans with the token (focus-lock, damped)
        world.style.transform = "translate(" + wx + "px, 0px)";
        var i = MICRO.length - 1;
        while (i > 0 && t < MICRO[i].t) i--;
        if (i !== microIdx) { microTxt.innerHTML = MICRO[i].html; microIdx = i; }
      }
      render(0);

      var tl = gsap.timeline({ paused: true });
      var drv = { t: 0 };
      tl.to(drv, { t: 9, duration: 9, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

      // ---- Scene 1 (0.0–1.0): headline per phrase; dim strip + line ----
      tl.fromTo("#f05-h2 .f05-ph", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.16 }, 0.3);
      tl.fromTo(".f05-card", { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: "power2.out", stagger: 0.05 }, 0.05);
      tl.fromTo(".f05-seg", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.04 }, 0.05);
      // lead-in line fills as the token slides in from the left
      tl.fromTo(segFills[0], { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "none" }, 0.32);
      tl.fromTo(focus, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.8);

      // ---- Scene 2 (1.0–6.0): one station per cue; lit stations stay lit; each gets its check ----
      function lightStation(k) {
        tl.to("#f05-card-" + k, { opacity: 1, duration: 0.3, ease: "power2.out" }, CUE[k] - 0.12);
        tl.fromTo("#f05-lab-" + k + " .f05-lab-th", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUE[k]);
