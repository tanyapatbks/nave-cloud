  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var token = $("f05-token");
      var focus = $("f05-focus");
      var ghostsHost = $("f05-ghosts");
      var flyersHost = $("f05-flyers");
      var segsHost = $("f05-segs");
      var indexHost = $("f05-index");
      var oksHost = $("f05-oks");
      var microTxt = $("f05-micro-txt");

      // ---- layout constants (world px; world y + 110 = frame y) ----
      // strip x 96..1823 (the term chip's right edge): six 262px cards, five 31px gaps; the world never leans,
      // so the strip always stays inside x 96..1824
      var CY = 488; // card middle (frame y 598); cards 220px tall: world 378..598
      var S = 1.8; // form scale inside token + imprints (.f05-form): 1.5x the draft-2 glyphs
      var W = 262, CARD_H = 220, CARD_T = CY - CARD_H / 2;
      var OK_D = 34; // check badge diameter
      var CARD_L = [96, 389, 682, 975, 1268, 1561]; // gaps 31px; Index card right edge = 1823
      var CX = CARD_L.map(function (l) { return l + W / 2; });
      var CUE = [1.0, 1.8, 2.6, 3.6, 4.4, 5.6];
      // camera: arrive at / leave each station. The chunk cards stay at Chunk when the camera moves on (3.92); at Embed
      // (4.4-5.2) copies of them shrink into dots and fly into the Embed box; the token picks the dots up there for 5.3
      var ARR = [1.02, 1.82, 2.62, 3.62, 4.42, 5.6];
      var DEP = [0.3, 1.32, 2.12, 3.12, 3.92, 5.3];
      var START_X = -150; // token waits fully off-frame (left) before sliding into Ingest
      var CLEAN_UP = -6; // form-local lift of the cleaned lines (keeps them clear of the micro chip)

      // token-local geometry (form units, origin = station centre). [left, top, w, h]
      var BARS = [[-26, -38, 36, 6], [-26, -22, 52, 5], [-26, -6, 46, 5], [-26, 10, 52, 5]];
      var PARSED = [[-36, -40, 44, 9], [-36, -16, 72, 5], [-36, -4, 64, 5], [-36, 8, 72, 5]];
      var JIT = [0, 9, -7, 5];
      var CHX = [-48, -16, 16, 48]; // four chunk cards, 26 wide: at 1.8x they span ±110px inside the 262px card

      // Embed scatter (unscaled px, origin = card centre), no axes: three tinted clusters of 7 points
      // (centres >= 17px apart) spanning ~172x128: A = grey (lower left), B = accent-mid (top), C = cobalt (right).
      // TOK = where the example's 4 chunks land as 10px dots: chunks 0,1 (left cards) -> grey cluster A,
      // chunks 2,3 -> cobalt cluster C (left-to-right order kept, so the flight paths never cross).
      // PT_A / PT_B / C_REST = the 17 other 12px points. Top-right stays clear of the check badge.
      var PT = 12, DOT = 10;
      var PT_A = [[-46, 18], [-64, 12], [-81, 21], [-38, 44], [-66, 54]];
      var PT_B = [[6, -54], [12, -36], [3, -19], [-10, -45], [-14, -27], [-20, -62], [-30, -34]];
      var C_REST = [[44, 2], [79, 5], [36, 28], [62, -4], [64, 38]];
      var TOK = [[-73, 38], [-55, 34], [53, 18], [71, 22]];
      var FLY_T = [4.55, 4.5, 4.45, 4.4]; // flight start per chunk: the card nearest Embed (3) leaves first; all land by 5.2
      var PARK = [[-2, -4], [-11, 18], [7, 22], [0, 38]]; // where the dots ride to in the Index card (5.3-5.6), clear of the row badges

      // index rows inside the Index card (card-relative px): 12px marker at x 24..36, bar from x 48 to END
      var ROW_CY = [54, 92, 130, 168];
      var ROW_END = [200, 232, 214, 226]; // right end of each row (bar + badge); row 0 stops short of the check badge
      var MK_X = 24, MK = 12, ROW_X = 48;
      var BDG_W = 36, BDG_GAP = 8; // each row ends in the 36px label badge; its bar is 44px shorter

      // fixed seeded noise (deterministic function of index)
      function rnd(i) { var s = Math.sin(i * 91.7 + 3.1) * 43758.5453; return s - Math.floor(s); }
      // Parse markers: one 5-unit (9px) square per tagged line (heading + third line), its right edge
      // 8 frame px left of that line's ragged start, vertically centred on the line. No right-side squares.
      var MARK_SZ = 5, MARK_GAP = 8 / S;
      var MARK = [0, 2].map(function (k) {
        var r = PARSED[k];
        return [r[0] + JIT[k] - MARK_GAP - MARK_SZ, r[1] + r[3] / 2 - MARK_SZ / 2];
      });
      // Embed drift: each non-token point starts at a seeded spot inside the box and drifts into its cluster
      var CLOUD = PT_A.map(function (p) { return { p: p, cls: "is-a" }; })
        .concat(PT_B.map(function (p) { return { p: p, cls: "is-b" }; }))
        .concat(C_REST.map(function (p) { return { p: p, cls: "" }; }));
      CLOUD.forEach(function (c, j) {
        c.sx = -84 + rnd(j * 3 + 11) * 168; // start (card-centre px)
        c.sy = -58 + rnd(j * 3 + 12) * 116;
        c.d = rnd(j * 3 + 13) * 0.08;       // start delay, so the 0.72s drifts all settle by 5.2
      });
      function chunkBar(k) { return [CHX[k] - 9, -14, 18, k === 0 ? 6 : 4]; }
      function stroke(r, dy) { return [r[0], r[1] + r[3] / 2 - 1.25 + dy, r[2], 2.5]; } // line at the bar's centre

      function mk(parent, cls, css, html) {
        var d = document.createElement("div");
        if (cls) d.className = cls;
        if (css) for (var p in css) d.style[p] = css[p];
        if (html) d.innerHTML = html;
        parent.appendChild(d);
        return d;
      }
      function box(r) { return { left: r[0] + "px", top: r[1] + "px", width: r[2] + "px", height: r[3] + "px" }; }
      function pt(parent, p, cls) { return mk(parent, "f05-pt" + (cls ? " " + cls : ""), { left: (p[0] - PT / 2) + "px", top: (p[1] - PT / 2) + "px" }); }
      var CHECK_SVG = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      var BADGE_HTML = '<div class="f05-badge"><span></span><span></span><span></span><span></span></div>';
      function addBadge(parent, css) { return mk(parent, "f05-bdg", css, BADGE_HTML); }

      function addChunkCard(parent, k, cx) { // cx = card centre x in form units (default: its slot in the station)
        var c = mk(parent, "f05-chunk", { left: ((cx === undefined ? CHX[k] : cx) - 13) + "px" });
        mk(c, "f05-cl", { top: "18px", width: "15px" });
        mk(c, "f05-cl", { top: "26px", width: "10px" });
        // the label badge at the tile's bottom, centred in the free band under the text lines (form units)
        c.bdg = addBadge(c, { left: "11.5px", top: "37.5px" });
        return c;
      }

      // ---- connector line segments: card to card only (segFills[k] = gap between station k and k+1) ----
      var segFills = [];
      for (var s = 0; s < 5; s++) {
        var sg = mk(segsHost, "f05-seg", { left: (CARD_L[s] + W) + "px", width: (CARD_L[s + 1] - CARD_L[s] - W) + "px" });
        segFills.push(mk(sg, "f05-seg-fill"));
      }

      // ---- per-station checks (inset 12px from each card's top-right corner) ----
      var oks = CARD_L.map(function (l) { return mk(oksHost, "f05-ok", { left: (l + W - 12 - OK_D) + "px" }, CHECK_SVG); });

      // ---- the index, inside the Index card ----
      var L5 = CARD_L[5];
      var rows = ROW_CY.map(function (cy, i) {
        var y = CARD_T + cy;
        var track = mk(indexHost, "f05-row-track", { left: (L5 + ROW_X) + "px", top: (y - 5) + "px", width: (ROW_END[i] - BDG_W - BDG_GAP - ROW_X) + "px" });
        var fill = mk(track, "f05-row-fill");
        var mkOff = mk(indexHost, "f05-mk", { left: (L5 + MK_X) + "px", top: (y - MK / 2) + "px" });
        var mkOn = mk(indexHost, "f05-mk-on", { left: (L5 + MK_X) + "px", top: (y - MK / 2) + "px" });
        var bdg = addBadge(indexHost, { left: (L5 + ROW_END[i] - BDG_W / 2) + "px", top: y + "px" });
        return { track: track, fill: fill, off: mkOff, on: mkOn, bdg: bdg, x: L5 + MK_X + MK / 2, y: y };
      });

      // ---- station imprints (what each station left behind) ----
      var ghosts = [];
      var gforms = [];
      for (var g = 0; g < 5; g++) { ghosts.push(mk(ghostsHost, "f05-ghost", { left: CX[g] + "px" })); gforms.push(mk(ghosts[g], "f05-form")); }
      (function (G) { // Ingest: the read file
        var t = mk(G, "f05-tile"); mk(t, "f05-band");
        BARS.forEach(function (b) { mk(G, "f05-bar", box(b)); });
        var f = mk(G, "f05-fname"); mk(f, "f05-fname-fill");
      })(gforms[0]);
      (function (G) { // Parse: heading/paragraph lines, ragged, with line markers at their starts (accent-mid strokes)
        PARSED.forEach(function (b, k) { mk(G, "f05-stroke", box(stroke([b[0] + JIT[k], b[1], b[2], b[3]], 0))); });
        MARK.forEach(function (p) { mk(G, "f05-mark", { left: p[0] + "px", top: p[1] + "px" }); });
      })(gforms[1]);
      (function (G) { // Clean: aligned, no noise (accent-mid strokes)
        PARSED.forEach(function (b) { mk(G, "f05-stroke", box(stroke(b, CLEAN_UP))); });
      })(gforms[2]);
      // Chunk: no imprint needed: the token's own four cards stay in the station when the camera moves on (render)

      var G4 = ghosts[4];
