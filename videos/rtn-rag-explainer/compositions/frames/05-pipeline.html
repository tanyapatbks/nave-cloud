  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var world = $("f05-world");
      var token = $("f05-token");
      var focus = $("f05-focus");
      var ghostsHost = $("f05-ghosts");
      var segsHost = $("f05-segs");
      var indexHost = $("f05-index");
      var oksHost = $("f05-oks");
      var microTxt = $("f05-micro-txt");

      // ---- layout constants (world px; world y + 110 = frame y) ----
      // strip x 108..1808 so that, with the camera lean (max 15px), it always stays inside x 96..1824
      var CY = 488; // card middle (frame y 598); cards 220px tall: world 378..598
      var S = 1.8; // form scale inside token + imprints (.f05-form): 1.5x the draft-2 glyphs
      var W = 262, CARD_H = 220, CARD_T = CY - CARD_H / 2;
      var OK_D = 34; // check badge diameter
      var CARD_L = [108, 395.6, 683.2, 970.8, 1258.4, 1546]; // gutters 25.6px
      var CX = CARD_L.map(function (l) { return l + W / 2; });
      var CUE = [1.0, 1.8, 2.6, 3.6, 4.4, 5.2];
      // camera: arrive at / leave each station (Embed keeps the token until 4.98 for its flip + scatter beat)
      var ARR = [1.02, 1.82, 2.62, 3.62, 4.42, 5.26];
      var DEP = [0.3, 1.32, 2.12, 3.12, 3.92, 4.98];
      var CLEAN_UP = -6; // form-local lift of the cleaned lines (keeps them clear of the micro chip)

      // token-local geometry (form units, origin = station centre). [left, top, w, h]
      var BARS = [[-26, -38, 36, 6], [-26, -22, 52, 5], [-26, -6, 46, 5], [-26, 10, 52, 5]];
      var PARSED = [[-36, -40, 44, 9], [-36, -16, 72, 5], [-36, -4, 64, 5], [-36, 8, 72, 5]];
      var JIT = [0, 9, -7, 5];
      var CHX = [-48, -16, 16, 48]; // four chunk cards, 26 wide: at 1.8x they span ±110px inside the 262px card
      // illustrative vector values shown on the back of each chunk card (fixed, texture only)
      var VEC = [["0.1", "-0.5", "0.9"], ["-0.3", "0.1", "0.6"], ["0.8", "-0.2", "0.4"], ["-0.7", "0.6", "-0.1"]];

      // Embed scatter (unscaled px, origin = card centre): faint L of axes 120x80 centred in the card,
      // cluster A = 3 other points, cluster B = the example's 4 chunks (sorted top to bottom = index row order)
      var AX_W = 120, AX_H = 80;
      var PT_A = [[-38, 20], [-26, 28], [-22, 12]];
      var PT_B = [[28, -26], [14, -18], [40, -14], [24, -8]];

      // index rows inside the Index card (card-relative px): 12px marker at x 24..36, bar from x 48 to END
      var ROW_CY = [54, 92, 130, 168];
      var ROW_END = [224, 200, 236, 212];
      var MK_X = 24, MK = 12, ROW_X = 48;

      // fixed seeded noise (deterministic function of index)
      function rnd(i) { var s = Math.sin(i * 91.7 + 3.1) * 43758.5453; return s - Math.floor(s); }
      var SPECK = [0, 1, 2, 3].map(function (i) {
        return [(i % 2 === 0 ? -58 : 50) + rnd(i) * 8, -38 + i * 14 + rnd(i + 7) * 6];
      });
      function chunkBar(k) { return [CHX[k] - 9, -14, 18, k === 0 ? 6 : 4]; }
      function stroke(r, dy) { return [r[0], r[1] + r[3] / 2 - 1.25 + dy, r[2], 2.5]; } // line at the bar's centre

      function mk(parent, cls, css, html) {
        var d = document.createElement("div");
        if (cls) d.className = cls;
        if (css) for (var p in css) d.style[p] = css[p];
        if (html) d.innerHTML = html;
        parent.appendChild(d);
        return d;
      }
      function box(r) { return { left: r[0] + "px", top: r[1] + "px", width: r[2] + "px", height: r[3] + "px" }; }
      function pt(parent, p, cls) { return mk(parent, "f05-pt" + (cls ? " " + cls : ""), { left: (p[0] - 5) + "px", top: (p[1] - 5) + "px" }); }
      var CHECK_SVG = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function addChunkCard(parent, k) {
        var c = mk(parent, "f05-chunk", { left: (CHX[k] - 13) + "px" });
        mk(c, "f05-cl", { top: "18px", width: "15px" });
        mk(c, "f05-cl", { top: "26px", width: "10px" });
        return c;
      }

      // ---- connector line segments ----
      var segFills = [];
      var leadIn = mk(segsHost, "f05-seg", { left: "-40px", width: (CARD_L[0] + 40) + "px" });
      segFills.push(mk(leadIn, "f05-seg-fill"));
      for (var s = 0; s < 5; s++) {
        var sg = mk(segsHost, "f05-seg", { left: (CARD_L[s] + W) + "px", width: (CARD_L[s + 1] - CARD_L[s] - W) + "px" });
        segFills.push(mk(sg, "f05-seg-fill"));
      }

      // ---- per-station checks (inset 12px from each card's top-right corner) ----
      var oks = CARD_L.map(function (l) { return mk(oksHost, "f05-ok", { left: (l + W - 12 - OK_D) + "px" }, CHECK_SVG); });

      // ---- the index, inside the Index card ----
      var L5 = CARD_L[5];
      var rows = ROW_CY.map(function (cy, i) {
        var y = CARD_T + cy;
        var track = mk(indexHost, "f05-row-track", { left: (L5 + ROW_X) + "px", top: (y - 5) + "px", width: (ROW_END[i] - ROW_X) + "px" });
        var fill = mk(track, "f05-row-fill");
        var mkOff = mk(indexHost, "f05-mk", { left: (L5 + MK_X) + "px", top: (y - MK / 2) + "px" });
        var mkOn = mk(indexHost, "f05-mk-on", { left: (L5 + MK_X) + "px", top: (y - MK / 2) + "px" });
        return { track: track, fill: fill, off: mkOff, on: mkOn, x: L5 + MK_X + MK / 2, y: y };
      });

      // ---- station imprints (what each station left behind) ----
      var ghosts = [];
      var gforms = [];
      for (var g = 0; g < 5; g++) { ghosts.push(mk(ghostsHost, "f05-ghost", { left: CX[g] + "px" })); gforms.push(mk(ghosts[g], "f05-form")); }
      (function (G) { // Ingest: the read file
        var t = mk(G, "f05-tile"); mk(t, "f05-band");
        BARS.forEach(function (b) { mk(G, "f05-bar", box(b)); });
        var f = mk(G, "f05-fname"); mk(f, "f05-fname-fill");
      })(gforms[0]);
      (function (G) { // Parse: heading/paragraph lines, ragged, with noise (accent-mid strokes)
        PARSED.forEach(function (b, k) { mk(G, "f05-stroke", box(stroke([b[0] + JIT[k], b[1], b[2], b[3]], 0))); });
        SPECK.forEach(function (p) { mk(G, "f05-speck", { left: p[0] + "px", top: p[1] + "px" }); });
      })(gforms[1]);
      (function (G) { // Clean: aligned, no noise (accent-mid strokes)
        PARSED.forEach(function (b) { mk(G, "f05-stroke", box(stroke(b, CLEAN_UP))); });
      })(gforms[2]);
      (function (G) { // Chunk: four small cards
        for (var k = 0; k < 4; k++) addChunkCard(G, k);
        for (var j = 0; j < 4; j++) mk(G, "f05-bar" + (j === 0 ? " is-head" : ""), box(chunkBar(j)));
      })(gforms[3]);
      // Embed: faint axes + 7-point scatter (unscaled, on the ghost anchor itself, not its scaled form)
      var G4 = ghosts[4];
      var axV = mk(G4, "f05-ax", { left: (-AX_W / 2) + "px", top: (-AX_H / 2) + "px", width: "1px", height: (AX_H + 1) + "px", transformOrigin: "50% 100%" });
      var axH = mk(G4, "f05-ax", { left: (-AX_W / 2) + "px", top: (AX_H / 2) + "px", width: AX_W + "px", height: "1px", transformOrigin: "0 50%" });
      var impA = PT_A.map(function (p) { return pt(G4, p, "is-imp"); });
      var impB = PT_B.map(function (p) { return pt(G4, p, "is-imp"); });

      // ---- the travelling token ----
      var tf = mk(token, "f05-form");
      var tile = mk(tf, "f05-tile"); mk(tile, "f05-band");
      var fname = mk(tf, "f05-fname"); var fnameFill = mk(fname, "f05-fname-fill");
      var chunks = []; for (var c = 0; c < 4; c++) chunks.push(addChunkCard(tf, c));
      var bars = BARS.map(function (b) { return mk(tf, "f05-bar", box(b)); });
      var headHL = mk(bars[0], "f05-bar-hl");
      var specks = SPECK.map(function (p) { return mk(tf, "f05-speck", { left: p[0] + "px", top: p[1] + "px" }); });
      var vecs = CHX.map(function (x, k) {
        return mk(tf, "f05-vec", { left: (x - 13) + "px" }, VEC[k].map(function (v) { return "<span>" + v + "</span>"; }).join(""));
      });
      // the example's four chunk points (cobalt, unscaled px) sit at the cluster-B positions of the scatter
      var dots = PT_B.map(function (p) { return pt(token, p); });

      // bar transform that maps base box -> target box (transform-origin: left centre)
      function toBox(k, r) {
        var b = BARS[k];
        return { x: r[0] - b[0], y: (r[1] + r[3] / 2) - (b[1] + b[3] / 2), scaleX: r[2] / b[2], scaleY: r[3] / b[3] };
      }

      // ---- camera: one driver, one writer (viewport-change lock) ----
      var e3o = gsap.parseEase("power3.out");
      var e3io = gsap.parseEase("power3.inOut");
      function camX(t) {
        if (t <= DEP[0]) return -60;
        if (t < ARR[0]) return -60 + (CX[0] + 60) * e3o((t - DEP[0]) / (ARR[0] - DEP[0]));
        var x = CX[0];
        for (var k = 1; k < 6; k++) {
          var a = DEP[k], b = ARR[k];
          if (t <= a) return x;
          if (t < b) return x + (CX[k] - x) * e3io((t - a) / (b - a));
          x = CX[k];
        }
        return x;
      }
      var MICRO = [
        { t: 0, html: "" },
        { t: 2.9, html: '<span class="f05-m-old">๒๕๖๙</span>' },
        { t: 3.06, html: '<span class="f05-m-old">๒๕๖๙</span> <span class="f05-m-arr">→</span>' },
        { t: 3.22, html: '<span class="f05-m-old is-done">๒๕๖๙</span> <span class="f05-m-arr">→</span> <span class="f05-m-new">2569</span>' }
      ];
      var microIdx = -1;
      function render(t) {
        var tx = camX(t);
        token.style.transform = "translate(" + tx + "px, 0px)";
        focus.style.transform = "translate(" + tx + "px, 0px)";
        var wx = (960 - tx) * 0.015; // camera leans with the token (focus-lock, damped)
        world.style.transform = "translate(" + wx + "px, 0px)";
        var i = MICRO.length - 1;
        while (i > 0 && t < MICRO[i].t) i--;
        if (i !== microIdx) { microTxt.innerHTML = MICRO[i].html; microIdx = i; }
      }
      render(0);

      var tl = gsap.timeline({ paused: true });
      var drv = { t: 0 };
      tl.to(drv, { t: 9, duration: 9, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

      // ---- Scene 1 (0.0–1.0): headline per phrase; dim strip + line ----
      tl.fromTo("#f05-h2 .f05-ph", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.16 }, 0.3);
      tl.fromTo(".f05-card", { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: "power2.out", stagger: 0.05 }, 0.05);
      tl.fromTo(".f05-seg", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.04 }, 0.05);
      // lead-in line fills as the token slides in from the left
      tl.fromTo(segFills[0], { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "none" }, 0.32);
      tl.fromTo(focus, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.8);

      // ---- Scene 2 (1.0–6.0): one station per cue; lit stations stay lit; each gets its check ----
      function lightStation(k) {
        tl.to("#f05-card-" + k, { opacity: 1, duration: 0.3, ease: "power2.out" }, CUE[k] - 0.12);
        tl.fromTo("#f05-lab-" + k + " .f05-lab-th", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUE[k]);
        tl.fromTo("#f05-lab-" + k + " .f05-lab-en", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE[k] + 0.08);
        tl.fromTo(oks[k], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, CUE[k] + 0.25);
      }
      function depart(k) { // token leaves station k toward k+1: line fills, station keeps an imprint
        var dep = DEP[k + 1];
        tl.fromTo(segFills[k + 1], { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "none" }, dep + 0.12);
        if (k === 4) { // Embed: the example's four points stay behind in the scatter as the token leaves
          tl.fromTo(impB, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.03 }, dep + 0.14);
          return;
        }
        tl.fromTo(ghosts[k], { opacity: 0 }, { opacity: (k === 1 || k === 2) ? 1 : 0.38, duration: 0.35, ease: "power2.out" }, dep + 0.28);
      }
      for (var k = 0; k < 6; k++) lightStation(k);
      for (var d = 0; d < 5; d++) depart(d);

      // Ingest (1.0): the filename is read
      tl.fromTo(fnameFill, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.inOut" }, 1.02);

      // Parse (1.8): the file opens into heading / paragraph bars (ragged, with noise)
      tl.to(tile, { opacity: 0, scale: 1.1, duration: 0.3, ease: "power2.out" }, 1.8);
      tl.to(fname, { opacity: 0, duration: 0.2, ease: "power2.out" }, 1.8);
      bars.forEach(function (el, i) {
        var r = PARSED[i];
        tl.to(el, Object.assign(toBox(i, [r[0] + JIT[i], r[1], r[2], r[3]]), { duration: 0.42, ease: "power3.out" }), 1.82 + i * 0.035);
      });
      tl.fromTo(headHL, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.86);
      tl.fromTo(specks, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", stagger: 0.04 }, 1.98);

      // Clean (2.6): noise removed, lines aligned (and lifted clear of the chip); micro readout swaps in place (2.9)
      tl.to(specks, { opacity: 0, scale: 0, duration: 0.22, ease: "power2.in", stagger: 0.04 }, 2.62);
      bars.forEach(function (el, i) {
        tl.to(el, { x: PARSED[i][0] - BARS[i][0], y: toBox(i, PARSED[i]).y + CLEAN_UP, duration: 0.32, ease: "power3.inOut" }, 2.66 + i * 0.03);
      });
      tl.fromTo("#f05-micro", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 2.88);

      // Chunk (3.6): four small cards split out, each takes one bar
      tl.fromTo(chunks,
        { opacity: 0, scale: 0.6, x: function (i) { return -CHX[i] * 0.7; } },
        { opacity: 1, scale: 1, x: 0, duration: 0.42, ease: "power3.inOut", stagger: 0.04 }, 3.62);
      bars.forEach(function (el, i) {
        tl.to(el, Object.assign(toBox(i, chunkBar(i)), { duration: 0.42, ease: "power3.inOut" }), 3.62 + i * 0.04);
      });

      // Embed (4.4–4.98): each card flips to a column of vector digits, which condenses into one point;
      // the faint axes draw in and the four points settle as a cluster beside three other points (meaning as position)
      tl.to(bars, { opacity: 0, duration: 0.08, ease: "power2.in" }, 4.42);
      tl.to(chunks, { scaleX: 0, duration: 0.1, ease: "power2.in", stagger: 0.02 }, 4.42);
      tl.fromTo(vecs, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.1, ease: "power2.out", stagger: 0.02 }, 4.5);
      tl.fromTo(axV, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, 4.56);
      tl.fromTo(axH, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 4.6);
      tl.to(vecs, { opacity: 0, scaleX: 0.5, scaleY: 0.1, duration: 0.14, ease: "power3.in", stagger: 0.02 }, 4.66);
      tl.fromTo(dots,
        { opacity: 0, scale: 0.4, x: function (i) { return CHX[i] * S - PT_B[i][0]; }, y: function (i) { return -PT_B[i][1]; } },
        { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.24, ease: "power3.out", stagger: 0.02 }, 4.7);
      tl.fromTo(impA, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out", stagger: 0.04 }, 4.78);

      // Index (5.2): the four points ride into the Index card with the token (camera move 4.98–5.26)

      // ---- Scene 3 (6.0–9.0): the index inside the Index card; one point settles into each row; hold from 7.0 ----
      tl.fromTo(rows.map(function (r) { return r.track; }), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.04 }, 6.0);
      tl.fromTo(rows.map(function (r) { return r.off; }), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.04 }, 6.0);
      dots.forEach(function (el, i) {
        var r = rows[i];
        var t0 = 6.08 + i * 0.1, land = t0 + 0.36;
        tl.to(el, { x: (r.x - CX[5]) - PT_B[i][0], y: (r.y - CY) - PT_B[i][1], scale: MK / 10, duration: 0.36, ease: "power3.inOut" }, t0);
        tl.to(el, { opacity: 0, duration: 0.08, ease: "power2.out" }, land);
        tl.fromTo(r.on, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, land);
        tl.fromTo(r.fill, { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power3.out" }, land);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["05-pipeline"] = tl;
    })();
  </script>
</template>
