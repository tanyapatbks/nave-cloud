  <style>
    #root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:"IBM Plex Sans Thai";}
    #f05-bg{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#fdfae7;}
    #f05-h2 .f05-ph{display:inline-block;}

    /* the world: everything on the station strip (the subtle camera lock lives here) */
    #f05-world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%;}

    /* connector line: base + progress fill per segment */
    .f05-seg{position:absolute;top:499px;height:2px;border-radius:1px;background:rgba(30,43,250,0.2);overflow:hidden;}
    .f05-seg-fill{position:absolute;left:0;top:0;width:100%;height:100%;background:#1e2bfa;transform-origin:0 50%;}

    /* station highlight = the "camera" */
    #f05-focus{position:absolute;left:-132px;top:413px;width:264px;height:174px;box-sizing:border-box;border-radius:22px;background:rgba(30,43,250,0.08);border:1.5px solid rgba(30,43,250,0.3);}

    /* six stations (card-tinted) */
    .f05-card{position:absolute;top:425px;width:240px;height:150px;box-sizing:border-box;border-radius:14px;background:rgba(30,43,250,0.04);border:1.5px solid rgba(30,43,250,0.2);}

    /* station labels: Thai 600 30px over mono 22px */
    .f05-lab{position:absolute;top:335px;width:340px;text-align:center;}
    .f05-lab-th{display:block;white-space:nowrap;font-family:"IBM Plex Sans Thai";font-weight:600;font-size:30px;line-height:1.45;color:#111111;}
    .f05-lab-en{display:block;white-space:nowrap;font-family:"IBM Plex Mono";font-weight:500;font-size:22px;line-height:1.45;color:#1e2bfa;letter-spacing:0.02em;}

    /* Clean station micro readout (discrete-text-sequence) */
    #f05-micro{position:absolute;left:711.2px;top:528px;width:200px;height:38px;box-sizing:border-box;padding:0 16px;border-radius:100px;background:rgba(30,43,250,0.08);display:flex;align-items:center;font-family:"IBM Plex Mono","IBM Plex Sans Thai";font-weight:500;font-size:24px;line-height:1.45;white-space:nowrap;}
    #f05-micro-txt{display:inline-block;min-width:168px;white-space:nowrap;color:#111111;}
    #f05-micro-txt .f05-m-old{color:#111111;}
    #f05-micro-txt .f05-m-old.is-done{color:#6b6b6b;}
    #f05-micro-txt .f05-m-arr{color:#6b6b6b;}
    #f05-micro-txt .f05-m-new{color:#1e2bfa;}

    /* index stack: four drawers (bar-track + cobalt 40% fill) */
    .f05-drawer{position:absolute;left:1584px;width:240px;height:30px;border-radius:6px;background:rgba(30,43,250,0.08);overflow:hidden;}
    .f05-dfill{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(30,43,250,0.4);transform-origin:0 50%;}
    .f05-dlit{position:absolute;left:0;top:0;width:100%;height:100%;background:#1e2bfa;}

    /* token + station imprints: positioned around a 0x0 anchor at the station centre */
    #f05-token,.f05-ghost{position:absolute;left:0;top:500px;width:0;height:0;}
    .f05-form{position:absolute;left:0;top:0;width:0;height:0;transform:scale(1.2);transform-origin:0 0;}
    .f05-tile{position:absolute;left:-38px;top:-54px;width:76px;height:96px;box-sizing:border-box;border-radius:8px;border:2.5px solid #1e2bfa;background:linear-gradient(rgba(30,43,250,0.04),rgba(30,43,250,0.04)),#fdfae7;overflow:hidden;transform-origin:50% 50%;}
    .f05-band{position:absolute;left:0;top:0;width:100%;height:5px;background:#111111;}
    .f05-fname{position:absolute;left:-38px;top:50px;width:76px;height:7px;border-radius:4px;background:rgba(17,17,17,0.14);overflow:hidden;}
    .f05-fname-fill{position:absolute;left:0;top:0;width:100%;height:100%;background:#1e2bfa;transform-origin:0 50%;}
    .f05-check{position:absolute;left:23px;top:-69px;width:30px;height:30px;border-radius:50%;background:linear-gradient(rgba(5,150,105,0.12),rgba(5,150,105,0.12)),#fdfae7;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%;}
    .f05-check svg{display:block;width:16px;height:16px;}
    .f05-bar{position:absolute;border-radius:3px;background:rgba(17,17,17,0.2);transform-origin:0 50%;}
    .f05-bar.is-head{background:#1e2bfa;}
    .f05-bar-hl{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:3px;background:#1e2bfa;}
    .f05-speck{position:absolute;width:5px;height:5px;border-radius:1.5px;background:#9a9a9a;transform-origin:50% 50%;}
    .f05-chunk{position:absolute;top:-24px;width:36px;height:48px;box-sizing:border-box;border-radius:7px;border:2px solid #1e2bfa;background:linear-gradient(rgba(30,43,250,0.04),rgba(30,43,250,0.04)),#fdfae7;transform-origin:50% 50%;}
    .f05-cl{position:absolute;left:6px;height:4px;border-radius:2px;background:rgba(17,17,17,0.2);}
    .f05-dot{position:absolute;top:-10px;width:20px;height:20px;box-sizing:border-box;border-radius:50%;background:#1e2bfa;border:2px solid #fdfae7;transform-origin:50% 50%;}
  </style>

  <div id="root" data-composition-id="05-pipeline" data-width="1920" data-height="1080" data-start="0" data-duration="9">
    <div id="f05-bg" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>

    <div id="f05-world">
      <div id="f05-segs"></div>

      <div class="f05-card" id="f05-card-0" style="left:96px"></div>

      <div class="f05-card" id="f05-card-2" style="left:691.2px"></div>
      <div class="f05-card" id="f05-card-3" style="left:988.8px"></div>
      <div class="f05-card" id="f05-card-4" style="left:1286.4px"></div>

      <div class="f05-lab" id="f05-lab-2" style="left:641.2px"><span class="f05-lab-th">ทำความสะอาด</span><span class="f05-lab-en">Clean</span></div>

      <div class="f05-lab" id="f05-lab-4" style="left:1236.4px"><span class="f05-lab-th">แปลงเป็นความหมาย</span><span class="f05-lab-en">Embed</span></div>
      <div class="f05-lab" id="f05-lab-5" style="left:1534px"><span class="f05-lab-th">ทำดัชนี</span><span class="f05-lab-en">Index</span></div>

      <div class="f05-drawer" id="f05-drawer-0" style="top:660px"><div class="f05-dfill"></div><div class="f05-dlit"></div></div>
      <div class="f05-drawer" id="f05-drawer-1" style="top:702px"><div class="f05-dfill"></div><div class="f05-dlit"></div></div>
      <div class="f05-drawer" id="f05-drawer-2" style="top:744px"><div class="f05-dfill"></div><div class="f05-dlit"></div></div>
      <div class="f05-drawer" id="f05-drawer-3" style="top:786px"><div class="f05-dfill"></div><div class="f05-dlit"></div></div>

      <div id="f05-token"></div>

    <div id="f05-hdr">
      <div class="f05-track"><span class="f05-pill is-current"><b class="f05-n">1</b>อ่านได้</span><span class="f05-pill"><b class="f05-n">2</b>ค้นเจอ</span><span class="f05-pill"><b class="f05-n">3</b>ตามสิทธิ์</span></div>
      <span class="f05-term">Ingest → Index</span>
    </div>

    <div id="f05-h2"><span class="f05-line"><span class="f05-ph">จากไฟล์</span> <span class="f05-ph">สู่ดัชนีที่ค้นได้</span></span></div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var world = $("f05-world");
      var token = $("f05-token");
      var focus = $("f05-focus");
      var ghostsHost = $("f05-ghosts");
      var segsHost = $("f05-segs");
      var microTxt = $("f05-micro-txt");

      // ---- layout constants (world px) ----
      var CY = 500;
      var S = 1.2; // form scale inside token + imprints (.f05-form)
      var CARD_L = [96, 393.6, 691.2, 988.8, 1286.4, 1584];
      var CX = [216, 513.6, 811.2, 1108.8, 1406.4, 1704];
      var CUE = [1.0, 1.8, 2.6, 3.6, 4.4, 5.2];

      // token-local geometry (origin = station centre). [left, top, w, h]
      var BARS = [[-26, -38, 36, 6], [-26, -22, 52, 5], [-26, -6, 46, 5], [-26, 10, 52, 5]];
      var PARSED = [[-36, -40, 44, 9], [-36, -16, 72, 5], [-36, -4, 64, 5], [-36, 8, 72, 5]];
      var JIT = [0, 9, -7, 5];
      var CHX = [-66, -22, 22, 66];
      var EY = [-18, 10, -6, 16];
      var DROP_Y = [675, 717, 759, 801].map(function (v) { return (v - CY) / S; }); // drawer centres, form-local

      // fixed seeded noise (deterministic function of index)
      function rnd(i) { var s = Math.sin(i * 91.7 + 3.1) * 43758.5453; return s - Math.floor(s); }
      var SPECK = [0, 1, 2, 3].map(function (i) {
        return [(i % 2 === 0 ? -58 : 50) + rnd(i) * 8, -38 + i * 14 + rnd(i + 7) * 6];
      });
      function chunkBar(k) { return [CHX[k] - 10, -14, 20, k === 0 ? 6 : 4]; }

      function mk(parent, cls, css, html) {
        var d = document.createElement("div");
        if (cls) d.className = cls;
        if (css) for (var p in css) d.style[p] = css[p];
        if (html) d.innerHTML = html;
        parent.appendChild(d);
        return d;
      }
      function box(r) { return { left: r[0] + "px", top: r[1] + "px", width: r[2] + "px", height: r[3] + "px" }; }
      var CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3 8.6 L6.6 12 L13 4.6" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function addChunkCard(parent, k) {
        var c = mk(parent, "f05-chunk", { left: (CHX[k] - 18) + "px" });
        mk(c, "f05-cl", { top: "18px", width: "20px" });
        mk(c, "f05-cl", { top: "26px", width: "14px" });
        return c;
      }

      // ---- connector line segments ----
      var segFills = [];
      var leadIn = mk(segsHost, "f05-seg", { left: "-40px", width: (CARD_L[0] + 40) + "px" });
      segFills.push(mk(leadIn, "f05-seg-fill"));
      for (var s = 0; s < 5; s++) {
        var sg = mk(segsHost, "f05-seg", { left: (CARD_L[s] + 240) + "px", width: (CARD_L[s + 1] - CARD_L[s] - 240) + "px" });
        segFills.push(mk(sg, "f05-seg-fill"));
      }

      // ---- station imprints (what each station left behind) ----
      var ghosts = [];
      var gforms = [];
      for (var g = 0; g < 5; g++) { ghosts.push(mk(ghostsHost, "f05-ghost", { left: CX[g] + "px" })); gforms.push(mk(ghosts[g], "f05-form")); }
      (function (G) { // Ingest: checked file
        var t = mk(G, "f05-tile"); mk(t, "f05-band");
        BARS.forEach(function (b) { mk(G, "f05-bar", box(b)); });
        var f = mk(G, "f05-fname"); mk(f, "f05-fname-fill");
        mk(G, "f05-check", null, CHECK_SVG);
      })(gforms[0]);
      (function (G) { // Parse: heading/paragraph bars, ragged, with noise
        PARSED.forEach(function (b, k) { mk(G, "f05-bar" + (k === 0 ? " is-head" : ""), box([b[0] + JIT[k], b[1], b[2], b[3]])); });
        SPECK.forEach(function (p) { mk(G, "f05-speck", { left: p[0] + "px", top: p[1] + "px" }); });
      })(gforms[1]);
      (function (G) { // Clean: aligned, no noise
        PARSED.forEach(function (b, k) { mk(G, "f05-bar" + (k === 0 ? " is-head" : ""), box(b)); });
      })(gforms[2]);
      (function (G) { // Chunk: four small cards
        for (var k = 0; k < 4; k++) addChunkCard(G, k);
        for (var j = 0; j < 4; j++) mk(G, "f05-bar" + (j === 0 ? " is-head" : ""), box(chunkBar(j)));
      })(gforms[3]);
      (function (G) { // Embed: four dots
        for (var k = 0; k < 4; k++) mk(G, "f05-dot", { left: (CHX[k] - 10) + "px", top: (EY[k] - 10) + "px" });
      })(gforms[4]);

      // ---- the travelling token ----
      var tf = mk(token, "f05-form");
      var tile = mk(tf, "f05-tile"); mk(tile, "f05-band");
      var fname = mk(tf, "f05-fname"); var fnameFill = mk(fname, "f05-fname-fill");
      var check = mk(tf, "f05-check", null, CHECK_SVG);
      var chunks = []; for (var c = 0; c < 4; c++) chunks.push(addChunkCard(tf, c));
      var bars = BARS.map(function (b) { return mk(tf, "f05-bar", box(b)); });
      var headHL = mk(bars[0], "f05-bar-hl");
      var specks = SPECK.map(function (p) { return mk(tf, "f05-speck", { left: p[0] + "px", top: p[1] + "px" }); });
      var dots = CHX.map(function (x) { return mk(tf, "f05-dot", { left: (x - 10) + "px" }); });

      // bar transform that maps base box -> target box (transform-origin: left centre)
      function toBox(k, r) {
        var b = BARS[k];
        return { x: r[0] - b[0], y: (r[1] + r[3] / 2) - (b[1] + b[3] / 2), scaleX: r[2] / b[2], scaleY: r[3] / b[3] };
      }

      // ---- camera: one driver, one writer (viewport-change lock) ----
      var e3o = gsap.parseEase("power3.out");
      var e3io = gsap.parseEase("power3.inOut");
      function camX(t) {
        if (t <= 0.3) return -60;
        if (t < 1.02) return -60 + (CX[0] + 60) * e3o((t - 0.3) / 0.72);
        var x = CX[0];
        for (var k = 1; k < 6; k++) {
          var a = CUE[k] - 0.48, b = CUE[k] + 0.02;
          if (t <= a) return x;
          if (t < b) return x + (CX[k] - x) * e3io((t - a) / (b - a));
          x = CX[k];
        }
        return x;
      }
      var MICRO = [
        { t: 0, html: "" },
        { t: 2.9, html: '<span class="f05-m-old">๒๕๖๙</span>' },
        { t: 3.06, html: '<span class="f05-m-old">๒๕๖๙</span> <span class="f05-m-arr">→</span>' },
        { t: 3.22, html: '<span class="f05-m-old is-done">๒๕๖๙</span> <span class="f05-m-arr">→</span> <span class="f05-m-new">2569</span>' }
      ];
      var microIdx = -1;
      function render(t) {
        var tx = camX(t);
        token.style.transform = "translate(" + tx + "px, 0px)";
        focus.style.transform = "translate(" + tx + "px, 0px)";
        var wx = (960 - tx) * 0.015; // camera leans with the token (focus-lock, damped)
        world.style.transform = "translate(" + wx + "px, 0px)";
        var i = MICRO.length - 1;
        while (i > 0 && t < MICRO[i].t) i--;
        if (i !== microIdx) { microTxt.innerHTML = MICRO[i].html; microIdx = i; }
      }
      render(0);

      var tl = gsap.timeline({ paused: true });
      var drv = { t: 0 };
      tl.to(drv, { t: 9, duration: 9, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

      // ---- Scene 1 (0.0–1.0): headline per phrase; dim strip + line ----
      tl.fromTo("#f05-h2 .f05-ph", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.16 }, 0.3);
      tl.fromTo(".f05-card", { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: "power2.out", stagger: 0.05 }, 0.05);
      tl.fromTo(".f05-seg", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.04 }, 0.05);
      // lead-in line fills as the token slides in from the left
      tl.fromTo(segFills[0], { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "none" }, 0.32);
      tl.fromTo(focus, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.8);

      // ---- Scene 2 (1.0–6.0): one station per cue; lit stations stay lit ----
      function lightStation(k) {
        tl.to("#f05-card-" + k, { opacity: 1, duration: 0.3, ease: "power2.out" }, CUE[k] - 0.12);
        tl.fromTo("#f05-lab-" + k + " .f05-lab-th", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUE[k]);
        tl.fromTo("#f05-lab-" + k + " .f05-lab-en", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE[k] + 0.08);
      }
      function depart(k) { // token leaves station k toward k+1: line fills, station keeps an imprint
        var dep = CUE[k + 1] - 0.48;
        tl.fromTo(segFills[k + 1], { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "none" }, dep + 0.12);
        tl.fromTo(ghosts[k], { opacity: 0 }, { opacity: 0.38, duration: 0.35, ease: "power2.out" }, dep + (k === 4 ? 0.32 : 0.28));
      }
      for (var k = 0; k < 6; k++) lightStation(k);
      for (var d = 0; d < 5; d++) depart(d);

      // Ingest (1.0): the filename is read, then checked
      tl.fromTo(fnameFill, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.inOut" }, 1.02);
      tl.fromTo(check, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 1.2);

      // Parse (1.8): the file opens into heading / paragraph bars (ragged, with noise)
      tl.to(tile, { opacity: 0, scale: 1.1, duration: 0.3, ease: "power2.out" }, 1.8);
      tl.to([fname, check], { opacity: 0, duration: 0.2, ease: "power1.out" }, 1.8);
      bars.forEach(function (el, i) {
        var r = PARSED[i];
        tl.to(el, Object.assign(toBox(i, [r[0] + JIT[i], r[1], r[2], r[3]]), { duration: 0.42, ease: "power3.out" }), 1.82 + i * 0.035);
      });
      tl.fromTo(headHL, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.86);
      tl.fromTo(specks, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.04 }, 1.98);

      // Clean (2.6): noise removed, lines aligned; micro readout swaps in place (2.9)
      tl.to(specks, { opacity: 0, scale: 0, duration: 0.22, ease: "power2.in", stagger: 0.04 }, 2.62);
      bars.forEach(function (el, i) {
        tl.to(el, { x: PARSED[i][0] - BARS[i][0], duration: 0.32, ease: "power3.inOut" }, 2.66 + i * 0.03);
      });
      tl.fromTo("#f05-micro", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 2.88);

      // Chunk (3.6): four small cards split out, each takes one bar
